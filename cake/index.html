<style>

<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SY = .56;           // vertical squash of the 3/4 view
  const SPLIT = .22;        // how far each half slides apart (cake radius units)
  const O0 = { x: 0, y: 0 };

  let W, H, DPR, R, ZH, cx, cyPlay, cyTitle, cyResult, camY = null;
  let state = 'title', T = 0;
  let cake = null, cut = null, drag = null;
  let knifeT = 0, splitT = 0, labelT = 0, resWait = 0, countT = 1, dropT = 1;
  let shake = 0, lastRes = null, cloth = null, pores = null, toastTimer = 0;

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-cake-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-cake-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, noiseBuf = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function hiss(dur, f0, f1, vol, delay = 0) {
    if (!AC || muted || !noiseBuf) return;
    const t = AC.currentTime + delay;
    const src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.2;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const gn = AC.createGain();
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + dur * .25); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(f).connect(gn).connect(AC.destination); src.start(t); src.stop(t + dur + .02);
  }
  const sfx = {
    tick: () => tone(1500, .04, 'square', .025),
    slice: () => { hiss(.55, 3200, 1100, .22); hiss(.3, 900, 500, .12, .25); },
    split: () => { tone(150, .22, 'triangle', .3, -60); tone(520, .1, 'sine', .08, -200, .04); },
    nope: () => { tone(330, .14, 'triangle', .12, -120); tone(250, .18, 'triangle', .1, -80, .1); },
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => { tone(220, .4, 'sawtooth', .07, -80); }
  };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();

  // ---------- cake model (unit radius, plan view; rules ported from classic) ----------
  function makeCake() {
    const a = rand(0, 6.28), b = rand(0, 6.28), k1 = rand(.1, .2), k2 = rand(.05, .13);
    const rf = th => 1 + k1 * Math.sin(2 * th + a) + k2 * Math.sin(3 * th + b);
    const inside = (x, y) => Math.hypot(x, y) < rf(Math.atan2(y, x));
    const outline = [];
    for (let i = 0; i < 160; i++) { const th = i / 160 * Math.PI * 2, r = rf(th); outline.push({ x: Math.cos(th) * r, y: Math.sin(th) * r }); }
    const samples = [];
    while (samples.length < 6000) { const x = rand(-1.4, 1.4), y = rand(-1.4, 1.4); if (inside(x, y)) samples.push({ x, y }); }
    // piped rosettes around the rim, a strawberry on every other one
    const decos = [], ph = rand(0, 6.28), nR = 12;
    for (let k = 0; k < nR; k++) {
      const th = ph + k / nR * Math.PI * 2, r = rf(th) * .8;
      decos.push({ t: 'ros', x: Math.cos(th) * r, y: Math.sin(th) * r, s: rand(.94, 1.06), rot: rand(0, 6.28), berry: k % 2 === 0, bs: rand(.92, 1.06), tilt: rand(-.12, .12) });
    }
    let tries = 0; const inner = [];
    while (inner.length < 3 && tries++ < 300) {
      const th = rand(0, 6.28), r = rf(th) * rand(0, .42);
      const p = { t: 'berry', x: Math.cos(th) * r, y: Math.sin(th) * r, bs: rand(1.05, 1.2), tilt: rand(-.25, .25) };
      if (inner.every(q => Math.hypot(q.x - p.x, q.y - p.y) > .3)) inner.push(p);
    }
    decos.push(...inner);
    decos.sort((p, q) => p.y - q.y);
    // strawberry slices peeking out of the cream layer on the side wall
    const slices = [];
    for (let i = 3; i < 160; i += 9) {
      const p = outline[i], q = outline[(i + 1) % 160], o = outline[(i + 159) % 160];
      let nx = q.y - o.y, ny = -(q.x - o.x); const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      if (nx * p.x + ny * p.y < 0) { nx = -nx; ny = -ny; }
      slices.push({ x: p.x, y: p.y, ny, w: rand(.85, 1.15) });
    }
    return { outline, samples, decos, slices };
  }

  // ---------- layout ----------
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    R = Math.min(W * .29, H * .22, 190);
    ZH = R * .42;
    cx = W / 2;
    const below = R * 1.55 * SY;                       // plate extent under centre

    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(a[0], a[1] + 1.6); g.lineTo(b[0], b[1] + 1.6); g.stroke();
    g.restore();
  }
  function drawKnife() {
    if (!cut || !(state === 'knife' || (state === 'split' && splitT < .45))) return;
    const k = state === 'knife' ? easeInOut(clamp(knifeT, 0, 1)) : 1;
    const t = cut.tA - .3 + (cut.tB - cut.tA + .6) * k;
    const lift = state === 'split' ? easeOut(splitT / .45) * R * .7 : 0;
    const alpha = state === 'split' ? 1 - splitT / .45 : clamp(knifeT * 8, 0, 1);
    const bl = .7, bh = R * .22, z0 = ZH - 2 + lift;
    g.save(); g.globalAlpha = clamp(alpha, 0, 1);
    // shadow of the knife on the cake
    const s0 = knifeAt(t - bl - .45, ZH - 4), s1 = knifeAt(t, ZH - 4);
    g.strokeStyle = 'rgba(80,50,30,.14)'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(s0[0] + 6, s0[1] + 5); g.lineTo(s1[0] + 6, s1[1] + 5); g.stroke();
    // blade
    const tip = knifeAt(t, z0), heel = knifeAt(t - bl, z0), heelTop = knifeAt(t - bl, z0 + bh), spine = knifeAt(t - .14, z0 + bh * .9), ctl = knifeAt(t - .02, z0 + bh * .55);
    const bg = g.createLinearGradient(0, heelTop[1], 0, heel[1]);
    bg.addColorStop(0, '#f6f8f9'); bg.addColorStop(.35, '#c9d0d4'); bg.addColorStop(.7, '#e9eef0'); bg.addColorStop(1, '#8f989d');
    g.fillStyle = bg;
    g.beginPath(); g.moveTo(heel[0], heel[1]); g.lineTo(tip[0], tip[1]); g.quadraticCurveTo(ctl[0], ctl[1], spine[0], spine[1]); g.lineTo(heelTop[0], heelTop[1]); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(70,78,84,.55)'; g.lineWidth = 1; g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(heel[0], heel[1] - 1.5); g.lineTo(tip[0], tip[1] - 1.5); g.stroke();
    // bolster + handle
    const hA = knifeAt(t - bl, z0 + bh * .18), hB = knifeAt(t - bl - .48, z0 + bh * .28), hC = knifeAt(t - bl - .48, z0 + bh * .92), hD = knifeAt(t - bl, z0 + bh * .95);
    const hm = knifeAt(t - bl - .56, z0 + bh * .6);
    const hg = g.createLinearGradient(0, hD[1], 0, hA[1]);
    hg.addColorStop(0, '#6b4a36'); hg.addColorStop(.4, '#4a3224'); hg.addColorStop(1, '#2e1f16');
    g.fillStyle = hg;
    g.beginPath(); g.moveTo(hA[0], hA[1]); g.lineTo(hB[0], hB[1]); g.quadraticCurveTo(hm[0], hm[1], hC[0], hC[1]); g.lineTo(hD[0], hD[1]); g.closePath(); g.fill();
    g.fillStyle = '#b9c0c4';
    for (const u of [.12, .3]) { const r = knifeAt(t - bl - u, z0 + bh * .58); g.beginPath(); g.arc(r[0], r[1], Math.max(1.5, R * .012), 0, 7); g.fill(); }
    g.restore();
  }
  function drawGuide() {
    if (state !== 'drag' || !drag) return;
    const { s0, s1 } = drag;
    const dx = s1.x - s0.x, dy = s1.y - s0.y, len = Math.hypot(dx, dy);
    if (len < 4) { g.fillStyle = 'rgba(58,42,32,.5)'; g.beginPath(); g.arc(s0.x, s0.y, 4, 0, 7); g.fill(); return; }
    const ux = dx / len, uy = dy / len;
    g.save(); g.lineCap = 'round';
    g.setLineDash([2, 8]); g.strokeStyle = 'rgba(58,42,32,.4)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(s0.x - ux * 2000, s0.y - uy * 2000); g.lineTo(s0.x + ux * 2000, s0.y + uy * 2000); g.stroke();
    g.setLineDash([]);
    g.strokeStyle = 'rgba(58,42,32,.22)'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(s0.x + 2, s0.y + 4); g.lineTo(s1.x + 2, s1.y + 4); g.stroke();
    const lg = g.createLinearGradient(s0.x, s0.y, s1.x, s1.y);
    lg.addColorStop(0, '#9aa3a8'); lg.addColorStop(.5, '#ffffff'); lg.addColorStop(1, '#b6bec2');
    g.strokeStyle = lg; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(s0.x, s0.y); g.lineTo(s1.x, s1.y); g.stroke();
    g.strokeStyle = 'rgba(194,64,42,.9)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(s0.x - uy * 1.6, s0.y + ux * 1.6); g.lineTo(s1.x - uy * 1.6, s1.y + ux * 1.6); g.stroke();
    g.fillStyle = '#fffaf2'; g.strokeStyle = '#3a2a20'; g.lineWidth = 2;
    for (const p of [s0, s1]) { g.beginPath(); g.arc(p.x, p.y, p === s1 ? 7 : 5, 0, 7); g.fill(); g.stroke(); }
    g.restore();
  }
  function drawLabels() {
    if (!cut || labelT <= 0) return;
    const k = reduced ? 1 : easeBack(clamp(labelT, 0, 1));
    const cnt = reduced ? 1 : easeOut(clamp(labelT * 1.3, 0, 1));
    const big = cut.pct > 50.05 ? 1 : cut.pct < 49.95 ? -1 : 0;
    for (const side of [1, -1]) {
      const c = side === 1 ? cut.lc : cut.rc, v = side === 1 ? cut.pct : 100 - cut.pct, o = offOf(side);
      const [x, y] = P(c.x + o.x, c.y + o.y, ZH + R * .34);
      g.save(); g.translate(x, y); g.scale(k, k);
      const w = 84, h = 36;
      g.shadowColor = 'rgba(58,42,32,.3)'; g.shadowBlur = 10 * DPR; g.shadowOffsetY = 3 * DPR;
      g.fillStyle = big === side ? '#c2402a' : 'rgba(58,42,32,.92)';
      rrect(-w / 2, -h / 2, w, h, h / 2); g.fill();
      g.beginPath(); g.moveTo(-6, h / 2 - 1); g.lineTo(0, h / 2 + 7); g.lineTo(6, h / 2 - 1); g.fill();
      g.shadowColor = 'transparent';
      g.fillStyle = '#fffaf2'; g.textAlign = 'left'; g.textBaseline = 'middle';
      const num = (v * cnt).toFixed(1);
      g.font = '400 20px "DM Serif Display", serif';
      const nw = g.measureText(num).width;
      g.font = '700 11px "Noto Sans TC", sans-serif';
      const pw = g.measureText('%').width, x0 = -(nw + 2 + pw) / 2;
      g.fillText('%', x0 + nw + 2, 4);
      g.font = '400 20px "DM Serif Display", serif';
      g.fillText(num, x0, 1);
      g.restore();
    }
  }

  // ---------- game flow ----------
  const OPTS = ['兄妹兩人分・不准吵', '室友兩人分・要公平', '情侶兩人分・別小氣', '同事兩人分・看著辦', '雙胞胎分・會比較'];
  function newRound(fresh) {
    if (window.DGH_DAILY) { DGH_DAILY.reseed(); fresh = true; }
    if (fresh) { cake = makeCake(); dropT = 0; }
    cut = null; drag = null; knifeT = 0; splitT = 0; labelT = 0; resWait = 0; countT = 1;
    $('ordNo').textContent = 'No.' + String(Math.floor(rand(1, 9999))).padStart(4, '0');
    $('ordOpt').textContent = OPTS[Math.floor(rand(0, OPTS.length))];
    const slip = $('slip'); slip.hidden = true; void slip.offsetWidth; slip.hidden = false;
    $('sheet').hidden = true; $('title').hidden = true; $('toast').hidden = true;
    $('hint').hidden = false;
    state = 'ready';
  }
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.hidden = true; void el.offsetWidth; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; if (state === 'ready') $('hint').hidden = false; }, 1700);
    sfx.nope();
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
  }

  function tryCut(s0, s1) {
    // identical rules to the classic version, measured on the cake's top face
    const len = Math.hypot(s1.x - s0.x, s1.y - s0.y);
    if (len < 30) { toast('劃太短了，再劃長一點'); return; }
    const p0 = toPlan(s0), p1 = toPlan(s1);
    const dx = p1.x - p0.x, dy = p1.y - p0.y, l = Math.hypot(dx, dy);
    const d = { x: dx / l, y: dy / l }, n = { x: -d.y, y: d.x };
    let left = 0, lx = 0, ly = 0, rx = 0, ry = 0;
    for (const s of cake.samples) {
      if (d.x * (s.y - p0.y) - d.y * (s.x - p0.x) > 0) { left++; lx += s.x; ly += s.y; } else { rx += s.x; ry += s.y; }
    }
    const N = cake.samples.length;
    if (left < N * .01 || left > N * .99) { toast('沒切到蛋糕喔，要整刀劃過去'); return; }
    const pct = left / N * 100;
    cut = { p0, d, n, pct, lc: { x: lx / left, y: ly / left }, rc: { x: rx / (N - left), y: ry / (N - left) }, seed: rand(0, 100) };
    // where the knife enters / leaves the outline
    let tA = Infinity, tB = -Infinity;
    const o = cake.outline;
    for (let i = 0; i < o.length; i++) {
      const a = o[i], b = o[(i + 1) % o.length], ca = cutSide(a), cb = cutSide(b);
      if ((ca > 0) !== (cb > 0)) {
        const t = ca / (ca - cb), x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
        const u = (x - p0.x) * d.x + (y - p0.y) * d.y;
        tA = Math.min(tA, u); tB = Math.max(tB, u);
      }
    }
    cut.tA = tA; cut.tB = tB;
    cut.A = { x: p0.x + d.x * tA, y: p0.y + d.y * tA }; cut.B = { x: p0.x + d.x * tB, y: p0.y + d.y * tB };
    if (cut.A.x > cut.B.x) { const tmp = cut.A; cut.A = cut.B; cut.B = tmp; }
    cut.halves = { 1: clipPoly(o, 1), '-1': clipPoly(o, -1) };
    cut.back = n.y < 0 ? 1 : -1;   // the half sliding away from the camera shows its cut face
    const score = Math.max(0, Math.round((100 - Math.abs(50 - pct) * 4) * 10) / 10);
    const a = Math.max(pct, 100 - pct).toFixed(1), b = Math.min(pct, 100 - pct).toFixed(1);
    const c = score >= 96 ? '兄弟姊妹都沒話說。' : score >= 88 ? '小的那塊會被搶，但不會吵架。' : score >= 70 ? '有人要哭了。' : '這不叫平分，這叫獨佔。';
    cut.res = { score, a, b, c };
    $('hint').hidden = true; $('toast').hidden = true;
    if (reduced) { state = 'split'; splitT = 1; knifeT = 1; sfx.split(); }
    else { state = 'knife'; knifeT = 0; sfx.slice(); }
  }

  function finish() {
    state = 'result';
    const { score, a, b, c } = cut.res;
    let rk, role;
    if (score >= 96) { rk = 'S'; role = '甜點主廚'; }
    else if (score >= 88) { rk = 'A'; role = '公平的大哥'; }
    else if (score >= 70) { rk = 'B'; role = '會被抱怨的人'; }
    else { rk = 'C'; role = '自己吃大塊'; }
    const prev = getBest(); const isNew = prev == null || score > prev;
    if (isNew) setBest(score);
    window.DGH_DAILY && DGH_DAILY.save(score);
    $('rank').textContent = rk; $('role').textContent = role;
    $('score').textContent = reduced ? score.toFixed(1) : '0.0';
    countT = reduced ? 1 : 0;
    const bestLine = isNew ? `<br><span class="newbest">刷新個人最高紀錄</span>` : `<br>個人最高：${prev.toFixed(1)} 分`;
    $('detail').innerHTML = `兩塊比例 <b>${a} : ${b}</b>。${c}` + bestLine;
    lastRes = { score, rk, role, a, b };
    $('slip').hidden = true;
    $('sheet').hidden = false;
    measureResult();
    if (rk === 'S') sfx.win(); else if (rk === 'C') sfx.bad(); else sfx.ok();
    if (navigator.vibrate) try { navigator.vibrate(rk === 'S' ? [20, 40, 20] : 15); } catch (e) {}
    if (rk === 'S' && !reduced) burst();
  }

  let confetti = [];
  function burst() {
    const cols = ['#c2402a', '#6f8f78', '#e7b75f', '#3a2a20', '#f2a7a0'];
    for (let i = 0; i < 90; i++) confetti.push({ x: W / 2 + rand(-40, 40), y: camY - ZH - R * .5, vx: rand(-260, 260), vy: rand(-520, -180), r: rand(3, 6), c: cols[i % cols.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.6) });
  }

  // ---------- input ----------
  const pos = e => ({ x: e.clientX, y: e.clientY });
  function press(e) {
    if (e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state !== 'ready') return;
    e.preventDefault();
    drag = { s0: pos(e), s1: pos(e), id: e.pointerId };
    state = 'drag'; $('hint').hidden = true; $('toast').hidden = true;
    sfx.tick();
  }
  function move(e) { if (state === 'drag' && drag && e.pointerId === drag.id) drag.s1 = pos(e); }
  function release(e) {
    if (state !== 'drag' || !drag || (e && e.pointerId !== drag.id)) return;
    if (e && e.type === 'pointerup') drag.s1 = pos(e);
    const { s0, s1 } = drag; drag = null; state = 'ready';
    tryCut(s0, s1);
  }
  addEventListener('pointerdown', press, { passive: false });
  addEventListener('pointermove', move);
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
  addEventListener('contextmenu', e => e.preventDefault());

  $('go').addEventListener('click', () => { initAudio(); newRound(false); });
  $('again').addEventListener('click', () => { initAudio(); newRound(true); });
  $('share').addEventListener('click', async () => {
    if (!lastRes) return;
    let msg = `我在《蛋糕切一半》把草莓蛋糕切成 ${lastRes.a} : ${lastRes.b}，拿到 ${lastRes.score.toFixed(1)} 分（${lastRes.rk} 級・${lastRes.role}）！換你切切看：`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: '蛋糕切一半', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- loop ----------
  let last = 0;
  function step(dt) {
    T += dt;
    const tgt = state === 'title' ? cyTitle : state === 'result' ? cyResult : cyPlay;
    camY += (tgt - camY) * (reduced ? 1 : 1 - Math.pow(.003, dt));
    if (dropT < 1) dropT = Math.min(1, dropT + dt * 2.4);
    if (state === 'knife') {
      knifeT += dt / .62;
      if (knifeT >= 1) { knifeT = 1; state = 'split'; splitT = 0; sfx.split(); shake = .12; if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {} }
    } else if (state === 'split') {
      splitT = Math.min(1, splitT + dt / .6);
      if (splitT >= 1) { resWait += dt; if (resWait > (reduced ? .2 : .55)) finish(); }
    }
    if (cut && (state === 'split' || state === 'result') && splitT > .5) labelT = Math.min(1, labelT + dt * 2.6);
    if (state === 'result' && countT < 1 && lastRes) {
      countT = Math.min(1, countT + dt / .9);
      $('score').textContent = (lastRes.score * easeOut(countT)).toFixed(1);
    }
    for (const c of confetti) { c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .99; c.rot += c.vr * dt; c.life -= dt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - dt);
  }
  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    g.drawImage(cloth, 0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-2, 2) * shake * 6, rand(-1, 1) * shake * 6);
    drawPlate();
    if (cake) {
      if (!cut || state === 'knife') drawPiece(cake.outline, O0, undefined, false);
      else {
        const front = -cut.back, faceOk = Math.abs(cut.n.y) > .04;
        drawPiece(cut.halves[cut.back], offOf(cut.back), cut.back, faceOk);
        drawPiece(cut.halves[front], offOf(front), front, false);
      }
    }
    drawGroove();
    drawKnife();
    drawGuide();
    drawLabels();
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  cake = makeCake();
  fit();
  const b = getBest();
  $('bestTitle').textContent = b == null ? '今天還沒切過蛋糕' : `個人最高紀錄 ${b.toFixed(1)} 分`;
  requestAnimationFrame(frame);
})();
</script>
</body>
