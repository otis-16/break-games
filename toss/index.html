<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const THROWS = 10;
  const GR = 9.8, BR = .045, RIM_R = .24, RIM_Y = .4, DESK_Y = .78, DESK_Z = 1.05, WALL_Z = 6.5, CAM_Y = 1.3;
  const RANKS = [[180, 'S', '辦公室 MVP'], [110, 'A', '投籃高手'], [50, 'B', '還可以'], [0, 'C', '丟到老闆頭上']];

  let W, H, DPR, F, HY;
  let state = 'title', T = 0, slow = 1, slowT = 0;
  let plan = [], idx = 0, score = 0, makes = 0, swishes = 0, streak = 0, bestStreak = 0, nearMiss = 0;
  let bx = 0, bz = 4, bx0 = 0, wind = 0, windLv = 0, windDir = 1, binMove = 0, binPh = 0, binPop = 1;
  let ball = null, hold = null, endT = 0, cross = null, slowDone = false;
  let parts = [], pops = [], streaks = [], confetti = [], trail = [];
  let shake = 0, binWob = 0, fanRot = 0, boss = 0, lastRes = null;
  let kw = { mood: 'normal', t: 0, say: '', sayT: 0, blink: 0, nextBlink: 2 };
  let shape = [], creases = [];

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-toss-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-toss-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, NB = null, windGain = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = AC.createBufferSource(); src.buffer = NB; src.loop = true;
      const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
      windGain = AC.createGain(); windGain.gain.value = 0;
      src.connect(f).connect(windGain).connect(AC.destination); src.start();
    } catch (e) { AC = null; }
  }
  function setWind(v) { if (AC && windGain) windGain.gain.setTargetAtTime(muted ? 0 : v * .09, AC.currentTime, .2); }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, freq, q = 1, vol = .2, to = 0, delay = 0) {
    if (!AC || muted || !NB) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const gn = AC.createGain(); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .008); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, Math.random() * 1.5); s.stop(t + dur + .02);
  }
  const sfx = {
    crumple: () => { for (let i = 0; i < 4; i++) noise(.05, rand(2500, 5000), 2, .12, 0, i * .035); },
    whoosh: v => noise(.35, 500, .8, .18 + v * .05, 2400),
    rim: v => { tone(880, .25, 'triangle', .12 * v + .05); tone(1320, .18, 'sine', .06 * v + .02, 0, .01); noise(.06, 3000, 3, .08); },
    wall: () => noise(.12, 700, 1.2, .14),
    tap: () => noise(.07, 1800, 1.5, .1),
    make: () => { noise(.18, 400, .7, .25, 150); [523, 659, 784].forEach((f, i) => tone(f, .22, 'sine', .12, 0, .08 + i * .07)); },
    swish: () => { noise(.3, 3000, .6, .12, 900); [659, 880, 1175, 1568].forEach((f, i) => tone(f, .25, 'sine', .11, 0, .06 + i * .06)); },
    miss: () => tone(300, .35, 'triangle', .1, -140),
    boss: () => { tone(140, .3, 'sawtooth', .08, -30); tone(110, .4, 'sawtooth', .07, -20, .15); },
    tick: () => tone(1400, .04, 'square', .03),
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => { tone(220, .4, 'sawtooth', .07, -80); }
  };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio(); setWind(state === 'title' ? 0 : windLv / 3);
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();
  const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };

  // ---------- layout ----------
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    F = Math.min(W * 1.15, H * .6);
    HY = H * .3;
  }
  const P = (x, y, z) => { const s = F / Math.max(z, .05); return { x: W / 2 + x * s, y: HY + (CAM_Y - y) * s, s }; };
  function rrect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  function makeBallLook() {
    shape = []; for (let i = 0; i < 13; i++) shape.push(rand(.88, 1.06));
    creases = [];
    for (let i = 0; i < 7; i++) {
      const a = rand(0, 6.28), l = rand(.5, 1.1), pts = [];
      let x = Math.cos(a) * rand(0, .5), y = Math.sin(a) * rand(0, .5), d = rand(0, 6.28);
      for (let k = 0; k < 4; k++) { pts.push([x, y]); d += rand(-1.1, 1.1); x += Math.cos(d) * l * .3; y += Math.sin(d) * l * .3; }
      creases.push(pts);
    }
  }

  // ---------- KEWEI ----------
  function drawKewei(x, y, r, o = {}) {
    const mood = o.mood || 'normal', lx = o.lx || 0, ly = o.ly || 0, blink = o.blink || 0;
    g.save(); g.translate(x, y); if (o.tilt) g.rotate(o.tilt);
    const earA = mood === 'angry' ? 1.0 : mood === 'sad' ? .8 : .5;
    for (const s of [-1, 1]) {
      g.save(); g.translate(s * r * .55, -r * .6); g.rotate(s * earA);
      g.beginPath(); g.moveTo(-r * .34, r * .2); g.quadraticCurveTo(-r * .14, -r * .64, 0, -r * .62); g.quadraticCurveTo(r * .14, -r * .64, r * .34, r * .2); g.closePath();
      g.fillStyle = '#f9e6d2'; g.fill();
      g.beginPath(); g.moveTo(-r * .2, r * .12); g.quadraticCurveTo(-r * .07, -r * .42, 0, -r * .42); g.quadraticCurveTo(r * .07, -r * .42, r * .2, r * .12); g.closePath();
      g.fillStyle = '#ffc2cc'; g.fill();

  function binGeom() {
    const c = P(bx, RIM_Y, bz), f = P(bx, RIM_Y, bz - RIM_R), k = P(bx, RIM_Y, bz + RIM_R);
    const bc = P(bx, 0, bz), bf = P(bx, 0, bz - RIM_R * .82), bk = P(bx, 0, bz + RIM_R * .82);
    return { cx: c.x, cy: (f.y + k.y) / 2, rx: RIM_R * c.s, ry: Math.max(1, (f.y - k.y) / 2), bcx: bc.x, bcy: (bf.y + bk.y) / 2, brx: RIM_R * .82 * bc.s, bry: Math.max(1, (bf.y - bk.y) / 2) };
  }
  function binTransform(G) {
    const sc = binPop < 1 ? 1 - Math.pow(1 - binPop, 3) : 1;
    const w = Math.sin(binWob * 18) * binWob * .08;
    g.translate(G.bcx, G.bcy); g.scale(sc * (1 + w), sc * (1 - w)); g.translate(-G.bcx, -G.bcy);
  }
  function drawBinBack() {
    const G = binGeom();

    binTransform(G);
    const ig = g.createLinearGradient(0, G.cy - G.ry, 0, G.cy + G.ry);
    ig.addColorStop(0, '#7f9a87'); ig.addColorStop(.6, '#3e5246'); ig.addColorStop(1, '#2b3a31');
    g.fillStyle = ig; g.beginPath(); g.ellipse(G.cx, G.cy, G.rx, G.ry, 0, 0, 7); g.fill();
    g.restore();
  }
  function drawBinFront() {
    const G = binGeom();

    g.beginPath();
    g.moveTo(G.cx - G.rx, G.cy);
    g.lineTo(G.bcx - G.brx, G.bcy);
    g.ellipse(G.bcx, G.bcy, G.brx, G.bry, 0, Math.PI, 0, true);
    g.lineTo(G.cx + G.rx, G.cy);
    g.ellipse(G.cx, G.cy, G.rx, G.ry, 0, 0, Math.PI, false);

    for (let i = -4; i <= 4; i++) { const u = i / 5; g.beginPath(); g.moveTo(G.cx + u * G.rx, G.cy + G.ry * Math.sqrt(1 - u * u)); g.lineTo(G.bcx + u * G.brx, G.bcy + G.bry * Math.sqrt(1 - u * u)); g.stroke(); }

    g.beginPath(); g.ellipse(G.cx, G.cy, G.rx, G.ry, 0, 0, 7); g.stroke();

  }

  function drawBall() {

  function rankOf(s) { for (const r of RANKS) if (s >= r[0]) return r; return RANKS[RANKS.length - 1]; }

  // ---------- input ----------

  // ---------- physics ----------
  function physics(h) {

    if (!b.inBin && b.y > .05) b.vx += wind * h;

      const lim = RIM_R * .82 - BR;
      if (rho > lim) { b.x = bx + dx / rho * lim; b.z = bz + dz / rho * lim; const vr = (b.vx * dx + b.vz * dz) / rho; if (vr > 0) { b.vx -= 1.4 * vr * dx / rho; b.vz -= 1.4 * vr * dz / rho; } }
      if (b.y < .03 + BR) { b.y = .03 + BR; b.vy = Math.abs(b.vy) * .2; b.vx *= .5; b.vz *= .5; b.vr *= .5; }
    } else if (b.y < RIM_Y && b.y > 0) {
      const rb = RIM_R * (.82 + .18 * b.y / RIM_Y) + BR;
      if (rho < rb && rho > RIM_R * .3) {
        b.x = bx + dx / rho * rb; b.z = bz + dz / rho * rb;
        const vr = (b.vx * dx + b.vz * dz) / rho;
        if (vr < 0) { b.vx -= 1.4 * vr * dx / rho; b.vz -= 1.4 * vr * dz / rho; if (-vr > .5) { sfx.wall(); binWob = Math.max(binWob, .4); } }
      }
    }
    if (b.z < DESK_Z && b.y < DESK_Y + BR && b.y > DESK_Y - .12) {
      b.y = DESK_Y + BR;
      if (b.vy < 0) { if (b.vy < -.6) { sfx.tap(); b.sq = .5; } b.vy = -b.vy * .3; b.vx *= .7; b.vz *= .7; b.vr *= .6; }
    }
    if (b.y < BR) {
      b.y = BR;
      if (b.vy < -.6) { sfx.tap(); b.sq = .5; }
      b.vy = Math.abs(b.vy) * .32; b.vx *= .72; b.vz *= .72; b.vr *= .7;
      if (b.z > 5.2 && !b.bossed && Math.abs(b.x - 1.7) < 1.6) { b.bossed = true; boss = 1.8; sfx.boss(); shake = .3; setTimeout(() => say('完蛋，是老闆⋯⋯', 'wide', 1.6), 250); }
    }
    if (b.z > WALL_Z - BR) { b.z = WALL_Z - BR; b.vz = -Math.abs(b.vz) * .4; sfx.wall(); }
    b.prevY = b.y;
  }

  // ---------- loop ----------
  let last = 0;
  function step(rdt) {
    if (slowT > 0) { slowT -= rdt; slow += (.3 - slow) * Math.min(1, rdt * 14); } else slow += (1 - slow) * Math.min(1, rdt * 6);
    const dt = rdt * slow;
    T += dt;
    fanRot += dt * (1 + windLv * 9);
    if (binPop < 1) binPop = Math.min(1, binPop + rdt * 2.6);
    if (binMove && (state === 'aim' || state === 'fly')) bx = bx0 + Math.sin(T * (1.1 + binMove) + binPh) * binMove;
    if (state === 'fly' && ball) {
      const b = ball;
      for (let i = 0; i < 6; i++) physics(dt / 6);
      b.t += dt;
      if (Math.random() < .6) trail.push({ x: b.x, y: b.y, z: b.z, a: 1 });
      // slow-mo when it is about to be decided at the rim
      const rho = Math.hypot(b.x - bx, b.z - bz);
      if (!slowDone && !reduced && b.vy < 0 && b.y < RIM_Y + .45 && b.y > RIM_Y && rho < RIM_R * 2.2) { slowDone = true; slowT = .55; }
      if (b.made) { endT += dt; if (endT > .9) endThrow(); }
      else {
        const sp = Math.hypot(b.vx, b.vy, b.vz);
        if ((b.t > .5 && sp < .3 && (b.y < BR + .01 || (b.z < DESK_Z && b.y < DESK_Y + BR + .01))) || b.t > 4 || Math.abs(b.x) > 4) endThrow();
      }
    }
    if (ball) ball.sq = Math.max(0, (ball.sq || 0) - rdt * 3);
    for (const t of trail) t.a -= rdt * 3;
    trail = trail.filter(t => t.a > 0);
    // wind streaks
    if (windLv > 0 && state !== 'title' && Math.random() < rdt * windLv * 5) streaks.push({ x: windDir > 0 ? -60 : W + 60, y: rand(HY * .55, H * .55), l: rand(30, 70), v: 160 + windLv * 140, a: rand(.15, .35) });
    for (const s of streaks) s.x += s.v * windDir * rdt;
    streaks = streaks.filter(s => s.x > -100 && s.x < W + 100);
    for (const p of parts) { p.vy += 700 * rdt; p.x += p.vx * rdt; p.y += p.vy * rdt; p.rot += p.vr * rdt; p.life -= rdt; }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops) p.t += rdt;
    pops = pops.filter(p => p.t < 1.1);
    for (const c of confetti) { c.vy += 700 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; c.vx *= .99; c.rot += c.vr * rdt; c.life -= rdt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - rdt);
    binWob = Math.max(0, binWob - rdt * 1.4);
    boss = Math.max(0, boss - rdt);
    if (kw.t > 0) { kw.t -= rdt; if (kw.t <= 0) kw.mood = 'normal'; }
    if (kw.sayT > 0) kw.sayT -= rdt;
    kw.nextBlink -= rdt; if (kw.nextBlink < 0) { kw.blink = 1; kw.nextBlink = rand(2, 4.5); }
    kw.blink = Math.max(0, kw.blink - rdt * 7);
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
    drawRoom();
    for (const s of streaks) { g.strokeStyle = `rgba(255,255,255,${s.a})`; g.lineWidth = 1.5; g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x - s.l * windDir, s.y); g.stroke(); }
    const b = ball;
    const far = b && b.z >= DESK_Z;
    drawBinBack();
    if (far && (b.inBin || b.z > bz)) drawBall();
    drawBinFront();
    if (far && !(b.inBin || b.z > bz)) drawBall();
    drawDesk();
    if (b && !far) drawBall();
    drawKeweiDesk();
    if (state !== 'title') drawWindSign();
    for (const p of parts) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.globalAlpha = clamp(p.life * 2, 0, 1); g.fillStyle = p.c; g.fillRect(-p.r, -p.r * .7, p.r * 2, p.r * 1.4); g.restore(); }
    for (const p of pops) {
      const k = p.t / 1.1, sc = p.t < .15 ? .6 + p.t / .15 * .6 : 1.2 - Math.min(.2, (p.t - .15));
      g.save(); g.globalAlpha = 1 - Math.pow(k, 3); g.translate(p.x, p.y - k * 40); g.scale(sc, sc);
      g.font = `900 ${p.size}px "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 5; g.strokeStyle = '#fffaf2'; g.strokeText(p.text, 0, 0); g.fillStyle = p.c; g.fillText(p.text, 0, 0);
      g.restore();
    }
    if (slow < .9) {
      const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
      v.addColorStop(0, 'rgba(58,42,32,0)'); v.addColorStop(1, `rgba(58,42,32,${(1 - slow) * .45})`);
      g.fillStyle = v; g.fillRect(-20, -20, W + 40, H + 40);
    }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  makeBallLook();
  ball = { x: 0, y: DESK_Y + BR, z: .5, vx: 0, vy: 0, vz: 0, rot: .4, vr: 0, inBin: false, touched: false, made: false, t: 0, prevY: DESK_Y + BR, sq: 0 };
  const b0 = getBest();
  $('bestTitle').textContent = b0 == null ? '還沒投過，丟一球看看' : `個人最高紀錄 ${b0} 分`;
  requestAnimationFrame(frame);
})();
</script>
