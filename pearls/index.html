<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const DUR = 30, FEVER = 25;
  const RANKS = [[200, 'S', '珍珠收集王'], [120, 'A', '很會接'], [60, 'B', '半杯'], [0, 'C', '只有冰塊']];

  let W, H, DPR, CW, CH, CB, PR;
  let state = 'title', T = 0, clock = 0, slow = 1, slowT = 0;
  let sched = [], paws = [], si = 0, pi = 0;
  let items = [], parts = [], pops = [], confetti = [], spilled = [];
  let cup = { x: 0, tx: 0, vx: 0, tilt: 0, sq: 0, stun: 0, spin: 0, chill: 0 };
  let got = 0, score = 0, combo = 0, maxCombo = 0, caught = 0, golds = 0, ices = 0, swiped = 0, dodged = 0, missed = 0;
  let shake = 0, lastRes = null, dragging = false, lastSec = 99, feverOn = false;
  let kw = { mood: 'normal', t: 0, say: '', sayT: 0, blink: 0, nextBlink: 2 };

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-pearls-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-pearls-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, NB = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, freq, q = 1, vol = .2, to = 0, delay = 0) {
    if (!AC || muted || !NB) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const gn = AC.createGain(); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .008); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, Math.random() * 1.5); s.stop(t + dur + .02);
  }

  const sfx = {
    plop: k => tone(420 + Math.min(k, 30) * 22, .1, 'sine', .14, -200),
    gold: () => { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .18, 'sine', .1, 0, i * .04)); },
    ice: () => { tone(2600, .08, 'triangle', .1); tone(3300, .12, 'sine', .07, 0, .04); tone(180, .25, 'sawtooth', .06, -60, .02); },
    warn: () => { tone(880, .08, 'square', .05); tone(880, .08, 'square', .05, 0, .14); },
    swipe: () => noise(.25, 700, .9, .2, 2500),
    whack: () => { noise(.18, 400, .8, .3, 120); tone(140, .3, 'triangle', .2, -70); },
    dodge: () => { [880, 1175].forEach((f, i) => tone(f, .15, 'sine', .1, 0, i * .06)); },
    combo: n => { [523, 659, 784, 1047].slice(0, Math.min(4, n)).forEach((f, i) => tone(f * 1.5, .15, 'triangle', .08, 0, i * .05)); },
    tick: () => tone(1500, .05, 'square', .05),
    fever: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .2, 'square', .05, 0, i * .05)); },
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => { tone(220, .4, 'sawtooth', .07, -80); }
  };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();
  const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };

  // ---------- layout ----------
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const ow = W;
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    CW = clamp(W * .27, 84, 130); CH = CW * 1.3;
    CB = H - Math.max(34, H * .06);
    PR = clamp(W * .022, 7, 11);
    if (!ow) { cup.x = cup.tx = W / 2; }
    cup.x = clamp(cup.x, CW / 2, W - CW / 2); cup.tx = clamp(cup.tx, CW / 2, W - CW / 2);
  }
  function rrect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }


  function drawKewei(x, y, r, o = {}) {
    const mood = o.mood || 'normal', lx = o.lx || 0, ly = o.ly || 0, blink = o.blink || 0;
    g.save(); g.translate(x, y); if (o.tilt) g.rotate(o.tilt);
    const earA = mood === 'angry' ? 1.0 : mood === 'sad' ? .8 : .5;
    for (const s of [-1, 1]) {
      g.save(); g.translate(s * r * .55, -r * .6); g.rotate(s * earA);
      g.beginPath(); g.moveTo(-r * .34, r * .2); g.quadraticCurveTo(-r * .14, -r * .64, 0, -r * .62); g.quadraticCurveTo(r * .14, -r * .64, r * .34, r * .2); g.closePath();
      g.fillStyle = '#f9e6d2'; g.fill();
      g.beginPath(); g.moveTo(-r * .2, r * .12); g.quadraticCurveTo(-r * .07, -r * .42, 0, -r * .42); g.quadraticCurveTo(r * .07, -r * .42, r * .2, r * .12); g.closePath();
      g.fillStyle = '#ffc2cc'; g.fill();
      g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = Math.max(1, r * .03); g.lineCap = 'round';
      g.beginPath(); g.moveTo(-r * .06, r * .08); g.lineTo(-r * .12, -r * .2); g.moveTo(r * .05, r * .08); g.lineTo(r * .1, -r * .18); g.stroke();
      g.restore();
    }
    const N = 24;
    g.beginPath();
    for (let i = 0; i < N; i++) {
      const a0 = i / N * 6.2832, a1 = (i + 1) / N * 6.2832, am = (a0 + a1) / 2;
      const tuft = 1.05 + (Math.sin(am) > .1 ? .1 * Math.abs(Math.cos(am)) : .02);
      const p0x = Math.cos(a0) * r * 1.08, p0y = Math.sin(a0) * r * .95;
      if (i === 0) g.moveTo(p0x, p0y);
      g.quadraticCurveTo(Math.cos(am) * r * 1.08 * tuft, Math.sin(am) * r * .95 * tuft, Math.cos(a1) * r * 1.08, Math.sin(a1) * r * .95);
    }
    g.closePath();
    const hg = g.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r * 1.2);
    hg.addColorStop(0, '#fffdf8'); hg.addColorStop(.6, '#fbeee0'); hg.addColorStop(1, '#ecd3ba');
    g.save(); g.shadowColor = 'rgba(80,50,30,.22)'; g.shadowBlur = r * .3; g.shadowOffsetY = r * .08;
    g.fillStyle = hg; g.fill(); g.restore();

    window.DGH_DAILY && DGH_DAILY.reseed();
    sched = []; paws = [];
    for (let t = .6; t < DUR - .4;) {
      const fev = t > FEVER;
      const iceP = t < 3 ? 0 : lerp(.1, .24, t / DUR) * (fev ? .5 : 1);
      const goldP = fev ? .3 : .06;
      const r = Math.random();
      sched.push({ t, u: rand(.06, .94), type: r < goldP ? 'gold' : r < goldP + iceP ? 'ice' : 'pearl', v: .34 + t * .016 + rand(-.03, .07), sway: rand(-1, 1), rot: rand(0, 6) });
      const rate = (1.6 + t * .1) * (fev ? 1.5 : 1);
      t += rand(.55, 1.45) / rate;
    }
    for (let t = rand(6, 7.5); t < DUR - 1.2; t += rand(lerp(5.5, 2.6, t / DUR), lerp(6.5, 3.4, t / DUR))) paws.push({ t, side: Math.random() < .5 ? -1 : 1, phase: null, k: 0, reach: 0, hit: false, close: 1e9 });
    si = 0; pi = 0; items = []; parts = []; pops = []; confetti = [];
    got = score = combo = maxCombo = caught = golds = ices = swiped = dodged = missed = 0;
    clock = 0; lastSec = 99; feverOn = false;
    cup.x = cup.tx = W / 2; cup.vx = cup.tilt = cup.sq = cup.stun = cup.spin = cup.chill = 0;
    $('title').hidden = true; $('sheet').hidden = true; $('hud').hidden = false; $('hint').hidden = false;
    $('pTime').classList.remove('warn');
    state = 'play';
    say('珍珠來囉～', 'happy', 1.4);
    hud();
  }
  const mult = () => 1 + Math.min(3, Math.floor(combo / 8));
  function hud(popId) {
    $('hTime').textContent = Math.max(0, Math.ceil(DUR - clock));
    $('hScore').textContent = score;
    $('hMult').textContent = '×' + mult();
    $('pMult').classList.toggle('hot', mult() > 1);
    if (popId && !reduced) { const el = $(popId); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  function pop(x, y, text, c = '#3a2a20', size = 20) { pops.push({ x, y, text, c, size, t: 0 }); }

  function spawn(s) {
    const size = s.type === 'ice' ? PR * 2.6 : PR;
    items.push({ type: s.type, x: lerp(PR * 2, W - PR * 2, s.u), y: -20, vy: s.v * H, vx: 0, r: size, sway: s.sway, rot: s.rot, vr: rand(-3, 3), bounced: false });
  }

  function catchItem(it) {
    const edge = Math.abs(it.x - cup.x) / (CW / 2);
    cup.sq = 1;
    if (it.type === 'ice') {
      ices++; combo = 0; score = Math.max(0, score - 3); cup.chill = 1;
      sfx.ice(); buzz(30); shake = .25;
      pop(it.x, CB - CH - 20, '−3 冰塊！', '#4a8bb0', 22);
      say(pick(ICE_LINES), 'happy', 1.2);
      for (let i = 0; i < 8; i++) parts.push({ x: it.x, y: CB - CH, vx: rand(-160, 160), vy: rand(-260, -80), r: rand(2, 4), c: 'rgba(200,235,255,.9)', life: rand(.4, .7) });
      hud('pScore');
      return;
    }
    combo++; maxCombo = Math.max(maxCombo, combo);
    const m = mult();
    const base = it.type === 'gold' ? 5 : 1;
    const pts = base * m * (feverOn ? 2 : 1);
    score += pts; caught++; got++;
    if (it.type === 'gold') { golds++; sfx.gold(); buzz(15); for (let i = 0; i < 16; i++) parts.push({ x: it.x, y: CB - CH, vx: rand(-220, 220), vy: rand(-320, -60), r: rand(1.5, 3.5), c: pick(['#f0c24b', '#fff3c4', '#ffe58a']), life: rand(.5, .9) }); }
    else sfx.plop(combo);
    for (let i = 0; i < 5; i++) parts.push({ x: it.x, y: CB - CH + 4, vx: rand(-90, 90), vy: rand(-200, -80), r: rand(1.5, 3), c: 'rgba(216,172,128,.9)', life: rand(.3, .5) });
    pop(it.x, CB - CH - 16, '+' + pts, it.type === 'gold' ? '#c08a1a' : '#3a2a20', it.type === 'gold' ? 24 : 18);
    if (edge > .72) pop(it.x, CB - CH - 44, '險！', '#c2402a', 18);
    if (combo % 8 === 0 && combo <= 24) { pop(cup.x, CB - CH - 70, `連擊 ×${mult()}！`, '#c2402a', 28); sfx.combo(mult()); shake = .15; say(pick(['好厲害！', '停不下來', '手速驚人']), 'wide', 1.2); }
    else if (Math.random() < .05 && kw.sayT <= 0) say(pick(CATCH_LINES), 'happy', 1);
    hud(it.type === 'gold' || combo % 8 === 0 ? 'pScore' : null);
  }

  function whacked(p) {
    p.hit = true; swiped++;
    combo = 0;
    const lose = Math.min(score, 5);
    score -= lose;
    cup.stun = .75; cup.vx = -p.side * 900; cup.spin = -p.side * .6;
    sfx.whack(); buzz([40, 30, 40]); shake = .5;
    pop(cup.x, CB - CH - 30, lose ? `−${lose} 被打翻！` : '被打翻！', '#c2402a', 24);
    for (let i = 0; i < Math.min(8, caught); i++) spilled.push({ x: cup.x, y: CB - CH, vx: rand(-260, 260) - p.side * 200, vy: rand(-420, -200), r: PR * .9, life: 1.4 });
    caught = Math.max(0, caught - 6);
    say(pick(SWIPE_LINES), 'happy', 1.4);
    hud('pScore');
  }

  function rankOf(s) { for (const r of RANKS) if (s >= r[0]) return r; return RANKS[RANKS.length - 1]; }
  function finish() {
    state = 'result';
    const [, rk, role] = rankOf(score);
    const prev = getBest(); const isNew = prev == null || score > prev;
    if (isNew) setBest(score);
    window.DGH_DAILY && DGH_DAILY.save(score);
    $('rank').textContent = rk; $('role').textContent = role; $('score').textContent = score;
    const quip = rk === 'S' ? pick(['這杯珍珠比奶茶還多', '老闆說明天開始你來顧店', '珍珠看到你都會自己跳進來'])
      : rk === 'A' ? pick(['手速有到，再貪心一點', '這杯可以賣 70 元', '連擊再久一點就 S 了'])
      : rk === 'B' ? pick(['半杯珍珠半杯冰', '一般般的一杯', 'KEWEI 覺得還可以'])
      : pick(['這是一杯冰塊奶茶', 'KEWEI 把你的珍珠都打掉了', '珍珠呢？']);
    let next = '';
    const i = RANKS.findIndex(r => r[1] === rk);
    if (i > 0) next = `<br><span class="next">再 ${RANKS[i - 1][0] - score} 分就升 ${RANKS[i - 1][1]} 級「${RANKS[i - 1][2]}」</span>`;
    const bestLine = isNew ? `<br><span class="newbest">刷新個人最高紀錄</span>` : `<br>個人最高：${prev} 分`;
    $('detail').innerHTML = `<span class="quip">「${quip}」</span>接到 ${got} 顆珍珠、金珍珠 ${golds} 顆，最高連擊 ${maxCombo}。吃到冰塊 ${ices} 次，被貓掌打翻 ${swiped} 次，閃過 ${dodged} 次。` + next + bestLine;
    lastRes = { score, rk, role, maxCombo };
    $('hud').hidden = true; $('hint').hidden = true;
    $('sheet').hidden = false;
    if (rk === 'S') sfx.win(); else if (rk === 'C') sfx.bad(); else sfx.ok();
    buzz(rk === 'S' ? [20, 40, 20] : 15);
    if (rk === 'S' && !reduced) burst();
    say(rk === 'S' ? '可以分我一顆嗎' : rk === 'C' ? '嘿嘿，都是我的' : '下一杯我還要打', rk === 'C' ? 'happy' : 'wide', 5);
  }
  function burst() {
    const cols = ['#c2402a', '#6f8f78', '#e7b75f', '#3a2a20', '#f2a7a0'];
    for (let i = 0; i < 90; i++) confetti.push({ x: W / 2 + rand(-40, 40), y: H * .35, vx: rand(-260, 260), vy: rand(-520, -180), r: rand(3, 6), c: cols[i % cols.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.6) });
  }

  // ---------- input ----------
  function down(e) {
    if (e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state !== 'play') return;
    e.preventDefault();
    dragging = true; cup.tx = clamp(e.clientX, CW / 2, W - CW / 2);
    $('hint').hidden = true;
  }
  function move(e) {
    if (state !== 'play') return;
    if (dragging || e.pointerType === 'mouse') cup.tx = clamp(e.clientX, CW / 2, W - CW / 2);
  }
  addEventListener('pointerdown', down, { passive: false });
  addEventListener('pointermove', move);
  addEventListener('pointerup', () => { dragging = false; });
  addEventListener('pointercancel', () => { dragging = false; });
  addEventListener('contextmenu', e => e.preventDefault());
  const keys = {};
  addEventListener('keydown', e => { keys[e.code] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); });
  addEventListener('keyup', e => { keys[e.code] = false; });

  $('go').addEventListener('click', () => { initAudio(); startRound(); });
  $('again').addEventListener('click', () => { initAudio(); startRound(); });
  $('share').addEventListener('click', async () => {
    if (!lastRes) return;
    let msg = `我在《接珍珠》30 秒拿到 ${lastRes.score} 分（${lastRes.rk} 級・${lastRes.role}），最高連擊 ${lastRes.maxCombo}！換你接：`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: '接珍珠', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- loop ----------
  let last = 0;
  function step(rdt) {
    if (slowT > 0) { slowT -= rdt; slow += (.3 - slow) * Math.min(1, rdt * 16); } else slow += (1 - slow) * Math.min(1, rdt * 5);
    const dt = rdt * slow;
    T += dt;
    if (state === 'play') {
      clock += dt;
      while (si < sched.length && sched[si].t <= clock) spawn(sched[si++]);
      // fever
      if (!feverOn && clock >= FEVER) { feverOn = true; sfx.fever(); pop(W / 2, H * .45, '最後衝刺！分數 ×2', '#c2402a', 30); say('金珍珠雨！', 'wide', 1.5); shake = .3; }
      const sec = Math.ceil(DUR - clock);
      if (sec !== lastSec) { lastSec = sec; if (sec <= 5 && sec > 0) { sfx.tick(); $('pTime').classList.add('warn'); } hud(); }
      // cup control
      if (keys.ArrowLeft) cup.tx = clamp(cup.tx - 700 * dt, CW / 2, W - CW / 2);
      if (keys.ArrowRight) cup.tx = clamp(cup.tx + 700 * dt, CW / 2, W - CW / 2);
      if (clock >= DUR) { state = 'done'; items = []; setTimeout(finish, 500); }
    }
    if (cup.stun > 0) {
      cup.stun -= dt;
      cup.x += cup.vx * dt; cup.vx *= Math.pow(.02, dt);
      if (cup.x < CW / 2) { cup.x = CW / 2; cup.vx = Math.abs(cup.vx) * .5; }
      if (cup.x > W - CW / 2) { cup.x = W - CW / 2; cup.vx = -Math.abs(cup.vx) * .5; }
      cup.tx = cup.x;
    } else {
      const px = cup.x;
      cup.x += (cup.tx - cup.x) * Math.min(1, rdt * 18);
      cup.vx = (cup.x - px) / Math.max(rdt, 1e-3);
    }
    cup.tilt += (clamp(-cup.vx * .00035, -.25, .25) - cup.tilt) * Math.min(1, rdt * 10);
    cup.spin *= Math.pow(.05, rdt);
    cup.sq = Math.max(0, cup.sq - rdt * 4);
    cup.chill = Math.max(0, cup.chill - rdt * 1.2);
    // items
    const mouthY = CB - CH;
    for (const it of items) {
      it.vy += (it.type === 'ice' ? 120 : 60) * dt;
      it.x += (it.vx + (it.type === 'gold' ? Math.sin(T * 3 + it.sway * 3) * 30 : 0)) * dt;
      const py = it.y; it.y += it.vy * dt; it.rot += it.vr * dt;
      if (!it.bounced && !it.dead && py < mouthY && it.y >= mouthY && cup.stun <= 0) {
        const dx = it.x - cup.x, half = CW / 2;
        if (Math.abs(dx) < half - it.r * .2) { it.dead = true; catchItem(it); }
        else if (Math.abs(dx) < half + it.r) { it.bounced = true; it.vy = -it.vy * .35; it.vx = Math.sign(dx || 1) * 160; tone(900, .05, 'triangle', .06); }
      }
      if (it.y > H + 30 && !it.dead) { it.dead = true; if (it.type !== 'ice' && state === 'play') { missed++; if (combo >= 8) { pop(clamp(it.x, 60, W - 60), H - 60, '連擊斷了', '#7a6555', 16); } combo = 0; hud(); } }
    }
    items = items.filter(it => !it.dead);
    // paw swipes
    if (state === 'play') {
      for (const p of paws) {
        if (!p.phase && clock >= p.t - .9) { p.phase = 'warn'; p.k = 0; sfx.warn(); }
        if (!p.phase || p.phase === 'done') continue;
        p.k += dt;
        if (p.phase === 'warn' && p.k > .9) { p.phase = 'out'; p.k = 0; sfx.swipe(); }
        else if (p.phase === 'out') { p.reach = W * .56 * Math.min(1, p.k / .2); if (p.k > .2) { p.phase = 'hold'; p.k = 0; } }
        else if (p.phase === 'hold') { if (p.k > .22) { p.phase = 'back'; p.k = 0; } }
        else if (p.phase === 'back') { p.reach = W * .56 * Math.max(0, 1 - p.k / .3); if (p.k > .3) { p.phase = 'done'; if (!p.hit) { dodged++; if (p.close < CW * .45) { score += 2; pop(cup.x, CB - CH - 40, '閃過！+2', '#6f8f78', 24); sfx.dodge(); } say(pick(DODGE_LINES), 'sad', 1.2); hud('pScore'); } } }
        if ((p.phase === 'out' || p.phase === 'hold') && !p.hit) {
          const tipX = p.side < 0 ? p.reach : W - p.reach;
          const gap = p.side < 0 ? (cup.x - CW / 2) - tipX : tipX - (cup.x + CW / 2);
          p.close = Math.min(p.close, gap);
          if (gap < 0) whacked(p);
          else if (gap < CW * .35 && !reduced && slowT <= 0 && !p.slowed) { p.slowed = true; slowT = .35; }
        }
      }
    }
    for (const s of spilled) { s.vy += 900 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
    spilled = spilled.filter(s => s.life > 0 && s.y < H + 20);
    for (const p of parts) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops) p.t += rdt;
    pops = pops.filter(p => p.t < 1);
    for (const c of confetti) { c.vy += 700 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; c.vx *= .99; c.rot += c.vr * rdt; c.life -= rdt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - rdt);
    if (kw.t > 0) { kw.t -= rdt; if (kw.t <= 0) kw.mood = 'normal'; }
    if (kw.sayT > 0) kw.sayT -= rdt;
    kw.nextBlink -= rdt; if (kw.nextBlink < 0) { kw.blink = 1; kw.nextBlink = rand(2, 4.5); }
    kw.blink = Math.max(0, kw.blink - rdt * 7);
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
    drawBackdrop();
    if (feverOn && state === 'play') {
      const a = .12 + .06 * Math.sin(T * 10);
      const fg = g.createLinearGradient(0, 0, 0, H * .5); fg.addColorStop(0, `rgba(240,194,75,${a})`); fg.addColorStop(1, 'rgba(240,194,75,0)');
      g.fillStyle = fg; g.fillRect(0, 0, W, H * .5);
    }
    drawShelfKewei();
    for (const it of items) {
      if (it.type === 'ice') drawIce(it.x, it.y, it.r, it.rot);
      else drawPearl(it.x, it.y, it.type === 'gold' ? it.r * 1.25 : it.r, it.type === 'gold', T * 2);
      if (it.vy > H * .55 && !reduced) { g.fillStyle = 'rgba(58,42,32,.08)'; g.fillRect(it.x - it.r * .4, it.y - it.r * 4, it.r * .8, it.r * 3); }
    }
    for (const s of spilled) drawPearl(s.x, s.y, s.r, false);
    drawCup();
    for (const p of paws) if (p.phase && p.phase !== 'done') drawPawSwipe(p);
    for (const p of parts) { g.globalAlpha = clamp(p.life * 2.5, 0, 1); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    for (const p of pops) {
      const k = p.t, sc = p.t < .12 ? .6 + p.t / .12 * .6 : 1.2 - Math.min(.2, (p.t - .12));
      g.save(); g.globalAlpha = 1 - Math.pow(k, 3); g.translate(clamp(p.x, 80, W - 80), p.y - k * 40); g.scale(sc, sc);
      g.font = `900 ${p.size}px "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 5; g.strokeStyle = '#fffaf2'; g.strokeText(p.text, 0, 0); g.fillStyle = p.c; g.fillText(p.text, 0, 0);
      g.restore();
    }
    if (state === 'play' && DUR - clock <= 5) {
      const s = Math.ceil(DUR - clock), f = (DUR - clock) % 1;
      g.save(); g.globalAlpha = .18 + f * .2; g.fillStyle = '#c2402a';
      g.font = `900 ${Math.round(Math.min(W, H) * .4 * (1 + (1 - f) * .2))}px "DM Serif Display", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(s), W / 2, H * .5); g.restore();
    }
    if (slow < .9) {
      const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
      v.addColorStop(0, 'rgba(58,42,32,0)'); v.addColorStop(1, `rgba(58,42,32,${(1 - slow) * .4})`);
      g.fillStyle = v; g.fillRect(-20, -20, W + 40, H + 40);
    }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  caught = 14;
  const b0 = getBest();
  $('bestTitle').textContent = b0 == null ? '今天還沒接過' : `個人最高紀錄 ${b0} 分`;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
