<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const RANKS = [[430, 'S', '貓咪美甲師'], [340, 'A', '溫柔的手'], [220, 'B', '有點緊張'], [0, 'C', '被貓抓']];
  const CLAWS = 5, MM = 7;
  // paw geometry in paw units (1 unit ≈ U px)
  const PC = { x: 0, y: .06 };
  const TOES = [
    { a: -.62, d: .36, r: .095, L: .3, w: .1 },
    { a: -.21, d: .385, r: .102, L: .32, w: .105 },
    { a: .21, d: .385, r: .102, L: .32, w: .105 },
    { a: .62, d: .36, r: .095, L: .3, w: .1 },
    { a: -1.3, d: .47, r: .07, L: .24, w: .085, dew: true }
  ];
  const toePos = t => ({ x: PC.x + Math.sin(t.a) * t.d, y: PC.y - Math.cos(t.a) * t.d });
  const clawBase = t => { const p = toePos(t); return { x: p.x + Math.sin(t.a) * t.r * .8, y: p.y - Math.cos(t.a) * t.r * .8 }; };

  let W, H, DPR, U, CX, CY, ZOOM = 1.55, faceX, faceY, faceR;
  let state = 'title', T = 0, slow = 1, freezeT = 0, stT = 0;
  let plan = [], idx = 0, score = 0, results = [], scratched = false;
  let cam = { x: 0, y: 0, a: 0, z: 1 }, camOff = { x: 0, y: 0 };
  let u = .04, dir = 1, patience = 0, patienceMax = 1, ext = 0, clip = 1, beatT = 0, prox = 0, twitch = 0, twitchT = 2;
  let pieces = [], parts = [], pops = [], scratches = [], confetti = [];
  let shake = 0, flash = 0, faceZoom = 0, lastRes = null, bestGap = null;
  let kw = { mood: 'normal', t: 0, say: '', sayT: 0, blink: 0, nextBlink: 2 };

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-nails-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-nails-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, NB = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, freq, q = 1, vol = .2, to = 0, delay = 0) {
    if (!AC || muted || !NB) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const gn = AC.createGain(); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .008); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, Math.random() * 1.5); s.stop(t + dur + .02);
  }

  const sfx = {
    snip: () => { noise(.04, 5000, 3, .25); tone(2400, .05, 'square', .05); noise(.08, 2200, 2, .12, 0, .03); },
    beat: k => { tone(70, .12, 'sine', .25 + k * .2, -20); tone(60, .14, 'sine', .18 + k * .15, -15, .14); },
    great: () => { [784, 1047, 1319, 1568].forEach((f, i) => tone(f, .3, 'sine', .12, 0, i * .06)); },
    good: () => { [659, 880].forEach((f, i) => tone(f, .25, 'sine', .12, 0, i * .08)); },
    meh: () => tone(440, .2, 'triangle', .1, -60),
    purr: () => { for (let i = 0; i < 6; i++) tone(48, .09, 'sawtooth', .05, 0, i * .1); },
    hiss: () => { noise(1.0, 4200, .7, .45, 2600); tone(150, .7, 'sawtooth', .12, -60, .05); tone(520, .35, 'sawtooth', .07, 380); },
    yank: () => { noise(.3, 900, .8, .2, 200); tone(600, .25, 'triangle', .1, -300); },
    tick: () => tone(1500, .03, 'square', .035),
    whoosh: () => noise(.25, 600, .9, .1, 1800),
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => { tone(220, .4, 'sawtooth', .07, -80); }
  };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();
  const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };

  // ---------- layout ----------
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    U = Math.min(W, H * .58);
    CX = W / 2; CY = H * .7;
    faceR = Math.min(W * .19, H * .1);
    faceX = W / 2; faceY = Math.max(110, H * .2);
  }
  function rrect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }


  function drawKewei(x, y, r, o = {}) {
    const mood = o.mood || 'normal', lx = o.lx || 0, ly = o.ly || 0, blink = o.blink || 0;
    g.save(); g.translate(x, y); if (o.tilt) g.rotate(o.tilt);
    const earA = mood === 'angry' ? 1.0 : mood === 'sad' ? .8 : .5;
    for (const s of [-1, 1]) {
      g.save(); g.translate(s * r * .55, -r * .6); g.rotate(s * earA);
      g.beginPath(); g.moveTo(-r * .34, r * .2); g.quadraticCurveTo(-r * .14, -r * .64, 0, -r * .62); g.quadraticCurveTo(r * .14, -r * .64, r * .34, r * .2); g.closePath();
      g.fillStyle = '#f9e6d2'; g.fill();
      g.beginPath(); g.moveTo(-r * .2, r * .12); g.quadraticCurveTo(-r * .07, -r * .42, 0, -r * .42); g.quadraticCurveTo(r * .07, -r * .42, r * .2, r * .12); g.closePath();
      g.fillStyle = '#ffc2cc'; g.fill();
      g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = Math.max(1, r * .03); g.lineCap = 'round';
      g.beginPath(); g.moveTo(-r * .06, r * .08); g.lineTo(-r * .12, -r * .2); g.moveTo(r * .05, r * .08); g.lineTo(r * .1, -r * .18); g.stroke();
      g.restore();
    }
    const N = 24;
    g.beginPath();

      g.fillStyle = k < .3 ? (Math.sin(T * 20) > 0 ? '#c2402a' : '#e06a50') : '#6f8f78'; rrect(bx, by, Math.max(bh, bw * k), bh, 4); g.fill();
      g.fillStyle = '#7a6555'; g.font = '500 10px "Noto Sans TC", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top';
      g.fillText(k < .3 ? '快沒耐心了！' : '耐心', W / 2, by + bh + 4);
    }
  }

  // ---------- game flow ----------
  const GREAT = ['極限操作！', '只差一根毛', '手術級精準', '這刀可以拿去參賽'];
  const GOOD = ['漂亮', 'KEWEI 很滿意', '剪得好乾淨', '專業的喔'];
  const MEH = ['還可以啦', '可以再靠近一點', '保守派剪法', '安全牌'];
  const BAD = ['你只剪到空氣吧', '這樣跟沒剪一樣', '剪了個寂寞', '指甲：我還在喔'];
  const KW_GREAT = ['呼⋯⋯好險', '你嚇死我了', '喵（腿軟）'];
  const KW_GOOD = ['呼嚕嚕～', '還不錯喵', '可以給你摸一下'];
  const KW_BAD = ['你到底有沒有剪？', '我要睡了喔', '⋯⋯'];
  const KW_WAIT = ['你在猶豫什麼', '快點啦', '我腳很痠欸', '再不剪我要走了'];

  function startRound() {
    window.DGH_DAILY && DGH_DAILY.reseed();
    const order = [0, 1, 2, 3, 4];
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    plan = order.map((toe, i) => ({ toe, qf: rand(.36, .6), L: TOES[toe].L * rand(.92, 1.1), w: TOES[toe].w, sp: [.62, .82, 1.02, 1.25, 1.5][i] * rand(.95, 1.08), wob: i >= 3 ? rand(.3, .45) : i === 2 ? .15 : 0, ph: rand(0, 6.28), pat: [6, 5.5, 5, 4.5, 4][i], cutT: null }));
    idx = 0; score = 0; results = []; scratched = false; bestGap = null;
    pieces = []; parts = []; pops = []; scratches = []; confetti = [];
    faceZoom = 0; kw.mood = 'normal';
    $('title').hidden = true; $('sheet').hidden = true; $('hud').hidden = false;
    beginClaw();
    $('hint').hidden = false;
    say('輕一點喔⋯⋯', 'wide', 1.6);
  }
  function beginClaw() {
    state = 'pan'; stT = 0; ext = 0; clip = 1; u = .04; dir = 1;
    const c = plan[idx];
    patienceMax = c.pat; patience = c.pat;
    sfx.whoosh();
    hud();
  }
  function hud(popId) {
    $('hClaw').textContent = Math.min(idx + 1, CLAWS) + '/' + CLAWS;
    $('hScore').textContent = score;
    if (popId && !reduced) { const el = $(popId); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  function pop(x, y, text, c = '#3a2a20', size = 22) { pops.push({ x, y, text, c, size, t: 0 }); }
  function clawScreen(t) {
    // claw point (paw space) → screen, using the live camera
    const c = plan[idx], tb = TOES[c.toe], b = clawBase(tb);
    const L = c.L, lx = cxAt(t, L), ly = -t * L;
    const px = b.x + lx * Math.cos(tb.a) - ly * Math.sin(tb.a), py = b.y + lx * Math.sin(tb.a) + ly * Math.cos(tb.a);
    const S = U * cam.z, dx = (px - cam.x) * S, dy = (py - cam.y) * S, ca = Math.cos(-cam.a), sa = Math.sin(-cam.a);
    return { x: CX + camOff.x + dx * ca - dy * sa, y: CY + camOff.y + dx * sa + dy * ca };
  }

  function cut() {
    const c = plan[idx], t = 1 - u;
    $('hint').hidden = true;
    clip = 0; stT = 0;
    sfx.snip(); buzz(12);
    if (t <= c.qf + .012) { hiss(); return; }
    const gap = t - c.qf, room = 1 - c.qf;
    const pts = Math.round(100 * Math.pow(clamp(1 - gap / room, 0, 1), 1.6));
    c.cutT = t;
    score += pts;
    results.push({ toe: c.toe, pts, gap, L: c.L, cutT: t });
    if (bestGap == null || gap < bestGap) bestGap = gap;
    // flying tip
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const S = U * cam.z, tb = TOES[c.toe], b = clawBase(tb);
    g.translate(CX + camOff.x, CY + camOff.y); g.rotate(-cam.a); g.scale(S, S); g.translate(-cam.x, -cam.y); g.translate(b.x, b.y); g.rotate(tb.a);
    const m = g.getTransform();
    const cpt = m.transformPoint(new DOMPoint(cxAt((t + 1) / 2, c.L), -(t + 1) / 2 * c.L));
    pieces.push({ m, c: { x: cpt.x, y: cpt.y }, L: c.L, w: c.w, t0: t, ox: 0, oy: 0, vx: rand(-160, 160), vy: rand(-380, -260), rot: 0, vr: rand(-12, 12), life: 1.6 });
    const sp = clawScreen(t);
    for (let i = 0; i < (reduced ? 4 : 14); i++) parts.push({ x: sp.x, y: sp.y, vx: rand(-200, 200), vy: rand(-260, -40), r: rand(1.5, 3.5), c: pick(['#fffaf2', '#ffd6df', '#e7b75f']), life: rand(.4, .8) });
    const S2 = clawScreen(t);
    let label, kwl, mood;
    if (pts >= 90) { label = pick(GREAT); kwl = pick(KW_GREAT); mood = 'wide'; sfx.great(); if (!reduced) { freezeT = .5; } shake = .25; buzz([10, 30, 30]); }
    else if (pts >= 70) { label = pick(GOOD); kwl = pick(KW_GOOD); mood = 'happy'; sfx.good(); sfx.purr(); }
    else if (pts >= 40) { label = pick(MEH); kwl = pick(KW_GOOD); mood = 'normal'; sfx.meh(); }
    else { label = pick(BAD); kwl = pick(KW_BAD); mood = 'squint'; sfx.meh(); }
    pop(S2.x, S2.y - 50, label, pts >= 90 ? '#c2402a' : '#3a2a20', pts >= 90 ? 28 : 22);
    pop(S2.x, S2.y - 18, `+${pts}　離血線 ${(gap * MM).toFixed(1)}mm`, '#6f8f78', 15);
    say(kwl, mood, 1.4);
    state = 'cut';
    hud('pScore');
  }
  function hiss() {
    scratched = true; state = 'hiss'; stT = 0;
    kw.mood = 'angry'; kw.t = 99; kw.sayT = 0;
    sfx.hiss(); buzz([60, 40, 120]);
    shake = .9; flash = 1; faceZoom = 0;
    camOff.y = 0;
    for (let i = 0; i < 3; i++) scratches.push({ d: i * .07, t: 0, x0: W * (.12 + i * .22), y0: H * .18, x1: W * (.38 + i * .22), y1: H * .82 });
    results.push({ toe: plan[idx].toe, pts: 0, gap: -1, L: plan[idx].L, cutT: 1 });
  }
  function yank() {
    state = 'yank'; stT = 0;
    results.push({ toe: plan[idx].toe, pts: 0, gap: null, L: plan[idx].L, cutT: 1 });
    say(pick(['不給剪了啦！', '太慢了，我走了', '哼！']), 'squint', 1.4);
    sfx.yank(); shake = .3;
  }
  function nextClaw() {
    idx++;
    if (idx >= CLAWS) { state = 'done'; setTimeout(finish, 500); return; }
    beginClaw();
    if (idx === CLAWS - 1) say('最後一根了⋯⋯', 'wide', 1.4);
    else if (idx === 3) say('我、我開始緊張了', 'wide', 1.4);
  }

  function rankOf(s) { for (const r of RANKS) if (s >= r[0]) return r; return RANKS[RANKS.length - 1]; }
  function finish() {
    state = 'result';
    let [, rk, role] = rankOf(score);
    if (scratched) { rk = 'C'; role = '被貓抓'; }
    const prev = getBest(); const isNew = prev == null || score > prev;
    if (isNew) setBest(score);
    window.DGH_DAILY && DGH_DAILY.save(score);
    $('rank').textContent = rk; $('role').textContent = role; $('score').textContent = score;
    const quip = scratched ? pick(['手背上多了三條紅線，這是 KEWEI 的簽名', 'KEWEI 已經躲到床底下了', '今天先這樣，OK 繃在抽屜'])
      : rk === 'S' ? pick(['寵物美容院想挖角你', 'KEWEI 主動伸出另一隻腳', '剪完還給你踩踩'])
      : rk === 'A' ? pick(['溫柔又準，KEWEI 有點感動', '再大膽一點就是大師', '血線看到你都會怕'])
      : rk === 'B' ? pick(['手有點抖，但心意到了', '安全第一，指甲第二', 'KEWEI 給你打及格分'])
      : pick(['指甲還是很長，沙發要哭了', 'KEWEI：你確定你有剪？', '剪了五刀空氣']);
    const done = results.filter(r => r.pts > 0).length;
    let next = '';
    const i = RANKS.findIndex(r => r[1] === rk);
    if (scratched) next = `<br><span class="next">剪到第 ${results.length} 根就出事，前面拿了 ${score} 分</span>`;
    else if (i > 0) next = `<br><span class="next">再 ${RANKS[i - 1][0] - score} 分就升 ${RANKS[i - 1][1]} 級「${RANKS[i - 1][2]}」</span>`;
    const gapLine = bestGap != null ? `最極限的一刀離血線 <b>${(bestGap * MM).toFixed(1)}mm</b>。` : '';
    const bestLine = isNew ? `<br><span class="newbest">刷新個人最高紀錄</span>` : `<br>個人最高：${prev} 分`;
    $('detail').innerHTML = `<span class="quip">「${quip}」</span>成功剪了 ${done}/5 根。${gapLine}` + next + bestLine;
    lastRes = { score, rk, role, scratched };
    $('hud').hidden = true;
    $('sheet').hidden = false;
    if (rk === 'S') sfx.win(); else if (rk === 'C') sfx.bad(); else sfx.ok();
    buzz(rk === 'S' ? [20, 40, 20] : 15);
    if (rk === 'S' && !reduced) burst();
    if (!scratched) say(rk === 'S' ? '你可以常常來' : rk === 'C' ? '換人剪好不好' : '還、還可以啦', rk === 'C' ? 'squint' : 'happy', 5);
  }
  function burst() {
    const cols = ['#c2402a', '#6f8f78', '#e7b75f', '#3a2a20', '#f2a7a0'];
    for (let i = 0; i < 90; i++) confetti.push({ x: W / 2 + rand(-40, 40), y: H * .35, vx: rand(-260, 260), vy: rand(-520, -180), r: rand(3, 6), c: cols[i % cols.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.6) });
  }

  // ---------- input ----------
  function down(e) {
    if (e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state !== 'aim') return;
    e.preventDefault();
    cut();
  }
  addEventListener('pointerdown', down, { passive: false });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { initAudio(); if (state === 'aim') cut(); e.preventDefault(); } });

  $('go').addEventListener('click', () => { initAudio(); startRound(); });
  $('again').addEventListener('click', () => { initAudio(); startRound(); });
  $('share').addEventListener('click', async () => {
    if (!lastRes) return;
    let msg = lastRes.scratched
      ? `我幫 KEWEI 剪指甲剪到血線，被哈了還被抓三條（${lastRes.score} 分）。你敢剪嗎？`
      : `我幫 KEWEI 剪指甲拿到 ${lastRes.score} 分（${lastRes.rk} 級・${lastRes.role}），換你剪剪看：`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: '幫 KEWEI 剪指甲', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- loop ----------
  let last = 0;
  function step(rdt) {
    if (freezeT > 0) { freezeT -= rdt; slow = .06; } else slow += (1 - slow) * Math.min(1, rdt * 5);
    const dt = rdt * slow;
    T += dt; stT += dt;
    // camera target
    const tgt = state === 'title' ? { x: 0, y: -.05, a: 0, z: .95 } : (() => { const tb = TOES[plan[idx] ? plan[idx].toe : 1]; const b = clawBase(tb); return { x: b.x, y: b.y, a: tb.a, z: ZOOM }; })();
    const k = Math.min(1, dt * 7);
    cam.x += (tgt.x - cam.x) * k; cam.y += (tgt.y - cam.y) * k; cam.a += (tgt.a - cam.a) * k; cam.z += (tgt.z - cam.z) * k;
    camOff.x *= Math.pow(.02, dt); camOff.y *= Math.pow(.05, dt);
    if (state === 'pan') {
      ext = Math.min(1, ext + dt * 3);
      if (stT > .65) { state = 'aim'; stT = 0; beatT = 0; }
    } else if (state === 'aim') {
      const c = plan[idx];
      const sp = c.sp * (1 + c.wob * Math.sin(T * 5.5 + c.ph));
      u += dir * sp * dt;
      if (u > .985) { u = .985; dir = -1; }
      if (u < .03) { u = .03; dir = 1; }
      const t = 1 - u;
      prox = t > c.qf ? clamp(1 - (t - c.qf) / .22, 0, 1) : 1;
      if (kw.t <= 0) kw.mood = prox > .75 ? 'wide' : 'normal';
      beatT -= dt; if (beatT <= 0) { sfx.beat(prox); beatT = lerp(.9, .32, prox); }
      const before = patience; patience -= dt;
      if (patience < patienceMax * .3 && Math.floor(before * 4) !== Math.floor(patience * 4)) sfx.tick();
      if (before > patienceMax * .5 && patience <= patienceMax * .5 && kw.sayT <= 0) say(pick(KW_WAIT), null, 1.2);
      if (c.wob) { twitchT -= dt; if (twitchT < 0) { twitchT = rand(1.2, 2.4); camOff.x += rand(-14, 14); camOff.y += rand(4, 10); } }
      if (patience <= 0) yank();
    } else if (state === 'cut') {
      clip = Math.min(1, clip + dt * 2);
      if (stT > .9) nextClaw();
    } else if (state === 'yank') {
      camOff.y = Math.min(H * .5, camOff.y + dt * H * 2.5);
      if (stT > .8) { camOff.y = H * .4; nextClaw(); }
    } else if (state === 'hiss') {
      faceZoom = Math.min(1, faceZoom + dt * 6);
      camOff.y = Math.min(H * .6, camOff.y + dt * H * 1.6);
      if (stT > 1.7) { state = 'done'; finish(); }
    }
    if (state !== 'hiss' && state !== 'result' && state !== 'done') faceZoom = Math.max(0, faceZoom - dt * 3);
    for (const p of pieces) { p.vy += 900 * dt; p.ox += p.vx * dt; p.oy += p.vy * dt; p.rot += p.vr * dt; p.life -= dt * .7; }
    pieces = pieces.filter(p => p.life > 0 && p.oy < H);
    for (const p of parts) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops) p.t += rdt;
    pops = pops.filter(p => p.t < 1.2);
    for (const s of scratches) s.t += rdt;
    for (const c of confetti) { c.vy += 700 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; c.vx *= .99; c.rot += c.vr * rdt; c.life -= rdt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - rdt); flash = Math.max(0, flash - rdt * 1.5);
    if (kw.t > 0 && kw.t < 90) { kw.t -= rdt; if (kw.t <= 0) kw.mood = 'normal'; }
    if (kw.sayT > 0) kw.sayT -= rdt;
    kw.nextBlink -= rdt; if (kw.nextBlink < 0) { kw.blink = 1; kw.nextBlink = rand(2, 4.5); }
    kw.blink = Math.max(0, kw.blink - rdt * 7);
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 5, rand(-2, 2) * shake * 5);
    if (freezeT > 0 && !reduced) { const z = 1 + freezeT * .08; g.translate(W / 2, H * .55); g.scale(z, z); g.translate(-W / 2, -H * .55); }
    drawBackdrop();
    // the hand holding the paw
    if (state !== 'title') {
      g.save(); g.translate(camOff.x, camOff.y);
      const hg = g.createLinearGradient(W * .3, H, W * .7, H * .8);
      hg.addColorStop(0, '#e9b996'); hg.addColorStop(1, '#f6d3b8');
      g.fillStyle = hg;
      g.beginPath(); g.ellipse(W * .5 - U * .45, H * .98, U * .26, U * .14, -.5, 0, 7); g.fill();
      g.restore();
    }
    drawPaw();
    drawPieces();
    // thumb pressing the toe
    if (state !== 'title') {
      g.save(); g.translate(camOff.x, camOff.y);
      const tx = CX - U * .02, ty = CY + U * .2;
      const tg = g.createLinearGradient(tx - 30, 0, tx + 30, 0); tg.addColorStop(0, '#e2ad8b'); tg.addColorStop(.5, '#f8d9c2'); tg.addColorStop(1, '#dca282');
      g.fillStyle = tg;
      g.beginPath(); g.moveTo(tx - U * .09, H + 20); g.lineTo(tx - U * .085, ty + U * .04); g.quadraticCurveTo(tx, ty - U * .07, tx + U * .085, ty + U * .04); g.lineTo(tx + U * .09, H + 20); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,240,235,.75)'; g.beginPath(); g.ellipse(tx, ty + U * .03, U * .05, U * .035, 0, 0, 7); g.fill();
      g.restore();
    }
    drawFace();
    for (const p of parts) { g.globalAlpha = clamp(p.life * 2, 0, 1); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    for (const p of pops) {
      const k = p.t / 1.2, sc = p.t < .15 ? .6 + p.t / .15 * .6 : 1.2 - Math.min(.2, (p.t - .15));
      g.save(); g.globalAlpha = 1 - Math.pow(k, 3); g.translate(clamp(p.x, 110, W - 110), p.y - k * 36); g.scale(sc, sc);
      g.font = `900 ${p.size}px "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 5; g.strokeStyle = '#fffaf2'; g.strokeText(p.text, 0, 0); g.fillStyle = p.c; g.fillText(p.text, 0, 0);
      g.restore();
    }
    // scratches
    for (const s of scratches) {
      const k = clamp((s.t - s.d) / .18, 0, 1); if (k <= 0) continue;
      const a = clamp(2.2 - s.t * .5, 0, 1);
      g.save(); g.lineCap = 'round';
      g.strokeStyle = `rgba(194,64,42,${.8 * a})`; g.lineWidth = 9;
      g.beginPath(); g.moveTo(s.x0, s.y0); g.quadraticCurveTo((s.x0 + s.x1) / 2 + 30, (s.y0 + s.y1) / 2, lerp(s.x0, s.x1, k), lerp(s.y0, s.y1, k)); g.stroke();
      g.strokeStyle = `rgba(255,220,220,${.7 * a})`; g.lineWidth = 3; g.stroke();
      g.restore();
    }
    if (flash > 0) { g.fillStyle = `rgba(255,80,90,${flash * .3})`; g.fillRect(-20, -20, W + 40, H + 40); }
    if (state === 'aim' && prox > .5 && !reduced) {
      const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
      v.addColorStop(0, 'rgba(194,64,42,0)'); v.addColorStop(1, `rgba(194,64,42,${(prox - .5) * .3})`);
      g.fillStyle = v; g.fillRect(-20, -20, W + 40, H + 40);
    }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  cam = { x: 0, y: -.05, a: 0, z: .95 };
  const b0 = getBest();
  $('bestTitle').textContent = b0 == null ? 'KEWEI 的指甲有點長了' : `個人最高紀錄 ${b0} 分`;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
