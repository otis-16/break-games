<style>
/* Sunny city street, seen from above. Single light look by choice, matching the tea game. */
:root {

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {

.mute {

}
.mute svg { width: 20px; height: 20px; }

/* trip card */
.card {

}
.card::after {
  content: "";

  background: linear-gradient(-45deg, transparent 4px, var(--paper) 0) 0 0 / 8px 6px repeat-x,

@keyframes print { from { transform: rotate(-2deg) translateY(-130%); } }

.role { margin: 0; font-family: var(--f-disp); font-size: 22px; font-weight: 900; align-self: end; }

@media (prefers-reduced-motion: reduce) {
  .card, .sheet, .rank, .hint { animation: none; }
}
</style>

  const HELMETS = ['#fffaf2', '#c2402a', '#3b6ea5', '#f2c230', '#2f2a26', '#e98aa0', '#6f8f78'];

  const LINES = {

  const getBest = () => { try { const v = localStorage.getItem('dgh-scooter-best'); return v == null ? null : Number(v); } catch (e) { return null; } };

  // ---------- layout ----------
  function fit() {

  const X = xm => roadL + xm * K;

  // ---------- drawing helpers ----------
  function rrect(x, y, w, h, r) {

  function shade(hex, k) {

  function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  const visM = () => [dist - (H - PY) / K - 6, dist + PY / K + 6];
  function inInter(m, pad = 0) { for (const I of inters) if (m > I.m - 11 - pad && m < I.m + 11 + pad) return I; return null; }

  // ---------- street ----------
  function drawRoad() {
    g.fillStyle = '#8b8781'; g.fillRect(roadL, 0, roadR - roadL, H);
    const [a, b] = visM();
    // patched asphalt and manholes
    for (let i = Math.floor(a / 3); i <= Math.ceil(b / 3); i++) {
      const h = hash(i * 3.7), m = i * 3;
      if (h < .16) {
        g.fillStyle = 'rgba(60,55,50,.09)';
        const x = X(hash(i + 9) * (RW - 2)), w = (.8 + hash(i + 3) * 1.4) * K;
        rrect(x, Y(m + 1.4), w, (.6 + hash(i + 5) * .9) * K, 3); g.fill();
      } else if (h > .95) {
        const x = X(1 + hash(i + 2) * (RW - 2)), y = Y(m);
        g.fillStyle = '#76736e'; circle(x, y, .42 * K);
        g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, .3 * K, 0, 7); g.stroke();
      }
      for (let j = 0; j < 3; j++) { g.fillStyle = 'rgba(255,255,255,.07)'; circle(X(hash(i * 7 + j) * RW), Y(m + hash(i * 5 + j) * 3), 1.4); }
    }

    g.fillStyle = 'rgba(255,255,255,.88)';
    for (const lx of [3.3, 6.6]) {
      for (let m = Math.floor(a / 8) * 8; m < b; m += 8) {
        if (inInter(m, 4) || inInter(m + 3, 4)) continue;

      }
    }
    // edge lines: red (no stopping) / yellow
    for (let i = Math.floor(a / SEG); i <= Math.ceil(b / SEG); i++) {
      const m0 = i * SEG;
      g.fillStyle = hash(i * 1.3) < .5 ? '#d2553e' : '#e9b949';
      g.fillRect(roadL + 3, Y(m0 + SEG), 3, SEG * K);
      g.fillStyle = hash(i * 2.9) < .5 ? '#d2553e' : '#e9b949';
      g.fillRect(roadR - 6, Y(m0 + SEG), 3, SEG * K);
    }
    // scooter-priority lane paint
    for (let m = Math.floor(a / 70) * 70 + 40; m < b; m += 70) {
      if (inInter(m, 8)) continue;

  }
  function paintText(txt, x, y, size) {
    g.save(); g.translate(x, y); g.scale(1, 1.7);
    g.fillStyle = 'rgba(255,255,255,.82)'; g.font = `700 ${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(txt, 0, 0); g.restore();
  }
  function paintScooterIcon(x, y, k) {
    g.fillStyle = 'rgba(255,255,255,.82)';
    rrect(x - .22 * k, y - .8 * k, .44 * k, 1.6 * k, .2 * k); g.fill();
    g.fillRect(x - .55 * k, y - .55 * k, 1.1 * k, .14 * k);
  }

  function drawSides() {
    const [a, b] = visM();
    for (let i = Math.floor(a / SEG); i <= Math.ceil(b / SEG); i++) { drawSide(-1, i); drawSide(1, i); }
  }
  function drawSide(side, i) {
    const m0 = i * SEG, yTop = Y(m0 + SEG), hp = SEG * K;
    const seed = i * 2 + (side > 0 ? 1 : 0);
    const isHome = side > 0 && m0 <= HOME && m0 + SEG > HOME;
    const shop = SHOPS[Math.floor(hash(seed * 1.7) * SHOPS.length)];
    const curb0 = side < 0 ? roadL - 5 : roadR, curb1 = curb0 + 5;
    const fl0 = side < 0 ? curb0 - af : curb1, fl1 = fl0 + af;
    const facade = side < 0 ? fl0 : fl1;
    const b0 = side < 0 ? -2 : facade, b1 = side < 0 ? facade : W + 2;
    // curb
    g.fillStyle = '#d9d2c7'; g.fillRect(curb0, yTop, 5, hp);
    // arcade floor tiles
    g.fillStyle = hash(seed * 3.1) < .5 ? '#ebe0d0' : '#e4d8c6'; g.fillRect(fl0, yTop, af, hp);
    g.strokeStyle = 'rgba(150,125,100,.18)'; g.lineWidth = 1;
    g.beginPath();
    for (let k = 1; k < SEG; k++) { const y = yTop + k * K; g.moveTo(fl0, y); g.lineTo(fl1, y); }

    g.stroke();

    sg.addColorStop(0, 'rgba(90,65,45,.26)'); sg.addColorStop(1, 'rgba(90,65,45,0)');
    g.fillStyle = sg; g.fillRect(fl0, yTop, af, hp);
    // parked scooters in the arcade
    const nP = Math.floor(hash(seed * 5.3) * 4);
    for (let k = 0; k < nP; k++) {
      const yy = yTop + hp * (.18 + k * .2 + hash(seed + k) * .05);
      parkedScooter((fl0 + fl1) / 2 + side * af * .08, yy, af * .78, HELMETS[(seed + k) % HELMETS.length], side);
    }
    if (hash(seed * 8.1) < .4) { // potted plant

      g.fillStyle = '#b5673f'; circle(xx, yy, 5); g.fillStyle = '#6f8f78'; circle(xx - 1, yy - 1, 4.2); g.fillStyle = '#88a98f'; circle(xx + 1, yy - 2, 2.4);
    }

      const xx = side < 0 ? curb0 - p - 1 : curb1 + 1;
      g.fillStyle = 'rgba(70,50,35,.18)'; g.fillRect(xx + 2, yy + 3, p, p);
      g.fillStyle = '#f6efe4'; g.fillRect(xx, yy, p, p);
      g.fillStyle = 'rgba(150,125,100,.25)'; g.fillRect(xx, yy + p - 2, p, 2);

      g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1; g.beginPath();

    g.strokeStyle = bg === '#fffaf2' ? fg : 'rgba(255,255,255,.55)'; g.lineWidth = 1.5; rrect(sx + 2, sy + 2, sw - 4, sh - 4, 2); g.stroke();
    g.fillStyle = fg; g.font = `700 ${cs}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';

  function drawIntersections() {

  function drawLights() {

  // ---------- characters & vehicles ----------
  function drawCar(o, x, y) {
    const w = o.hw * 2 * K, l = o.hl * 2 * K, c = o.col;
    g.save(); g.translate(x, y); if (o.rot) g.rotate(o.rot);
    g.fillStyle = 'rgba(45,32,22,.24)'; rrect(-w / 2 + 4, -l / 2 + 6, w, l, w * .3); g.fill();
    g.fillStyle = c; rrect(-w / 2, -l / 2, w, l, w * .3); g.fill();

    sg.addColorStop(0, 'rgba(0,0,0,.16)'); sg.addColorStop(.2, 'rgba(0,0,0,0)'); sg.addColorStop(.7, 'rgba(255,255,255,.1)'); sg.addColorStop(1, 'rgba(0,0,0,.18)');

    g.fillStyle = 'rgba(255,255,255,.28)'; g.beginPath(); g.moveTo(-w * .25, -l * .18); g.lineTo(-w * .1, -l * .18); g.lineTo(-w * .02, -l * .29); g.lineTo(-w * .15, -l * .29); g.fill();
    // roof

    // rear window
    g.fillStyle = '#3c4954'; rrect(-w * .34, l * .25, w * .68, l * .1, 3); g.fill();
    // mirrors
    g.fillStyle = shade(c, -.2); g.beginPath(); g.ellipse(-w * .55, -l * .18, w * .1, w * .06, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(w * .55, -l * .18, w * .1, w * .06, 0, 0, 7); g.fill();
    // lights
    g.fillStyle = '#fff3c8'; rrect(-w * .42, -l / 2 + 2, w * .2, 4, 2); g.fill(); rrect(w * .22, -l / 2 + 2, w * .2, 4, 2); g.fill();
    g.fillStyle = o.v < o.v0 - .5 || o.v0 === 0 ? '#ff4a32' : '#b8382a';
    rrect(-w * .44, l / 2 - 6, w * .22, 4, 2); g.fill(); rrect(w * .22, l / 2 - 6, w * .22, 4, 2); g.fill();
    if (o.type === 'taxi') {
      g.fillStyle = '#fffaf2'; rrect(-w * .22, -l * .02, w * .44, l * .1, 3); g.fill();

  // ---------- game objects ----------
  function addObj(o) {
    o.ph = rand(0, 100); o.nm = false; o.hit = false; o.v = o.v0 || 0; o.tx = o.xm;
    obs.push(o); return o;
  }
  function free(xm, hw, m, hl) {
    for (const o of obs) if (Math.abs(o.xm - xm) < o.hw + hw + .5 && Math.abs(o.m - m) < o.hl + hl + 3) return false;
    return true;
  }
  function lanesBusy(m, span) {
    const s = new Set();
    for (const o of obs) {
      if (o.type === 'snack' || o.type === 'xcar') continue;
      if (Math.abs(o.m - m) < o.hl + span) for (let k = 0; k < 3; k++) if (Math.abs(LANES[k] - o.xm) < o.hw + 1.1) s.add(k);
    }
    return s;
  }
  function spawnAt(m) {
    if (m > HOME - 120) return;
    for (const I of inters) if (m > I.m - 28 && m < I.m + 13) return;
    const p = dist / HOME;
    const table = [['car', 30], ['scooter', 16], ['taxi', 10], ['pothole', 12], ['snack', 10], ['swarm', p > .08 ? 9 : 0], ['bus', p > .06 ? 8 : 0], ['dog', p > .18 ? 6 : 0]];
    let tot = 0; for (const t of table) tot += t[1];
    let r = Math.random() * tot, type = 'car';
    for (const t of table) { if ((r -= t[1]) < 0) { type = t[0]; break; } }
    const busy = lanesBusy(m, 7);
    const freeLanes = [0, 1, 2].filter(k => !busy.has(k));
    if (freeLanes.length < 2 && type !== 'snack' && type !== 'pothole') return;
    const lane = pick(freeLanes.length ? freeLanes : [0, 1, 2]);
    if (type === 'car') {
      const xm = LANES[lane] + rand(-.3, .3);
      if (free(xm, .9, m, 2.2)) addObj({ type, mov: true, xm, m, hw: .9, hl: 2.2, v0: rand(6.5, 9.5), col: pick(CARS) });
    } else if (type === 'bus') {
      const xm = LANES[Math.min(lane, 1)];
      if (free(xm, 1.25, m + 3, 5.6) && busy.size === 0) addObj({ type, mov: true, xm, m: m + 3, hw: 1.25, hl: 5.6, v0: rand(5, 6.5), no: pick(['307', '262', '藍 25', '紅 30', '650', '1503']) });
    } else if (type === 'taxi') {
      const xm = RW - 1.12;
      if (!busy.has(2) && free(xm, .9, m, 2.2)) addObj({ type, xm, m, hw: .9, hl: 2.2, v0: 0, col: '#f2c230', door: 0, said: false });
    } else if (type === 'scooter') {

  function boxes(o) {

  // ---------- grandma talk ----------

  // ---------- flow ----------

    hearts = 3; nag = 0; inv = 0; scare = 0; bump = 0; runT = 0;
    obs = []; fx = []; pops = []; confetti = []; gm = null; bubble = null; bubbleCd = 0;

  }

    const hint = $('hint'); hint.textContent = '左右滑動閃車・往下拉煞車'; hint.classList.remove('red'); hint.hidden = false;

  }
  function gameOver() {

  }
  function arrive() {

  }

  function finish(win) {
    state = 'result'; setEngine(false);
    const t = Math.round(runT);
    const d = Math.min(HOME, Math.round(dist));
    const timeB = win ? Math.max(0, Math.round((190 - runT) * 8)) : 0;
    const heartB = win ? hearts * 200 : 0;
    const score = d + snacks * 80 + lawful * 50 + timeB + heartB;
    let rk, role;
    if (!win) { rk = 'C'; role = '阿嬤自己走回家'; }
    else if (score >= 3000) { rk = 'S'; role = '阿嬤的驕傲'; }
    else if (score >= 2550) { rk = 'A'; role = '孝順乖孫'; }
    else { rk = 'B'; role = '被唸一路'; }

  }
  function burst() {

  }

  // ---------- input ----------
  let ptr = null;
  function down(e) {
    if (e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state !== 'play') return;
    e.preventDefault();

  }
  function move(e) {
    if (!ptr || e.pointerId !== ptr.id || state !== 'play') return;

    if (e.clientY < ptr.sy) ptr.sy = e.clientY;
    brake = clamp((e.clientY - ptr.sy - 18) / 60, 0, 1);

  }
  function up(e) { if (ptr && e.pointerId === ptr.id) { ptr = null; brake = 0; } }

  addEventListener('pointermove', move);
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {

  addEventListener('keyup', e => {

  $('go').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('share').addEventListener('click', async () => {
    if (!lastRes) return;

      ? `我在《載阿嬤回家》拿到 ${lastRes.score} 分（${lastRes.rk} 級・${lastRes.role}），換你載阿嬤：`
      : `我在《載阿嬤回家》騎到一半，阿嬤下車自己走回家了（${lastRes.score} 分）。你載得比我穩嗎？`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');

    } catch (e) { if (e && e.name === 'AbortError') return; }

    catch (e) { btn.textContent = '複製失敗'; }

  });

  // ---------- simulation ----------
  function updateLights(dt) {
    for (const I of inters) {
      const stopM = I.m - 11, gap = stopM - (dist + .85);
      if (!I.decided && gap < 95) { I.decided = true; I.willRed = I.first || Math.random() < .55; }
      if (I.st === 'green' && I.willRed && !I.done && gap > 2 && gap < spd * 2.6 + 12) { I.st = 'yellow'; I.t = 1.1; }
      else if (I.st === 'yellow') { I.t -= dt; if (I.t <= 0) { I.st = 'red'; I.t = 4.5; I.xt = .3; } }
      else if (I.st === 'red') {
        I.t -= dt; I.xt -= dt;
        if (I.xt <= 0) {
          I.xt = rand(.9, 1.5);
          const d = Math.random() < .5 ? 1 : -1, ext = roadL / K + 3;
          addObj({ type: 'xcar', xm: d > 0 ? -ext : RW + ext, m: I.m + (d > 0 ? -3.4 : 3.4), hw: 2.2, hl: .9, vx: d * rand(9, 12), col: Math.random() < .2 ? '#f2c230' : pick(CARS), rot: d > 0 ? Math.PI / 2 : -Math.PI / 2, v0: 1 });
        }
        if (I.t <= 0) { I.st = 'green'; I.done = true; }
        if (!I.good && gap > -.5 && gap < 16 && spd < 1.2) {
          I.good = true; lawful++; nag = Math.max(0, nag - 30); say('good', false, 2); sfx.good(); pop('+50 守規矩', dist + 2, px, '#6f8f78');
        }
      }
      // red-light hint
      if (I.st !== 'green' && gap > 0 && gap < 45 && state === 'play' && !I.good) {
        const h = $('hint'); if (h.hidden || !h.classList.contains('red')) { h.textContent = I.st === 'red' ? '紅燈！往下拉煞車' : '黃燈了，準備停'; h.classList.add('red'); h.hidden = false; }
        hintT = .4;
      }
      // crossing the line
      const front = dist + .85;
      if (prevFront < stopM && front >= stopM && state === 'play') {
        if (I.st === 'red') { redRun++; sfx.whistle(); pop('闖紅燈', dist + 2, px, '#c2402a'); loseHeart('red'); }
        else if (I.st === 'yellow') { nag += 12; say('fast', true, 2); }

  }
  function stopLineFor(o) {
    const f = o.m + o.hl;
    let lim = Infinity;

      if (I.st === 'green') continue;
      const line = o.type === 'scooter' ? I.m - 11.3 : I.m - 15.2;
      const gap = line - f;

  }

  function step(dt) {
    T += dt;
    bubbleCd = Math.max(0, bubbleCd - dt);
    if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
    scare = Math.max(0, scare - dt); bump = Math.max(0, bump - dt * 4); shake = Math.max(0, shake - dt);

    if (state === 'title') {
      spd = 6; dist += spd * dt;
      px = RW / 2 + 1.2 + Math.sin(T * .7) * 1.4; lean = Math.cos(T * .7) * .25;
    } else if (state === 'play') {
      runT += dt; inv = Math.max(0, inv - dt);

      const base = Math.min(17, 8.5 + dist * .0043);
      const tgt = base * (1 - br);
      if (spd < tgt) spd = Math.min(tgt, spd + 3.2 * dt);
      else spd = Math.max(tgt, spd - (br > 0 ? 5 + 18 * br : 3) * dt);
      if (br > .6 && spd > 8 && Math.random() < dt * 4) sfx.squeal();
      dist += spd * dt;
      prevPx = px;
      px += (ptx - px) * Math.min(1, dt * 9);
      const lt = clamp((ptx - px) * .3, -.45, .45);
      lean += (lt - lean) * Math.min(1, dt * 10);
      // swerving

      if (vx > 6.5) swerveT += dt; else swerveT = Math.max(0, swerveT - dt * .5);
      if (swerveT > .4) { swerveT = 0; nag += 14; say('swerve', true, 1); }
      // nagging dynamics
      if (spd > 14.5) nag += 2.2 * dt; else nag -= (spd < 11 ? 6 : 2.5) * dt;
      nag = clamp(nag, 0, 120);
      if (nag >= 100) { nag = 40; bubble = null; loseHeart('fast'); }
      chatT -= dt;
      if (chatT <= 0 && !bubble) { chatT = rand(6, 10); say(spd > 14 ? 'fast' : 'idle', false, 0); }

    }

    // objects
    const pb = [px - .38, px + .38, dist - .85, dist + .85];
    for (const o of obs) {

      if (hit) {
        if (o.type === 'snack') { o.dead = true; snacks++; nag = Math.max(0, nag - 20); say('snack', false, 2); sfx.snack(); pop('+80 肉圓', o.m + 1, o.xm, '#c2402a'); continue; }
        if (o.type === 'pothole') { if (!o.hit) { o.hit = true; nag += 30; bump = 1; shake = .2; sfx.bump(); say('bump', true, 2); } continue; }
        if (inv <= 0 && !o.hit) {
          o.hit = true; sfx.crash(); spd *= .3;
          px = clamp(px + (px < o.xm ? -.7 : .7), .55, RW - .55); ptx = px;
          if (o.mov) { o.m += 1.2; o.v = o.v0; }
          pop('碰！', dist + 1.5, px, '#c2402a');
          loseHeart('crash');
          if (state !== 'play') break;
        }
      } else if (!o.nm && !o.hit && o.type !== 'snack' && o.type !== 'pothole') {
        const dm = Math.abs(o.m - dist);
        if (dm < o.hl + .85) {

          for (const b of boxes(o)) gapX = Math.min(gapX, Math.max(b[0] - pb[1], pb[0] - b[1]));

  }

  let hudCache = {};

  }

  // ---------- render ----------
  function draw() {

    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 5, rand(-2, 2) * shake * 5);
    g.fillStyle = '#e8dccb'; g.fillRect(-10, -10, W + 20, H + 20);
    drawRoad();
    drawSides();
    drawIntersections();
    // speed streaks
    if (spd > 13 && state === 'play' && !reduced) {
      g.strokeStyle = `rgba(255,255,255,${Math.min(.35, (spd - 13) * .08)})`; g.lineWidth = 2;
      for (let k = 0; k < 6; k++) {
        const x = roadL + hash(k * 3.3) * (roadR - roadL), y = ((T * 900 + k * 173) % (H + 200)) - 100;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 60); g.stroke();
      }
    }
    // ground objects first, then vehicles by depth
    for (const o of obs) if (o.type === 'pothole') drawPothole(o, X(o.xm), Y(o.m));
    for (const f of fx) if (f.puff) { g.fillStyle = f.c; g.globalAlpha = clamp(f.t / .7, 0, 1); circle(X(f.x), Y(f.m), f.r); g.globalAlpha = 1; }
    for (const o of obs) if (o.type === 'snack') drawSnack(o, X(o.xm), Y(o.m));
    const movers = obs.filter(o => o.type !== 'pothole' && o.type !== 'snack').sort((a, b) => b.m - a.m);
    let drewP = false;
    for (const o of movers) {
      if (!drewP && o.m < dist) { drawPlayer(); drewP = true; }
      const x = X(o.xm), y = Y(o.m);
      if (y < -200 || y > H + 200) continue;
      if (o.type === 'car' || o.type === 'taxi' || o.type === 'xcar') drawCar(o, x, y);
      else if (o.type === 'bus') drawBus(o, x, y);
      else if (o.type === 'scooter') drawScooterObj(o, x, y);
      else if (o.type === 'dog') drawDog(o, x, y);
    }
    if (!drewP) drawPlayer();
    drawStandingGrandma();
    drawLights();
    for (const f of fx) if (!f.puff) { g.fillStyle = f.c; g.globalAlpha = clamp(f.t * 2, 0, 1); circle(X(f.x), Y(f.m), f.r); g.globalAlpha = 1; }
    for (const p of pops) {
      g.globalAlpha = clamp(p.t * 2, 0, 1);
      g.font = `900 18px "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = '#fffaf2'; g.strokeText(p.text, X(p.xm), Y(p.m));
      g.fillStyle = p.col; g.fillText(p.text, X(p.xm), Y(p.m));
      g.globalAlpha = 1;
    }
    drawBubble();
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }

  let last = 0;
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  resetRun(); spd = 6;
  const b = getBest();
  $('bestTitle').textContent = b == null ? '還沒載過阿嬤' : `個人最高紀錄 ${b} 分`;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
