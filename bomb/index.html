    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- step ----------
  function step(rdt) {
    if (slowT > 0) { slowT -= rdt; timeScale = .22; zoom += (1.12 - zoom) * Math.min(1, rdt * 8); }
    else { timeScale = 1; zoom += (1 - zoom) * Math.min(1, rdt * 6); }
    const dt = rdt * timeScale;
    T += dt; stT += dt;
    if (state === 'arm') {
      if (stT > .55) { state = 'live'; stT = 0; sfx.arm(); }
    } else if (state === 'live') {
      timeLeft -= dt;
      const frac = clamp(timeLeft / timeMax, 0, 1);
      const sec = Math.ceil(timeLeft);
      if (sec !== lastSec) { lastSec = sec; if (timeLeft > 3) sfx.tick(); }
      if (timeLeft <= 3) { tickAcc += dt; if (tickAcc > (timeLeft < 1.2 ? .14 : .28)) { tickAcc = 0; sfx.beep(); } }
      beatAcc += dt;
      const interval = .3 + .75 * frac;
      if (beatAcc > interval) { beatAcc = 0; sfx.beat(); }
      if (timeLeft <= 0) { timeLeft = 0; death = { why: 'time' }; explode(); }
    } else if (state === 'defused') {
      for (const w of wires) if (w.cut != null) w.droop = Math.min(1, w.droop + dt * 3);
      if (stT > 1.25) nextLevel();
    } else if (state === 'doom') {
      for (const w of wires) if (w.cut != null) w.droop = Math.min(1, w.droop + dt * 3);
      tickAcc += dt; if (tickAcc > .08) { tickAcc = 0; sfx.beep(); }
      if (stT > .55) explode();
    } else if (state === 'boom') {
      if (stT > 2.3) finish();
    }
    for (const w of wires) if (w.cut != null && state === 'live') w.droop = Math.min(1, w.droop + dt * 3);
    for (const p of parts) { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const s of smoke) { s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .97; s.vy *= .97; s.vy -= 10 * dt; s.r += 24 * dt; s.life -= dt; }
    smoke = smoke.filter(s => s.life > 0);
    for (const p of popups) { p.y -= 34 * dt; p.life -= dt; }
    popups = popups.filter(p => p.life > 0);
    for (const c of confetti) { c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .99; c.rot += c.vr * dt; c.life -= dt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - rdt * 1.4); flash = Math.max(0, flash - rdt * 2.2);
  }

  // ---------- draw ----------
  function drawBackdrop() {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#f6eee3'); bg.addColorStop(1, '#e6d5bf');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    // cutting mat
    const mx = B.x - 22, my = B.y - B.kitty - 16, mw = B.w + 44, mh = B.h + B.kitty + 40;
    g.save(); g.shadowColor = 'rgba(70,45,25,.18)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
    g.fillStyle = '#7f9c84'; rpath(mx, my, mw, mh, 14); g.fill(); g.restore();
    g.save(); rpath(mx, my, mw, mh, 14); g.clip();
    g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 1;
    for (let x = mx; x < mx + mw; x += 18) { g.beginPath(); g.moveTo(x, my); g.lineTo(x, my + mh); g.stroke(); }
    for (let y = my; y < my + mh; y += 18) { g.beginPath(); g.moveTo(mx, y); g.lineTo(mx + mw, y); g.stroke(); }
    g.restore();
    // lamp light
    const lg = g.createRadialGradient(W * .5, B.y, 10, W * .5, B.y, Math.max(W, H) * .75);
    lg.addColorStop(0, 'rgba(255,248,230,.55)'); lg.addColorStop(1, 'rgba(255,248,230,0)');
    g.fillStyle = lg; g.fillRect(0, 0, W, H);
  }

  const SEG = [0x3f, 0x06, 0x5b, 0x4f, 0x66, 0x6d, 0x7d, 0x07, 0x7f, 0x6f];
  function digit(x, y, w, h, d, on, off) {
    const t = w * .2, m = SEG[d] ?? 0;
    const segs = [
      [x + t * .6, y, w - t * 1.2, t], [x + w - t, y + t * .6, t, h / 2 - t * .9], [x + w - t, y + h / 2 + t * .3, t, h / 2 - t * .9],
      [x + t * .6, y + h - t, w - t * 1.2, t], [x, y + h / 2 + t * .3, t, h / 2 - t * .9], [x, y + t * .6, t, h / 2 - t * .9], [x + t * .6, y + h / 2 - t / 2, w - t * 1.2, t]
    ];
    segs.forEach((s, i) => { g.fillStyle = (m >> i) & 1 ? on : off; rpath(s[0], s[1], s[2], s[3], t / 2); g.fill(); });
  }

  function drawBomb() {
    const { x, y, w, h, ledH } = B;
    // dynamite sticks peeking behind
    for (let i = 0; i < 4; i++) {
      const sx = x + w * (.14 + i * .24) - 14;
      const sg = g.createLinearGradient(sx, 0, sx + 28, 0);
      sg.addColorStop(0, '#9c2a1c'); sg.addColorStop(.45, '#e0573f'); sg.addColorStop(1, '#8a2315');
      g.fillStyle = sg; rpath(sx, y + h - 14, 28, 26, 5); g.fill();
      g.fillStyle = '#3a2a20'; g.fillRect(sx, y + h + 2, 28, 3);
    }
    // case
    g.save(); g.shadowColor = 'rgba(30,20,10,.38)'; g.shadowBlur = 22; g.shadowOffsetY = 10;
    const cg = g.createLinearGradient(0, y, 0, y + h);
    cg.addColorStop(0, '#5a5f58'); cg.addColorStop(1, '#3a3e39');
    g.fillStyle = cg; rpath(x, y, w, h, 16); g.fill(); g.restore();
    g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1.5; rpath(x + 1, y + 1, w - 2, h - 2, 15); g.stroke();
    // inner panel
    g.fillStyle = '#62685f'; rpath(x + 12, y + ledH + 12, w - 24, h - ledH - 22, 10); g.fill();
    const ig = g.createLinearGradient(0, y + ledH, 0, y + h);
    ig.addColorStop(0, 'rgba(0,0,0,.35)'); ig.addColorStop(.2, 'rgba(0,0,0,0)');
    g.fillStyle = ig; rpath(x + 12, y + ledH + 12, w - 24, h - ledH - 22, 10); g.fill();
    // rivets
    for (const [rx, ry] of [[x + 10, y + 10], [x + w - 10, y + 10], [x + 10, y + h - 10], [x + w - 10, y + h - 10]]) {
      const rg = g.createRadialGradient(rx - 1.5, ry - 1.5, .5, rx, ry, 4.5); rg.addColorStop(0, '#d9dcd6'); rg.addColorStop(1, '#5b5f58');
      g.fillStyle = rg; g.beginPath(); g.arc(rx, ry, 4.5, 0, 7); g.fill();
    }
    // LED
    const lw = Math.min(w * .52, 210), lx = x + (w - lw) / 2, ly = y + 8, lh = ledH - 4;
    g.fillStyle = '#120808'; rpath(lx, ly, lw, lh, 7); g.fill();
    g.strokeStyle = '#6b6f69'; g.lineWidth = 2; rpath(lx, ly, lw, lh, 7); g.stroke();
    let txt, on = '#ff3b2a';
    const dangerBlink = state === 'live' && timeLeft < 3 && (T * 4 % 1) < .5;
    if (state === 'defused') { on = '#5df28a'; txt = null; }
    else if (state === 'doom') { txt = (T * 30 | 0) % 2 ? '88.8' : '00.0'; }
    else txt = (state === 'title' ? 30 : Math.max(0, timeLeft)).toFixed(1).padStart(4, '0');
    const dh = lh * .66, dw = dh * .52, gap = dw * .32;
    const totalW = dw * 3 + gap * 3;
    let dx = lx + (lw - totalW) / 2; const dy = ly + (lh - dh) / 2;
    g.save();
    g.shadowColor = on; g.shadowBlur = dangerBlink ? 2 : 12;
    const onC = dangerBlink ? '#7a1a12' : on, offC = 'rgba(255,60,40,.07)';
    if (txt) {
      for (const ch of txt) {
        if (ch === '.') { g.fillStyle = onC; g.beginPath(); g.arc(dx - gap * .5, dy + dh - 2, dw * .1, 0, 7); g.fill(); dx += gap * .4; continue; }
        digit(dx, dy, dw, dh, +ch, onC, offC); dx += dw + gap;
      }
    } else {
      g.fillStyle = on; g.font = `700 ${Math.round(dh * .62)}px ui-monospace, Menlo, monospace`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('SAFE', lx + lw / 2, ly + lh / 2 + 1);
    }
    g.restore();
    // glass glare
    g.fillStyle = 'rgba(255,255,255,.07)'; g.beginPath(); g.moveTo(lx + 6, ly + 4); g.lineTo(lx + lw * .45, ly + 4); g.lineTo(lx + lw * .3, ly + lh - 4); g.lineTo(lx + 6, ly + lh - 4); g.fill();
    // status lamp
    const lamp = state === 'defused' ? '#5df28a' : (T * (timeLeft < 3 ? 6 : 1.5) % 1 < .5 ? '#ff3b2a' : '#5a1a14');
    g.fillStyle = lamp; g.beginPath(); g.arc(x + w - 30, y + ledH / 2 + 4, 6, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(x + w - 32, y + ledH / 2 + 2, 2, 0, 7); g.fill();
    g.fillStyle = 'rgba(244,235,223,.55)'; g.font = '700 10px ui-monospace, Menlo, monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
    if (cur) g.fillText(cur.sn, x + 16, y + ledH / 2 + 4);
    // terminals + wires
    wires.forEach((wr, i) => {
      g.fillStyle = 'rgba(244,235,223,.75)'; g.font = '400 14px "DM Serif Display", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(i + 1), x + 22, wr.y);
      for (const tx of [x + 34, x + w - 34]) {
        const tg = g.createLinearGradient(tx - 7, 0, tx + 7, 0); tg.addColorStop(0, '#9b7a3a'); tg.addColorStop(.5, '#f1d48a'); tg.addColorStop(1, '#8a6a2c');
        g.fillStyle = tg; rpath(tx - 7, wr.y - 7, 14, 14, 3); g.fill();
        g.fillStyle = '#4a3a20'; g.beginPath(); g.arc(tx, wr.y, 2.4, 0, 7); g.fill();
      }
      drawWire(wr);
    });
  }

  function strokeSeg(pts, col, dark, lw) {
    if (pts.length < 2) return;
    const path = () => { g.beginPath(); g.moveTo(pts[0].x, pts[0].y); for (let k = 1; k < pts.length; k++) g.lineTo(pts[k].x, pts[k].y); };
    g.lineCap = 'round'; g.lineJoin = 'round';
    path(); g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = lw + 3; g.save(); g.translate(1.5, 3); g.stroke(); g.restore();
    path(); g.strokeStyle = dark; g.lineWidth = lw + 1.5; g.stroke();
    path(); g.strokeStyle = col; g.lineWidth = lw; g.stroke();
    path(); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = lw * .28; g.save(); g.translate(0, -lw * .22); g.stroke(); g.restore();
  }
  function drawWire(wr) {
    const col = COLORS[wr.c], lw = clamp(B.rowH * .2, 6, 10);
    if (wr.cut == null) strokeSeg(wr.pts, col.hex, col.dark, lw);
    else {
      const c = wr.cut, dr = wr.droop * B.rowH * .5;
      const left = wr.pts.slice(0, c + 1).map((p, k) => ({ x: p.x, y: p.y + dr * Math.pow(k / c, 2) }));
      const right = wr.pts.slice(c + 1).map((p, k, a) => ({ x: p.x, y: p.y + dr * Math.pow(1 - k / Math.max(1, a.length - 1), 2) }));
      left[left.length - 1].x -= 4 * wr.droop; if (right[0]) right[0].x += 4 * wr.droop;
      strokeSeg(left, col.hex, col.dark, lw); strokeSeg(right, col.hex, col.dark, lw);
      for (const e of [left[left.length - 1], right[0]]) { if (!e) continue; g.fillStyle = '#e3b04a'; g.beginPath(); g.arc(e.x, e.y, lw * .3, 0, 7); g.fill(); }
    }
    if (wr.t) {
      const k = Math.round(wr.tagT * 48), p = wr.pts[k];
      const dr = wr.cut != null ? wr.droop * B.rowH * .5 * Math.pow(k <= wr.cut ? k / wr.cut : 1 - (k - wr.cut) / (48 - wr.cut), 2) : 0;
      const sway = Math.sin(T * 2 + k) * .12;
      g.save(); g.translate(p.x, p.y + dr); g.rotate(sway);
      g.strokeStyle = '#d9c8a8'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 6); g.stroke();
      const tw = clamp(B.rowH * .42, 14, 20);
      g.fillStyle = '#f7ead0'; g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 4; g.shadowOffsetY = 2;
      rpath(-tw / 2, 5, tw, tw * .9, 3); g.fill(); g.shadowColor = 'transparent';
      g.fillStyle = '#3a2a20'; g.font = `700 ${Math.round(tw * .62)}px "Noto Sans TC", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(wr.t, 0, 5 + tw * .47);
      g.restore();
    }
  }

  function drawKitty() {
    if (state === 'boom' || state === 'result') return;
    const s = B.kitty / 220 * 1.25;
    const kx = B.x + B.w - 44, ky = B.y + 6;
    let eyes = 'open', tilt = Math.sin(T * 2) * .03;
    if (state === 'defused') { eyes = 'happy'; tilt = Math.sin(T * 14) * .08; }
    else if (state === 'doom' || (state === 'live' && timeLeft < 3)) { eyes = 'shock'; tilt = Math.sin(T * 40) * .03; }
    const blink = eyes === 'open' && (T % 3.2) < .12;
    drawKewei(g, kx, ky, { s, eyes, tilt, blink });
    // sweat drop
    if (state === 'live' && timeLeft < timeMax * .5) {
      const sy = ky - 180 * s + ((T * 1.2) % 1) * 30 * s;
      g.fillStyle = 'rgba(140,200,255,.85)'; g.beginPath(); g.moveTo(kx - 70 * s, sy - 10 * s); g.quadraticCurveTo(kx - 60 * s, sy + 6 * s, kx - 70 * s, sy + 8 * s); g.quadraticCurveTo(kx - 80 * s, sy + 6 * s, kx - 70 * s, sy - 10 * s); g.fill();
    }
    // tiny scissors
    const sx = kx - 120 * s, sy2 = ky - 40 * s;
    g.save(); g.translate(sx, sy2); g.rotate(-.5 + (state === 'live' ? Math.sin(T * 6) * .1 : 0)); g.scale(s * 2.2, s * 2.2);
    g.strokeStyle = '#ff4f93'; g.lineWidth = 4; g.beginPath(); g.arc(-8, 6, 6, 0, 7); g.stroke(); g.beginPath(); g.arc(8, 6, 6, 0, 7); g.stroke();
    g.strokeStyle = '#c9cfd2'; g.lineWidth = 3.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(-4, 1); g.lineTo(6, -24); g.moveTo(4, 1); g.lineTo(-6, -24); g.stroke();
    g.restore();
  }

  function drawBoomScene() {
    if (state !== 'boom' && state !== 'result') return;
    const t = state === 'result' ? 3 : stT;
    // scorch mark
    g.fillStyle = 'rgba(40,30,25,.55)'; g.beginPath(); g.ellipse(B.x + B.w / 2, B.y + B.h * .6, B.w * .55, B.h * .35, 0, 0, 7); g.fill();
    for (const s of smoke) {
      const a = clamp(s.life / s.max, 0, 1) * .55;
      const sg = g.createRadialGradient(s.x, s.y, 2, s.x, s.y, s.r);
      sg.addColorStop(0, `rgba(${s.g + 40},${s.g + 30},${s.g + 25},${a})`); sg.addColorStop(1, `rgba(${s.g},${s.g},${s.g},0)`);
      g.fillStyle = sg; g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill();
    }
    if (t > .45) {
      const p = clamp((t - .45) / .35, 0, 1), e = 1 - Math.pow(1 - p, 3);
      const cx = W / 2, cy = B.y + B.h * .78 + (1 - e) * 120;
      const s = Math.min(W * .62, 300) / 200;
      const bob = Math.sin(t * 9) * 2;
      drawKewei(g, cx, cy + bob, { s, soot: 1, puff: 1, eyes: t > 1.6 && (t % 2.4) > 2.15 ? 'shock' : 'x', tilt: Math.sin(t * 3) * .05 });
      // smoke wisps from head
      for (let k = 0; k < 3; k++) {
        const ph = (t * .8 + k / 3) % 1;
        g.fillStyle = `rgba(90,85,80,${.4 * (1 - ph)})`; g.beginPath(); g.arc(cx - 40 * s + k * 40 * s, cy - 230 * s - ph * 60, 10 + ph * 16, 0, 7); g.fill();
      }
      if (t > .7) {
        g.save(); g.translate(cx, Math.max(safeTop() + 100, cy - 205 * s - 46)); g.rotate(-.08); g.scale(1 + Math.max(0, .9 - t) * 2, 1 + Math.max(0, .9 - t) * 2);
        g.font = `900 ${Math.round(clamp(W * .16, 48, 80))}px "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 8; g.strokeStyle = '#fffaf2'; g.strokeText('砰！', 0, 0); g.fillStyle = '#c2402a'; g.fillText('砰！', 0, 0);
        g.restore();
      }
    }
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-6, 6) * shake, rand(-5, 5) * shake);
    if (zoom > 1.001) { g.translate(zoomX, zoomY); g.scale(zoom, zoom); g.translate(-zoomX, -zoomY); }
    drawBackdrop();
    if (state !== 'boom' && state !== 'result') { drawBomb(); drawKitty(); }
    else drawBoomScene();
    for (const p of parts) {
      g.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1); g.fillStyle = p.c;
      if (p.spark) { g.strokeStyle = p.c; g.lineWidth = p.r; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * .025, p.y - p.vy * .025); g.stroke(); }
      else { g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
    }
    g.globalAlpha = 1;
    for (const p of popups) {
      g.globalAlpha = clamp(p.life, 0, 1);
      g.font = '900 22px "Noto Serif TC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 5; g.strokeStyle = '#fffaf2'; g.strokeText(p.txt, p.x, p.y); g.fillStyle = p.c; g.fillText(p.txt, p.x, p.y);
    }
    g.globalAlpha = 1;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    // danger vignette
    if ((state === 'live' && timeLeft < 3) || state === 'doom') {
      const pulse = .5 + .5 * Math.sin(T * (state === 'doom' ? 40 : 14));
      const a = (state === 'doom' ? .5 : .32 * (1 - timeLeft / 3) + .12) * (reduced ? .6 : pulse);
      const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
      vg.addColorStop(0, 'rgba(194,40,30,0)'); vg.addColorStop(1, `rgba(194,40,30,${a})`);
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }
    if (flash > 0) { g.fillStyle = `rgba(255,250,235,${reduced ? flash * .4 : flash})`; g.fillRect(0, 0, W, H); }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }

  let last = 0;
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  // title preview bomb
  gen = mulberry(20261023);
  cur = buildLevel(3);
  fit();
  const b = getBest();
  $('bestTitle').textContent = b == null ? '第一次拆彈？深呼吸。' : `個人最高紀錄 ${b} 分`;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
