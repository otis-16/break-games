<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LH = 26;       // layer height (same as original)
  const PAD = 10;      // bake padding around a cutlet
  const TOPF = 11;     // visible top face of a cutlet (covered by the next layer)

  let W, H, DPR, baseY;
  let state = 'title', T = 0;
  let blocks = [], cur = null, falling = [], dir = 1, speed = 150, perfects = 0, combo = 0, maxCombo = 0;
  let crumbs = [], sparks = [], floats = [], confetti = [];
  let camT = 0, zT = 1, overT = 0, shake = 0, lastRes = null, seedN = 1, w0 = 200, sheetH = 260;
  const V = { cam: 0, z: 1 };

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-stack-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-stack-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, noiseBuf = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function crunch(dur, freq, q, vol, delay = 0) {
    if (!AC || muted || !noiseBuf) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const gn = AC.createGain();
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .004); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, rand(0, .3)); s.stop(t + dur + .02);
  }
  const sfx = {
    land: () => { tone(150, .14, 'sine', .28, -70); crunch(.07, 2600, .9, .22); },
    cut: () => { crunch(.08, 4200, 1.4, .32); crunch(.06, 2200, 1.2, .22, .035); crunch(.05, 3400, 1.6, .16, .07); },
    perfect: c => {
      const k = Math.pow(2, Math.min(c, 14) / 12);
      tone(660 * k, .18, 'sine', .16); tone(990 * k, .28, 'triangle', .1, 0, .06);
    },
    miss: () => { tone(320, .55, 'triangle', .2, -220); crunch(.2, 900, .7, .2, .05); },
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => { tone(220, .4, 'sawtooth', .07, -80); }
  };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();

  // ---------- helpers ----------
  function rng(seed) {
    let a = (seed * 2654435761) >>> 0;
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
  function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
  function rrect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  // ---------- cutlet baking ----------
  // Each cutlet is drawn once to its own canvas: bumpy batter outline, crumbs, pepper flecks,
  // and a pale meat face on any side that has been cut straight.
  function bake(w, seed, cutL, cutR) {
    w = Math.max(1, w);
    const cw = w + PAD * 2, ch = LH + TOPF + PAD * 2;
    const c = document.createElement('canvas');
    c.width = Math.ceil(cw * DPR); c.height = Math.ceil(ch * DPR);
    const x = c.getContext('2d'); x.scale(DPR, DPR);
    const R = rng(seed);
    // TT = top of the visible top face, T0 = front lip, B0 = bottom
    const L0 = PAD, R0 = PAD + w, TT = PAD + 1, T0 = PAD + TOPF, B0 = PAD + TOPF + LH - .5;
    const crT = Math.min(TOPF + 3, w * .36), crB = Math.min(8, w * .3);
    const nT = Math.max(4, Math.round(w / 7));
    const pts = [];
    const corner = (px, cr, k) => {
      const dl = px - L0, dr = R0 - px; let d = 0;
      if (!cutL && dl < cr) d += Math.pow(1 - dl / cr, 2) * cr * k;
      if (!cutR && dr < cr) d += Math.pow(1 - dr / cr, 2) * cr * k;
      return d;
    };
    // lumpy top edge: batter clusters
    for (let i = 0; i <= nT; i++) {
      const px = L0 + i / nT * w, edge = i === 0 || i === nT;
      pts.push([px + (edge ? 0 : (R() - .5) * 2.5), TT + corner(px, crT, .9) + (R() - .3) * 3.6 + Math.sin(i * 1.7 + seed) * 1.2]);
    }
    if (!cutR) for (let i = 1; i < 5; i++) { const s = i / 5; pts.push([R0 + Math.sin(s * Math.PI) * 3.6 + (R() - .5) * 2.4, T0 - 4 + s * (B0 - T0 + 4)]); }
    for (let i = nT; i >= 0; i--) {
      const px = L0 + i / nT * w, edge = i === 0 || i === nT;
      pts.push([px + (edge ? 0 : (R() - .5) * 2), B0 - corner(px, crB, .6) + (R() - .5) * 1.8]);
    }
    if (!cutL) for (let i = 4; i > 0; i--) { const s = i / 5; pts.push([L0 - Math.sin(s * Math.PI) * 3.6 + (R() - .5) * 2.4, T0 - 4 + s * (B0 - T0 + 4)]); }
    const path = () => {
      x.beginPath();
      const n = pts.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const s = m(pts[n - 1], pts[0]); x.moveTo(s[0], s[1]);
      for (let i = 0; i < n; i++) { const p = pts[i], q = m(p, pts[(i + 1) % n]); x.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
      x.closePath();
    };
    const f = (y) => clamp((y - TT) / (B0 - TT), 0, 1);
    const gr = x.createLinearGradient(0, TT, 0, B0);
    gr.addColorStop(0, '#fbd57e'); gr.addColorStop(f(T0) * .9, '#f2b452');
    gr.addColorStop(f(T0 + 3), '#e39a3a'); gr.addColorStop(f(T0 + LH * .55), '#cf7f2a'); gr.addColorStop(1, '#93491a');
    x.save(); x.shadowColor = 'rgba(90,45,10,.38)'; x.shadowBlur = 7; x.shadowOffsetY = 3;
    path(); x.fillStyle = gr; x.fill(); x.restore();

    let msg = lastRes.n === 0
      ? '我在《雞排疊疊樂》第一片就掉滿地了，你來試試看能疊幾片？'
      : `我在《雞排疊疊樂》疊了 ${lastRes.n} 片大雞排（${lastRes.rk} 級・${lastRes.role}），換你來疊：`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: '雞排疊疊樂', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- loop ----------
  let last = 0;
  function step(dt) {
    T += dt;
    if (state === 'play' && cur) {
      cur.x += speed * dir * dt;
      if (cur.x < 6) { cur.x = 6; dir = 1; }
      if (cur.x + cur.w > W - 6) { cur.x = W - 6 - cur.w; dir = -1; }
    } else if (state === 'over') {
      overT += dt;
      if (overT > 1.3) finish();
    } else if (state === 'result') {
      overT += dt;
    }
    const k = Math.min(1, dt * (state === 'result' ? 3.5 : 6));
    V.cam += (camT - V.cam) * k; V.z += (zT - V.z) * k;
    for (const b of blocks) b.sq += dt;
    if (cur) cur.sq += dt;
    for (const f of falling) { f.vy += 1200 * dt; f.dy += f.vy * dt; f.dx += f.vx * dt; f.rot += f.vr * dt; }
    falling = falling.filter(f => f.dy < H * 2.5);
    for (const c of crumbs) { c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.life -= dt; }
    crumbs = crumbs.filter(c => c.life > 0);
    for (const s of sparks) { s.life -= dt; s.y -= dt * 18; s.rot += dt * 2; }
    sparks = sparks.filter(s => s.life > 0);
    for (const f of floats) f.life -= dt;
    floats = floats.filter(f => f.life > 0);
    for (const c of confetti) { c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .99; c.rot += c.vr * dt; c.life -= dt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - dt);
  }
  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
    drawBg();
    drawWorld();
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', () => {
    fit();
    if (state === 'title') reset();
    else if (state === 'play') camT = Math.max(0, blocks.length * LH - (baseY - H * .42));
  });
  fit(); reset();
  const b = getBest();
  $('bestTitle').textContent = b == null ? '今天第一份' : `個人最高紀錄 ${b} 片`;
  requestAnimationFrame(frame);
})();
</script>
</body>
