  // ---------- event scripts ----------
  const prog = () => clamp(dayT / DAY, 0, 1);

  function mk(steps) { return { steps, i: 0, t: 0, started: false, chain: null }; }
  function idle(d) { return mk([{ d, f: () => { B.mood = 'work'; } }]); }
  function realTurn(silent) {
    const w = win(), look = rand(1, 1.8);

      { d: w, s: () => { if (silent) { sfx.creak(); say('boss', '……', w + .2); } else { sfx.cough(); sfx.creak(); say('boss', pick(['咳咳！', '嗯哼！', '咳！']), w + .2); } }, f: k => { B.turn = .5 * k * k; danger = 1; } },
      { d: .08, f: k => { B.turn = .5 + .5 * k; B.seeing = true; B.mood = 'look'; } },
      { d: look, s: () => say('boss', pick(LOOK), look), f: () => { B.turn = 1; B.seeing = true; } },
      { d: .35, s: () => { B.mood = 'work'; }, f: k => { B.turn = 1 - k; B.seeing = B.turn >= .5; }, e: () => { B.turn = 0; B.seeing = false; } }
    ]);

  function sneeze() {
    const e = mk([
      { d: .5, s: () => { sfx.ha(0); say('boss', '哈……', .6); }, f: k => { B.headUp = k * 6; danger = .55; } },
      { d: .45, s: () => { sfx.ha(1); say('boss', '哈………', .55); }, f: k => { B.headUp = 6 + k * 5; B.turn = .07 * k; danger = .65; } },
      { d: .45, s: () => { sfx.achoo(); say('boss', '哈啾！', .8); shake = .2; sprayOut(); }, f: k => { B.headUp = 11 * (1 - k) - 5 * Math.sin(k * Math.PI); B.turn = .07 * (1 - k); } },
      { d: .5, s: () => say('boss', pick(['誰在想我', '冷氣太強了', '抱歉抱歉']), .7), f: () => { B.headUp = 0; } }

  function phoneCall() {
    const chain = Math.random() < .25 + .3 * prog();
    const talk = rand(1.3, 2.2);
    const e = mk([
      { d: 1.1, s: () => { sfx.ring(); say('boss', '鈴鈴鈴', 1.1); }, f: () => { danger = .35; } },
      { d: .4, s: () => { say('boss', '喂？', .5); B.mood = 'phone'; }, f: k => { B.turn = .2 * k; } },
      { d: talk, s: () => say('boss', chain ? pick(['好，我現在看一下他們', '你等等，我回頭看看']) : pick(['王董！是是是…', '對，他們都很認真', '老婆，我在開會…', '今晚聚餐？好啊！', '那個高爾夫球…']), talk), f: () => { B.turn = .2; } },
      { d: .4, f: k => { B.turn = .2 * (1 - k); }, e: () => { B.mood = 'work'; } }
    ]);
    if (chain) e.chain = realTurn(Math.random() < .5);
    return e;
  }
  function stepsScript(n, int, kind, from, to, nearFn, opts = {}) {
    let fired = 0;
    return { d: n * int, s: () => { S = { kind, x: from, near: 0 }; fired = 0; }, f: k => {
      const t = k * n; while (fired <= t && fired < n) { sfx.step(clamp(nearFn(fired / n) * (opts.vol || 1), .1, 1)); fired++; }
      S.x = lerp(from, to, k); S.near = nearFn(k); danger = Math.max(danger, (opts.danger || .5) * S.near);
    } };
  }
  const PASSBY = { auntie: ['掃地喔～腳抬一下', '垃圾桶我收走囉'], delivery: ['誰的手搖飲？', '外送～半糖少冰的'], boba: ['欸你們要不要團購？', '我只是去裝水'] };
  function passby() {
    const kind = pick(['auntie', 'delivery', 'boba']);
    return mk(passbyStep(kind));
  }
  function passbyStep(kind) {
    return [stepsScript(6, .34, kind, 1.25, -.25, k => 1 - Math.abs(k - .5) * 1.6, { danger: .45 }), { d: .01, s: () => { if (Math.random() < .7) say('door', pick(PASSBY[kind]), 1.2); S = null; } }];
  }
  function patrol() {
    const w = win(), look = rand(1, 1.6), fakeBoss = Math.random() < .3, extra = Math.random() < .45;
    const steps = [
      { d: .6, s: () => { sfx.creak(); if (Math.random() < .6) say('boss', pick(['我去巡一下', '去倒杯水', '來走走']), .9); B.walk = .001; }, f: () => {} },
      { d: 1.1, f: k => { B.walk = Math.max(.001, k); } , e: () => { B.out = true; B.walk = 0; } },
      { d: rand(.8, 2.4) }
    ];
    if (extra) steps.push(...passbyStep(pick(['auntie', 'delivery', 'boba'])), { d: rand(.5, 1.4) });
    const int = lerp(.42, .3, prog());
    if (fakeBoss) {
      steps.push(stepsScript(7, int, 'boss', 1.25, -.25, k => 1 - Math.abs(k - .5) * 1.6, { danger: .8 }), { d: .01, s: () => { S = null; } }, { d: rand(.8, 1.8) });
    }
    steps.push(
      stepsScript(5, int, 'boss', 1.2, .5, k => k, { danger: .8 }),
      { d: w, s: () => { sfx.click(); }, f: k => { D.handle = k; danger = 1; S.near = 1; } },
      { d: .12, s: () => { S = null; B.mood = 'look'; }, f: k => { D.open = k; B.seeing = true; } },
      { d: look, s: () => say('door', pick(DOORLOOK), look), f: () => { D.open = 1; B.seeing = true; } },
      { d: .35, s: () => { B.mood = 'work'; }, f: k => { D.open = 1 - k; D.handle = 1 - k; B.seeing = k < .3; }, e: () => { D.open = 0; D.handle = 0; B.seeing = false; } },
      stepsScript(3, .38, 'boss', .5, -.25, k => 1 - k, { danger: .1, vol: .6 }),
      { d: .01, s: () => { S = null; } },
      { d: rand(.6, 1.4) },
      { d: 1.0, s: () => { B.out = false; B.walk = 1; }, f: k => { B.walk = Math.max(.001, 1 - k); }, e: () => { B.walk = 0; } }
    );
    return mk(steps);
  }
  function nextEvent() {
    if (firstEvent) { firstEvent = false; return realTurn(false); }
    const p = prog();
    const opts = [[() => realTurn(Math.random() < .35 * p), 1], [sneeze, .3 + .3 * p], [halfTurn, .25 + .3 * p], [phoneCall, .18 + .25 * p], [passby, .18 + .2 * p], [patrol, .25 + .2 * p]];
    let tot = opts.reduce((a, o) => a + o[1], 0), r = Math.random() * tot;
    for (const [f, wt] of opts) { if ((r -= wt) <= 0) return f(); }
    return realTurn(false);
  }
  function runEvent(dt) {
    if (!ev) ev = idle(2.6);
    let st = ev.steps[ev.i];
    if (!ev.started) { ev.started = true; st.s && st.s(); }
    ev.t += dt;
    st.f && st.f(clamp(ev.t / st.d, 0, 1));
    if (ev.t >= st.d) {
      st.e && st.e();
      ev.i++; ev.t = 0; ev.started = false;
      if (ev.i >= ev.steps.length) {
        const wasIdle = ev.steps.length === 1 && !ev.steps[0].s;
        B.seeing = false; B.headUp = 0;
        ev = ev.chain ? ev.chain : wasIdle ? nextEvent() : idle(rand(1.4, 3.4) * (1 - .45 * prog()));
      }
    }
  }
  function sprayOut() {
    if (reduced) return;
    for (let i = 0; i < 14; i++) spray.push({ x: L.bx + rand(-6, 6), y: L.by - 160 * L.bs, vx: rand(-60, 60), vy: rand(-90, -20), a: .9 });
  }

  // ---------- game flow ----------
  function start() {
    window.DGH_DAILY && DGH_DAILY.reseed();
    state = 'play'; dayT = 0; slack = 0; holding = false; lift = 0; phoneT = 0; everHeld = false;
    ev = null; firstEvent = true; coworkerT = rand(5, 8);
    caughtT = 0; graceT = 0; endT = 0; lastRelease = -9; wasSeeing = false; slowmo = 1; zoom = 0; danger = 0; flash = 0;
    bubbles = {}; pops = []; confetti = []; spray = []; S = null;
    Object.assign(B, { turn: 0, mood: 'work', headUp: 0, out: false, walk: 0, seeing: false });
    Object.assign(D, { open: 0, handle: 0 });
    const slip = $('slip'); slip.hidden = true; void slip.offsetWidth; slip.hidden = false;
    $('sheet').hidden = true; $('title').hidden = true; $('hint').hidden = false;
    renderHud();
  }
  let hudS = '';
  function renderHud() {
    const s = slack.toFixed(1); if (s !== hudS) { hudS = s; $('slack').textContent = s; }
    const mins = Math.floor(9 * 60 + prog() * 9 * 60), c = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
    if ($('clock').textContent !== c) $('clock').textContent = c;
    $('dayBar').style.width = (prog() * 100).toFixed(1) + '%';
  }
  function getCaught() {
    state = 'caught'; caughtT = 0; holding = false;
    B.mood = 'angry'; caughtBy = D.open > 0 ? 'door' : 'office';
    say(caughtBy === 'door' ? 'door' : 'boss', pick(['手機很好玩齁？', '你在打哪一關？', '我也想玩，交出來', '這就是你的 KPI？', '來，我們聊聊']), 3);
    sfx.caught(); shake = .7; flash = 1;
    if (navigator.vibrate) try { navigator.vibrate([60, 40, 120]); } catch (e) {}
    say('left', pick(['（假裝打字）', '我什麼都沒看到', '……R.I.P.']), 2.4);
  }
  function finish(caught) {
    state = 'result';
    const score = Math.round(slack * 10) / 10;
    let rk, role;
    if (score >= 48 && !caught) { rk = 'S'; role = '摸魚之神'; }
    else if (score >= 32) { rk = 'A'; role = '薪水小偷'; }
    else if (score >= 15) { rk = 'B'; role = '被瞄一眼'; }
    else { rk = 'C'; role = '收到人事通知'; }
    const prev = getBest(); const isNew = prev == null || score > prev;
    if (isNew) setBest(score);
    window.DGH_DAILY && DGH_DAILY.save(score);
    $('rank').textContent = rk; $('role').textContent = role; $('score').textContent = score.toFixed(1);
    const mins = Math.floor(9 * 60 + prog() * 9 * 60), clock = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
    const quips = caught
      ? (rk === 'A' ? ['摸得很兇，可惜被逮。', '神之手，敗在最後一眼。'] : rk === 'B' ? ['偷得不多，被抓得很徹底。', '下一份工作記得坐靠窗。'] : ['人事已經在印離職單了。', '上班第一天就想放假？'])
      : (rk === 'S' ? ['全公司最努力的人——在手機上。', '老闆到退休都不會知道。'] : rk === 'A' ? ['薪水領得心安理得（並沒有）。', '你的 Excel 開了一整天。'] : rk === 'B' ? ['太認真了，公司會感動。', '摸魚要有膽，不是有眼。'] : ['你今天是真的在上班？', '老闆都想頒獎給你了。']);
    const lines = caught
      ? `${clock} 在${caughtBy === 'door' ? '門口' : '座位上'}被老闆當場抓到。<br>總共偷玩了 <b>${score.toFixed(1)} 秒</b>。${pick(quips)}`
      : `撐到 18:00 下班鐘響，全身而退。<br>今天摸魚 <b>${score.toFixed(1)} 秒</b>。${pick(quips)}`;
    const bestLine = isNew && score > 0 ? `<br><span class="newbest">刷新個人最高紀錄</span>` : prev != null ? `<br>個人最高：${prev.toFixed(1)} 秒` : '';
    $('detail').innerHTML = lines + bestLine;
    lastRes = { score, rk, role, caught };
    $('slip').hidden = true; $('hint').hidden = true;
    $('sheet').hidden = false;
    if (rk === 'S') sfx.bell(); else if (rk === 'C') sfx.bad(); else sfx.ok();
    if (navigator.vibrate) try { navigator.vibrate(rk === 'S' ? [20, 40, 20] : 15); } catch (e) {}
    if (rk === 'S' && !reduced) burst();
  }
  function burst() {
    const cols = ['#c2402a', '#6f8f78', '#e7b75f', '#3a2a20', '#f2a7a0'];
    for (let i = 0; i < 90; i++) confetti.push({ x: W / 2 + rand(-40, 40), y: H * .3, vx: rand(-260, 260), vy: rand(-520, -180), r: rand(3, 6), c: cols[i % cols.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.6) });
  }

  // ---------- input ----------
  function press(e) {
    if (e.target.closest && e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state !== 'play') return;
    e.preventDefault && e.preventDefault();
    holding = true; everHeld = true; $('hint').hidden = true;
  }
  function release() {
    if (holding && state === 'play') lastRelease = dayT;
    holding = false;
  }
  addEventListener('pointerdown', press, { passive: false });
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
  addEventListener('blur', release);
  document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { initAudio(); if (state === 'play') { holding = true; everHeld = true; $('hint').hidden = true; } e.preventDefault(); } });
  addEventListener('keyup', e => { if (e.code === 'Space') release(); });

  $('go').addEventListener('click', () => { initAudio(); start(); });
  $('again').addEventListener('click', () => { initAudio(); start(); });
  $('share').addEventListener('click', async () => {
    if (!lastRes) return;
    let msg = lastRes.caught
      ? `我在《老闆來了》偷玩手機 ${lastRes.score.toFixed(1)} 秒，然後被老闆當場抓包（${lastRes.rk} 級・${lastRes.role}）。換你摸摸看：`
      : `我在《老闆來了》上班摸魚 ${lastRes.score.toFixed(1)} 秒還全身而退（${lastRes.rk} 級・${lastRes.role}）！換你：`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: '老闆來了', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- loop ----------
  const COWORK = ['這份 Excel 你已經看四十分鐘了', '我幫你把風…算了我也在滑', '聽說老闆換了新眼鏡', '今天週五，摸魚有加成', '上一個被抓的，現在在賣雞排', '幫我也打一關', '冷氣好冷，老闆眼神更冷', '你手機亮度調低一點啦', '午餐要不要訂便當？', '我已經裝忙三小時了'];
  let camScale = 1;
  function step(rdt) {
    T += rdt;
    const dt = rdt * slowmo;
    if (state === 'play') {
      dayT += dt;
      danger = 0;
      runEvent(dt);
      if (holding) { slack += dt; phoneT += dt; const before = Math.floor((phoneT - dt) * 1.6); if (Math.floor(phoneT * 1.6) !== before) sfx.blip(); }
      // caught check with a tiny grace
      if (B.seeing && holding) { graceT += dt; if (graceT > .06) getCaught(); } else graceT = 0;
      if (B.seeing && !wasSeeing && !holding && dayT - lastRelease < .22 && state === 'play') {
        pops.push({ x: W / 2, y: H * .56, text: '好險！', t: 0 }); sfx.phew(); if (!reduced) { slowmo = .35; }
      }
      wasSeeing = B.seeing;
      // heartbeat
      if (danger > .3) { beatT -= dt; if (beatT <= 0) { sfx.beat(danger); beatT = lerp(.75, .32, danger) * (holding ? .8 : 1); } } else beatT = 0;
      // idle chatter
      coworkerT -= dt;
      if (coworkerT <= 0 && danger < .2) { coworkerT = rand(6, 10); say(Math.random() < .5 ? 'left' : 'right', pick(COWORK), 2.2); }
      if (dayT >= DAY) {
        state = 'end'; endT = 0; holding = false; B.seeing = false; danger = 0; S = null; D.open = 0; B.out = false; B.walk = 0; B.turn = 0; B.mood = 'work';
        sfx.bell(); say('boss', '下班了，明天見', 1.6); say('right', '收工收工！', 1.4);
      }
      renderHud();
    } else if (state === 'caught') {
      caughtT += rdt;
      slowmo = caughtT < 1 && !reduced ? .25 : 1;
      zoom = Math.min(1, zoom + rdt * 1.6);
      if (caughtT > .95 && caughtT - rdt <= .95) { sfx.stamp(); shake = .5; }
      if (caughtT > 2.5) finish(true);
    } else if (state === 'end') {
      endT += rdt; if (endT > 1.4) finish(false);
    }
    if (state !== 'caught') { slowmo = Math.min(1, slowmo + rdt * 1.5); zoom = Math.max(0, zoom - rdt * 2); }
    if (state === 'title') { B.turn = 0; }
    lift += ((holding ? 1 : 0) - lift) * Math.min(1, rdt * 16);
    for (const who in bubbles) { bubbles[who].t += rdt; if (bubbles[who].t > bubbles[who].life) delete bubbles[who]; }
    for (const p of pops) p.t += rdt; pops = pops.filter(p => p.t < 1);
    for (const s of spray) { s.x += s.vx * rdt; s.y += s.vy * rdt; s.vy += 160 * rdt; s.a -= rdt * 1.2; } spray = spray.filter(s => s.a > 0);
    for (const c of confetti) { c.vy += 700 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; c.vx *= .99; c.rot += c.vr * rdt; c.life -= rdt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - rdt); flash = Math.max(0, flash - rdt * 2.5);
  }
  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    // camera: zoom toward whoever caught you
    const z = ease(zoom);
    camScale = 1 + z * .9;
    const fx = caughtBy === 'door' ? L.dx + L.dw / 2 : L.bx, fy = caughtBy === 'door' ? L.dy + L.dh * .35 : L.by - 150 * L.bs;
    g.translate(W / 2, H / 2); g.scale(camScale, camScale); g.translate(-lerp(W / 2, fx, z), -lerp(H / 2, fy, z));
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
    drawWall();
    drawOffice();
    drawDoor();
    for (const s of spray) ell(s.x, s.y, 2, 2, `rgba(200,230,255,${s.a})`);
    drawPartitions();
    drawDesk();
    drawHandsPhone();
    drawBubbles();
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    // danger vignette
    const dv = state === 'play' ? danger * (.55 + .45 * Math.sin(T * 14)) : 0;
    if (dv > .02 || flash > 0) {
      const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
      vg.addColorStop(0, 'rgba(194,64,42,0)'); vg.addColorStop(1, `rgba(194,64,42,${Math.min(.55, dv * .35 + flash * .5)})`);
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }
    if (flash > .5) { g.fillStyle = `rgba(255,255,255,${(flash - .5) * .8})`; g.fillRect(0, 0, W, H); }
    for (const p of pops) {
      const k = p.t;
      g.save(); g.globalAlpha = clamp(1.4 - k * 1.4, 0, 1); g.translate(p.x, p.y - k * 30); g.scale(1 + (1 - Math.min(1, k * 5)) * .6, 1 + (1 - Math.min(1, k * 5)) * .6); g.rotate(-.06);
      g.font = '900 34px "Noto Serif TC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 6; g.strokeStyle = '#fffaf2'; g.strokeText(p.text, 0, 0); g.fillStyle = '#6f8f78'; g.fillText(p.text, 0, 0);
      g.restore();
    }
    // the stamp
    if ((state === 'caught' && caughtT > .95) || (state === 'result' && lastRes && lastRes.caught)) {
      const k = state === 'caught' ? clamp((caughtT - .95) / .18, 0, 1) : 1;
      const fs = Math.min(W * .1, 46);
      g.save(); g.translate(W / 2, H * .62); g.rotate(-.14); g.scale(lerp(2.6, 1, k), lerp(2.6, 1, k)); g.globalAlpha = k;
      g.font = `900 ${fs}px "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      const tw = g.measureText('你明天不用來了').width;
      g.fillStyle = 'rgba(255,250,242,.9)'; rrect(-tw / 2 - 18, -fs * .85, tw + 36, fs * 1.7, 8); g.fill();
      g.strokeStyle = '#c2402a'; g.lineWidth = 4; g.stroke();
      g.lineWidth = 1.5; rrect(-tw / 2 - 11, -fs * .85 + 7, tw + 22, fs * 1.7 - 14, 5); g.stroke();
      g.fillStyle = '#c2402a'; g.fillText('你明天不用來了', 0, 2);
      g.restore();
    }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  let last = 0;
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  const b = getBest();
  $('bestTitle').textContent = b == null ? '今天第一天上班' : `個人最高紀錄 ${b.toFixed(1)} 秒`;
  requestAnimationFrame(frame);
})();
</script>
</body>
