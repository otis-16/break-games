<style>
/* Top-down afternoon street: arcade, white-painted slots, one stubborn gap. Single light look by choice. */
:root {

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;

}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--stamp); outline-offset: 3px; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.mute {

}
.mute svg { width: 20px; height: 20px; }

/* ticket */
.slip {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(14px, env(safe-area-inset-left, 0px));
  z-index: 10;
  width: 136px;
  padding: 9px 11px 11px;
  background: var(--paper);
  box-shadow: 0 6px 18px rgba(58, 42, 32, .14);
  font-size: 12px;
  line-height: 1.45;
  transform: rotate(-2.5deg);
  transform-origin: 20% 0;
  animation: print .5s cubic-bezier(.2, .9, .3, 1.2) both;
  pointer-events: none;
}
.slip::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
  background: linear-gradient(-45deg, transparent 4px, var(--paper) 0) 0 0 / 8px 6px repeat-x,

}
@keyframes print { from { transform: rotate(-2.5deg) translateY(-130%); } }
.slip .no { display: flex; justify-content: space-between; color: var(--ink-soft); letter-spacing: .06em; border-bottom: 1px dashed var(--cream-2); padding-bottom: 3px; margin-bottom: 3px; }

.title {

  z-index: 15;
  padding: calc(env(safe-area-inset-top, 0px) + 9vh) max(24px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px));

}
.kicker { margin: 0; font-family: var(--f-latin); letter-spacing: .32em; font-size: 12px; color: var(--ink-soft); }
.title h1 {
  margin: 0;
  font-family: var(--f-disp); font-weight: 900;
  font-size: clamp(56px, 19vw, 112px);

}
.title h1 span { color: var(--stamp); }
.sub { margin: 2px 0 0; font-family: var(--f-disp); font-size: 18px; letter-spacing: .4em; color: var(--ink-soft); padding-left: .4em; }
.how { margin: 18px 0 4px; font-size: 14px; line-height: 1.8; color: var(--ink-soft); }
.go {
  margin-top: 10px;

.sheet {

.sheet-in { max-width: 420px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.rank {

@keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } }
.role { margin: 0; font-family: var(--f-disp); font-size: 22px; font-weight: 900; align-self: end; }
.score { margin: 0; align-self: start; color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
.score b { font-family: var(--f-latin); font-weight: 400; font-size: 28px; color: var(--ink); margin-right: 2px; }
.detail { grid-column: 1 / -1; margin: 12px 0 0; padding: 10px 12px; background: var(--cream); border-radius: 10px; font-size: 13px; line-height: 1.6; font-variant-numeric: tabular-nums; }
.newbest { color: var(--sage); font-weight: 700; }
.btns { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btns button { padding: 13px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: transform .12s ease; }
.btns button:active { transform: scale(.97); }
#again { background: var(--ink); color: var(--paper); }
#share { background: var(--cream); }

@media (prefers-reduced-motion: reduce) {
  .slip, .sheet, .rank, .hint, .slip .tgt.low { animation: none; }
}
</style>

      const n = circ(pOBB(), dog.x, dog.y, 11);
      if (n) {
        hit(n, 1.1); dog.run = 1.6; dog.a = Math.atan2(-n.ny, -n.nx);
        if (bumpCD <= 0) { bumpCD = 1.4; sfx.yelp(); dog.barkT = 1; penal(dog.x, dog.y, '嚇到狗 −30'); say(pick(L_DOG)); }
      }
    }
  }
  function penal(x, y, text) { bumps++; $('pen').textContent = `罰單 ${bumps} 張`; floatText(x, y - 30, text); }

  function inSlot() {
    const half = lv.gap / 2 + 1.5;
    for (const p of corners(pOBB())) if (p.x < lv.sx - half || p.x > lv.sx + half || p.y < ROW_TOP || p.y > ROW_BOT + 4) return false;
    return true;
  }
  const aligned = () => Math.abs(Math.sin(P.a)) > Math.cos(15 * Math.PI / 180);

  function stepWorld(dt) {
    // truck
    if (truck) {
      if (truck.wait > 0) truck.wait -= dt;
      else {
        truck.x += truck.dir * truck.v * dt;
        if ((truck.dir > 0 && truck.x > WW + 130) || (truck.dir < 0 && truck.x < -130)) { truck.dir *= -1; truck.wait = rand(1.2, 2.4); }
      }
      const vis = truck.x > -90 && truck.x < WW + 90 && truck.wait <= 0;
      if (vis) {
        eliseT -= dt;
        if (eliseT <= 0) { const f = ELISE[eliseI++ % ELISE.length]; if (f) tone(f, .24, 'triangle', .045); eliseT = .2; }
        if (Math.random() < dt * .4 && bubble.t <= 0) say('垃圾車來了！快閃！');
      }
    }
    // dog
    if (dog) {
      dog.barkT = Math.max(0, dog.barkT - dt * 1.5);
      const near = Math.hypot(P.x - dog.x, P.y - dog.y);
      if (near < 70 && Math.hypot(P.vx, P.vy) > 30 && dog.run <= 0) { dog.run = 1.2; dog.barkT = 1; sfx.bark(); dog.a = Math.atan2(dog.y - P.y, dog.x - P.x); }
      let sp = dog.sp;
      if (dog.run > 0) { dog.run -= dt; sp = 120; }
      else {
        if (Math.hypot(dog.tx - dog.x, dog.ty - dog.y) < 10) { dog.tx = rand(30, WW - 30); dog.ty = rand(270, 640); }
        dog.a += clamp(angDiff(Math.atan2(dog.ty - dog.y, dog.tx - dog.x), dog.a), -3 * dt, 3 * dt);
      }
      dog.x = clamp(dog.x + Math.cos(dog.a) * sp * dt, 16, WW - 16);
      dog.y = clamp(dog.y + Math.sin(dog.a) * sp * dt, 262, WH - 16);
      if (dog.x <= 16 || dog.x >= WW - 16 || dog.y <= 262 || dog.y >= WH - 16) { dog.a += Math.PI * .8; dog.tx = rand(30, WW - 30); dog.ty = rand(270, 640); }
    }
    // falling chain
    let falling = false;
    for (const s of row) {
      if (s.fall > 0 && s.fall < 1) {
        falling = true;
        const before = s.fall;
        s.fall = Math.min(1, s.fall + dt * (2.4 + s.chain * .15));
        if (before < .45 && s.fall >= .45 && !s.passed) {
          s.passed = true;
          const nb = row.find(o => o !== s && o.fall === 0 && Math.abs(o.x - (s.x + s.dir * PITCH)) < 6);
          if (nb) knock(nb, s.dir, s.chain + 1);
        }
        if (s.fall >= 1) { puff(s.x + s.dir * 14, s.y, 8); sfx.thud(); }
      }
    }
    // auntie picks them back up
    if (!falling && row.some(s => s.fall >= 1)) {
      restoreT -= dt;
      if (restoreT <= 0) {
        let any = false;
        for (const s of row) if (s.fall >= 1 && !sat(pOBB(), { x: s.x, y: s.y, a: s.a, hx: SHX + 2, hy: SHY + 2 })) { s.fall = -1; any = true; }
        if (any) { say(pick(['嘿咻～阿姨幫你扶起來了', '扶好了，下次給我小心點', '腰都閃到了啦…']), false); puff(lv.sx, ROW_Y, 6); }
        restoreT = 1;
      }
    }
    for (const s of row) if (s.fall < 0) { s.fall = Math.min(0, s.fall + dt * 3); if (s.fall > -.02) s.fall = 0; }
  }

  // ---------- loop ----------
  let last = 0;
  function step(rdt) {
    let dt = rdt;
    if (slow > 0) { slow -= rdt; dt = rdt * .32; }
    T += dt; stT += rdt;
    bubble.t -= rdt; bumpCD -= dt;
    if (banner) { banner.t -= rdt; if (banner.t <= 0) banner = null; }
    kw.t -= rdt; if (kw.t <= 0 && state !== 'over') kw.mood = 'open'; kw.puff = Math.max(0, kw.puff - rdt * .5);

    if (state === 'intro') {
      stepWorld(dt);
      if (stT > .9) { state = 'play'; stT = 0; }
    } else if (state === 'play') {
      physics(dt);
      stepWorld(dt);
      timeLeft -= dt;
      const sec = Math.ceil(timeLeft);
      if (timeLeft < 5 && sec !== lastTick) { lastTick = sec; sfx.tick(); }
      if (inSlot() && aligned() && Math.hypot(P.vx, P.vy) < 14) {
        holdT += dt;
        if (holdT >= .6) levelClear();
      } else {
        holdT = Math.max(0, holdT - dt * 2);
        if (inSlot() && !aligned() && bubble.t <= 0 && Math.random() < dt * 2) say(pick(L_TILT));
      }
      if (state === 'play' && timeLeft <= 0) { timeLeft = 0; timeUp(); }
      idleT -= rdt;
      if (idleT <= 0 && state === 'play') say(timeLeft < 7 ? pick(['快點啦，我要收攤了！', '要拖吊了喔！']) : pick(L_IDLE));
    } else if (state === 'parked') {
      P.vx *= .8; P.vy *= .8;
      stepWorld(dt);
      if (stT > 1.5) { if (lvIdx >= 5) finish(); else { lvIdx++; setupLevel(); } }
    } else if (state === 'over') {
      P.vx *= .9; P.vy *= .9;
      stepWorld(dt);
      if (stT > 2.2) finish();
    } else if (state === 'title' || state === 'result') {
      stepWorld(dt);
    }
    if (state !== 'play') setEngine(0, false);
    // HUD
    if (state === 'play' || state === 'intro') {
      $('tLeft').textContent = Math.max(0, timeLeft).toFixed(1);
      $('tgt').classList.toggle('low', timeLeft < 5);
    }
    for (const p of parts) { p.x += p.vx * rdt; p.y += p.vy * rdt; p.vx *= .92; p.vy *= .92; p.life -= rdt; if (p.kind === 'dust') p.r += rdt * 10; }
    parts = parts.filter(p => p.life > 0);
    for (const f of floats) { f.y -= 26 * rdt; f.life -= rdt; }
    floats = floats.filter(f => f.life > 0);
    for (const c of confetti) { c.vy += 700 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; c.vx *= .99; c.rot += c.vr * rdt; c.life -= rdt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - rdt);
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    let sx = 0, sy = 0;
    if (shake > 0 && !reduced) { sx = rand(-3, 3) * shake * 4; sy = rand(-2, 2) * shake * 4; }
    g.drawImage(bg, sx, sy, W, H);
    g.setTransform(DPR * k, 0, 0, DPR * k, DPR * (ox + sx), DPR * (oy + sy));
    // target slot glow
    if (state !== 'title') {
      const pulse = .5 + .5 * Math.sin(T * 4);
      g.fillStyle = `rgba(194,64,42,${.1 + pulse * .1})`; g.fillRect(lv.sx - lv.gap / 2, ROW_TOP + 5, lv.gap, ROW_BOT - ROW_TOP - 9);
      g.strokeStyle = `rgba(194,64,42,${.55 + pulse * .35})`; g.lineWidth = 2; g.setLineDash([6, 4]);
      g.strokeRect(lv.sx - lv.gap / 2, ROW_TOP + 5, lv.gap, ROW_BOT - ROW_TOP - 9); g.setLineDash([]);
      if (state === 'play' && P.y > 300) { // bobbing arrow
        g.fillStyle = '#c2402a';
        const ay = ROW_BOT + 22 + Math.sin(T * 5) * 4;
        g.beginPath(); g.moveTo(lv.sx, ay - 9); g.lineTo(lv.sx - 8, ay + 3); g.lineTo(lv.sx + 8, ay + 3); g.fill();
      }
    }
    for (const s of row) if (s.fall <= 0) drawScooter(s.x, s.y, s.a, s.col, { fall: s.fall < 0 ? -s.fall : 0, dir: s.dir });
    for (const s of row) if (s.fall > 0) drawScooter(s.x, s.y, s.a, s.col, { fall: s.fall, dir: s.dir });
    if (car) drawCar(car);
    if (dog) drawDog(dog);
    // player
    if (state !== 'title') {
      drawScooter(P.x, P.y, P.a, '#7fc8b5', { rider: true });
      if (holdT > 0 && state === 'play') {
        g.strokeStyle = '#2f7a55'; g.lineWidth = 3;
        g.beginPath(); g.arc(P.x, P.y, 34, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, holdT / .6)); g.stroke();
      }
    } else {
      drawScooter(200, 600, -Math.PI / 2 + Math.sin(T) * .05, '#7fc8b5', { rider: true });
    }
    for (const p of poles) drawPole(p.x, p.y);
    if (truck && truck.wait <= 0) drawTruck(truck);
    drawAuntie(372, 120, bubble.t > 0 && bubble.scream);
    drawBubble();
    // particles
    for (const p of parts) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.kind === 'dust') { g.fillStyle = p.col + (a * .55).toFixed(3) + ')'; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
      else { g.globalAlpha = a; g.fillStyle = p.col; g.save(); g.translate(p.x, p.y); g.rotate(T * 6); g.fillRect(-p.r, -p.r * .35, p.r * 2, p.r * .7); g.fillRect(-p.r * .35, -p.r, p.r * .7, p.r * 2); g.restore(); g.globalAlpha = 1; }
    }
    g.font = '900 15px "Noto Sans TC", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const f of floats) {
      g.globalAlpha = clamp(f.life * 1.5, 0, 1);
      g.lineWidth = 4; g.strokeStyle = 'rgba(255,250,242,.95)'; g.strokeText(f.text, f.x, f.y); g.fillStyle = f.col; g.fillText(f.text, f.x, f.y);
    }
    g.globalAlpha = 1;
    // banner
    if (banner) {
      const a = clamp(banner.t * 3, 0, 1), sc = 1 + Math.max(0, banner.t - (banner.t > 5 ? 8.6 : 1)) * 2;
      g.save(); g.globalAlpha = a; g.translate(WW / 2, 400); g.rotate(-.05); g.scale(sc, sc);
      g.fillStyle = 'rgba(255,250,242,.94)'; rr(-120, -46, 240, 92, 18); g.fill();
      g.strokeStyle = banner.col; g.lineWidth = 3; rr(-112, -38, 224, 76, 13); g.stroke();
      g.fillStyle = banner.col; g.font = '900 34px "Noto Serif TC", serif'; g.fillText(banner.big, 0, -8);
      g.font = '700 13px "Noto Sans TC", sans-serif'; g.fillStyle = '#7a6555'; g.fillText(banner.small, 0, 24);
      g.restore();
    }
    // screen-space UI
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (joy.on && (state === 'play' || state === 'intro')) {
      let dx = joy.x - joy.ox, dy = joy.y - joy.oy; const len = Math.hypot(dx, dy), m = Math.min(len, 70);
      if (len > 0) { dx = dx / len * m; dy = dy / len * m; }
      g.strokeStyle = 'rgba(255,250,242,.55)'; g.lineWidth = 3; g.beginPath(); g.arc(joy.ox, joy.oy, 70, 0, 7); g.stroke();
      g.fillStyle = 'rgba(58,42,32,.18)'; g.beginPath(); g.arc(joy.ox, joy.oy, 70, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,250,242,.7)'; g.beginPath(); g.moveTo(joy.ox, joy.oy); g.lineTo(joy.ox + dx, joy.oy + dy); g.stroke();
      g.fillStyle = 'rgba(255,250,242,.92)'; g.beginPath(); g.arc(joy.ox + dx, joy.oy + dy, 20, 0, 7); g.fill();
      g.strokeStyle = '#3a2a20'; g.lineWidth = 2; g.stroke();
    }
    // KEWEI cheering from the corner
    if (state !== 'result') {
      const bob = reduced ? 0 : (kw.mood === 'happy' ? -Math.abs(Math.sin(T * 9)) * 8 : Math.sin(T * 2.2) * 1.5);
      drawKewei(g, W - 46, H - 70 + bob, { s: .34, eyes: kw.mood, puff: kw.puff, soot: 0, blink: kw.mood === 'open' && (T % 3.4) < .12, tilt: kw.mood === 'shock' ? Math.sin(T * 30) * .06 : 0 });
    }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
    g.globalAlpha = 1;
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  lv = LEVELS[0]; row = buildRow(lv); poles = [];
  fit();
  const b = getBest();
  $('bestTitle').textContent = b == null ? '今天還沒停過' : `個人最高紀錄 ${b} 分`;
  requestAnimationFrame(frame);
  window.__parking = { startRun, joy }; // test hook
})();
</script>
</body>
</html>
