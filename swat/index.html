<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mul32 = s => () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const DUR = 45;
  const RANKS = [[45, 'S', '蚊子剋星'], [30, 'A', '手很快'], [15, 'B', '被叮幾包'], [-999, 'C', '全身都是包']];

  let W, H, DPR, HR;
  let state = 'title', T = 0, clock = 0, slow = 1, slowT = 0;
  let seeds = [], seedI = 0, cats = [], spawnCD = 0;
  let mozz = [], splats = [], hands = [], parts = [], pops = [], confetti = [];
  let score = 0, kills = 0, bites = 0, catHits = 0, combo = 0, lastKill = -9, bestCombo = 0, swings = 0, doubles = 0;
  let shake = 0, redFlash = 0, lastRes = null, lastSec = 99, cat = null;

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-swat-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-swat-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, NB = null, buzzBus = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      buzzBus = AC.createGain(); buzzBus.gain.value = muted ? 0 : 1;
      buzzBus.connect(lp).connect(AC.destination);
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, freq, q = 1, vol = .2, to = 0, delay = 0) {
    if (!AC || muted || !NB) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const gn = AC.createGain(); gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .008); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, Math.random() * 1.5); s.stop(t + dur + .02);
  }

  function makeVoice(m) {
    if (!AC || !buzzBus || mozz.filter(x => x.voice).length >= 5) return;
    try {
      const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = m.pitch;
      const lfo = AC.createOscillator(); lfo.frequency.value = rand(5, 9);
      const lg = AC.createGain(); lg.gain.value = m.pitch * .03; lfo.connect(lg).connect(o.frequency);
      const gn = AC.createGain(); gn.gain.value = 0;
      const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
      if (pan) o.connect(gn).connect(pan).connect(buzzBus); else o.connect(gn).connect(buzzBus);
      o.start(); lfo.start();
      m.voice = { o, lfo, gn, pan };
    } catch (e) {}
  }
  function killVoice(m) {
    if (!m.voice) return;
    const v = m.voice; m.voice = null;
    try { v.gn.gain.setTargetAtTime(0, AC.currentTime, .02); v.o.stop(AC.currentTime + .15); v.lfo.stop(AC.currentTime + .15); } catch (e) {}
  }
  function updateVoice(m) {
    if (!m.voice) return;
    const t = AC.currentTime, sp = clamp(m.speed / 300, .3, 1.3);
    m.voice.gn.gain.setTargetAtTime(.022 * sp * (m.dive ? 2 : 1), t, .05);
    m.voice.o.frequency.setTargetAtTime(m.pitch * (.9 + sp * .15) * (m.dive ? 1.15 : 1), t, .05);
    if (m.voice.pan) m.voice.pan.pan.setTargetAtTime(clamp(m.x / W * 2 - 1, -1, 1) * .9, t, .05);
  }
  const sfx = {
    swat: () => { noise(.09, 900, .7, .5, 300); tone(110, .12, 'triangle', .25, -50); },
    whiff: () => noise(.18, 1500, .8, .12, 500),
    splat: () => { noise(.12, 500, 2, .25, 200, .02); tone(320, .1, 'sine', .1, -200, .02); },
    combo: n => { [659, 784, 988, 1319].slice(0, Math.min(4, n)).forEach((f, i) => tone(f, .14, 'triangle', .08, 0, i * .05)); },
    meow: () => { tone(900, .45, 'sine', .14, -380); tone(1200, .18, 'triangle', .06, -300); noise(.06, 1200, 1, .15); },
    bonk: () => { tone(500, .2, 'square', .06, -300); },
    bite: () => { tone(1200, .06, 'square', .05); tone(260, .3, 'sawtooth', .08, -120, .03); },
    pop: () => tone(700, .1, 'sine', .1, 300),
    tick: () => tone(1500, .05, 'square', .05),
    horde: () => { [330, 349, 370].forEach((f, i) => tone(f, .6, 'sawtooth', .04, 20, i * .1)); },
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => { tone(220, .4, 'sawtooth', .07, -80); }
  };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    if (buzzBus) buzzBus.gain.value = muted ? 0 : 1;
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();
  const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };

  // ---------- layout ----------
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    HR = clamp(Math.min(W, H) * .085, 30, 46);
  }
  function rrect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }


  function drawKewei(x, y, r, o = {}) {
    const mood = o.mood || 'normal', lx = o.lx || 0, ly = o.ly || 0, blink = o.blink || 0;
    g.save(); g.translate(x, y); if (o.tilt) g.rotate(o.tilt);
    const earA = mood === 'angry' ? 1.0 : mood === 'sad' ? .8 : .5;
    for (const s of [-1, 1]) {
      g.save(); g.translate(s * r * .55, -r * .6); g.rotate(s * earA);

    g.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28, rr = s.r * (i % 2 ? .45 : 1) * s.blob[i]; i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill();
    g.strokeStyle = 'rgba(40,30,45,.7)'; g.lineWidth = 1;
    for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(i * 1.7) * s.r * 1.6, Math.sin(i * 1.7) * s.r * 1.6); g.stroke(); }
    if (s.fed) { g.fillStyle = 'rgba(200,60,80,.55)'; g.beginPath(); g.arc(s.r * .3, -s.r * .2, s.r * .35, 0, 7); g.fill(); }
    g.restore();
  }

  // ---------- mosquitoes ----------
  function newSeg(m, from) {
    const R = m.rng, mg = 40;
    const sp = m.speed;
    let tx = lerp(mg, W - mg, R()), ty = lerp(H * .12, H * .8, R());
    if (cat && cat.k > .5 && R() < .5) { tx = cat.x + (R() - .5) * HR * 3; ty = H * .86 - HR * 2.2 + (R() - .5) * HR * 2; }
    const p0 = from, p3 = { x: tx, y: ty };
    const d = Math.hypot(p3.x - p0.x, p3.y - p0.y);
    const c1 = { x: p0.x + (R() - .5) * d * 1.4, y: p0.y + (R() - .5) * d * 1.4 }, c2 = { x: p3.x + (R() - .5) * d * 1.4, y: p3.y + (R() - .5) * d * 1.4 };
    m.seg = { p0, c1, c2, p3, t: 0, dur: Math.max(.35, d / sp) };
    m.hover = R() < lerp(.45, .15, clock / DUR) ? lerp(.35, .7, R()) : 0;
  }
  function bez(s, t) {
    const u = 1 - t;
    return { x: u * u * u * s.p0.x + 3 * u * u * t * s.c1.x + 3 * u * t * t * s.c2.x + t * t * t * s.p3.x, y: u * u * u * s.p0.y + 3 * u * u * t * s.c1.y + 3 * u * t * t * s.c2.y + t * t * t * s.p3.y };
  }
  function spawnMozz() {
    const seed = seeds[seedI++ % seeds.length];
    const R = mul32(seed);
    const side = Math.floor(R() * 3);
    const start = side === 0 ? { x: -20, y: lerp(H * .15, H * .7, R()) } : side === 1 ? { x: W + 20, y: lerp(H * .15, H * .7, R()) } : { x: lerp(40, W - 40, R()), y: -20 };
    const m = { rng: R, x: start.x, y: start.y, ang: 0, ph: R() * 6, size: clamp(W * .03, 11, 15), speed: lerp(150, 340, clock / DUR) * lerp(.85, 1.15, R()), pitch: lerp(520, 700, R()), age: 0, life: lerp(7.5, 5, clock / DUR) + R(), dive: 0, fed: false };
    newSeg(m, start);
    mozz.push(m);
    makeVoice(m);
  }

  // ---------- game flow ----------
  const KILL_LINES = ['啪！', '準！', '安息吧', '蚊子：我錯了', '一掌入魂'];
  const COMBO_LINES = ['連殺！', '手速爆表', '停不下來', '蚊子界的噩夢'];
  const MISS_LINES = ['揮空', '只拍到牆', '空氣好痛', '蚊子在笑你'];
  const NEAR_LINES = ['差一點！', '擦到翅膀了', '好險（蚊子說）'];
  const BITE_LINES = ['叮！好癢', '又被叮了', '癢到睡不著', '這包好大'];
  const CAT_HIT = ['喵嗚！你打我？', '我也在抓蚊子欸', '痛痛痛！', '家暴喔！'];
  const CAT_SAY = ['我來幫忙！', '喵！在那邊！', '看我的', '抓到了⋯⋯嗎？'];

  function startRound() {
    window.DGH_DAILY && DGH_DAILY.reseed();
    seeds = []; for (let i = 0; i < 300; i++) seeds.push(Math.floor(Math.random() * 4294967296));
    cats = [];
    for (let t = rand(5, 7); t < DUR - 2; t += rand(lerp(6, 3.5, t / DUR), lerp(8, 5, t / DUR))) cats.push({ t, u: rand(.22, .78), dur: lerp(2.6, 1.8, t / DUR) });
    seedI = 0; spawnCD = .4;
    mozz.forEach(killVoice); mozz = []; splats = []; hands = []; parts = []; pops = []; confetti = [];
    score = kills = bites = catHits = combo = bestCombo = swings = doubles = 0; lastKill = -9;
    clock = 0; lastSec = 99; cat = null;
    $('title').hidden = true; $('sheet').hidden = true; $('hud').hidden = false; $('hint').hidden = false;
    $('pTime').classList.remove('warn');
    state = 'play';
    hud();
  }
  function hud(popId) {
    $('hTime').textContent = Math.max(0, Math.ceil(DUR - clock));
    $('hScore').textContent = score;
    $('hBite').textContent = bites;
    $('pBite').classList.toggle('hot', bites > 0);
    if (popId && !reduced) { const el = $(popId); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  function pop(x, y, text, c = '#fffaf2', size = 22) { pops.push({ x: clamp(x, 80, W - 80), y, text, c, size, t: 0 }); }

  function swat(x, y) {
    swings++;
    hands.push({ x, y, t: 0, rot: rand(-.4, .4) });
    sfx.swat(); shake = Math.max(shake, .18);
    // KEWEI first: she is in the way
    if (cat && cat.k > .35 && !cat.hit) {
      const r = HR * 1.35, cy = H * .86 + r * 1.4 - cat.k * r * 2.4;
      const inHead = Math.hypot(x - cat.x, y - cy) < r * 1.15;
      const inPaw = Math.abs(x - (cat.x + r * .95)) < r * .45 && y > cy - r * 1.5 && y < cy;
      if (inHead || inPaw) {
        cat.hit = true; cat.line = pick(CAT_HIT); cat.hold = .9;
        catHits++; score -= 3; combo = 0;
        sfx.meow(); sfx.bonk(); buzz([50, 40, 50]); shake = .6; redFlash = .6;
        pop(x, y - 40, '−3 拍到 KEWEI！', '#ff8fa6', 24);
        hud('pScore');
        return;
      }
    }
    const R = HR * 1.05;
    const hit = mozz.filter(m => !m.dead && Math.hypot(m.x - x, m.y - y) < R + m.dive * 30);
    if (!hit.length) {
      const near = mozz.some(m => !m.dead && Math.hypot(m.x - x, m.y - y) < R * 1.9);
      pop(x, y - 34, near ? pick(NEAR_LINES) : pick(MISS_LINES), near ? '#ffd25e' : 'rgba(255,250,242,.8)', near ? 22 : 18);
      if (near) { for (const m of mozz) if (Math.hypot(m.x - x, m.y - y) < R * 1.9) { m.speed *= 1.15; newSeg(m, { x: m.x, y: m.y }); m.hover = 0; } }
      sfx.whiff();
      if (clock - lastKill > 1.3) combo = 0;
      return;
    }
    let gained = 0;
    for (const m of hit) {
      m.dead = true; killVoice(m); kills++;
      splats.push({ x: m.x, y: m.y, r: m.size * .55, rot: rand(0, 6), life: 7, fed: m.fed, blob: Array.from({ length: 10 }, () => rand(.7, 1.2)) });
      for (let i = 0; i < (reduced ? 3 : 10); i++) parts.push({ x: m.x, y: m.y, vx: rand(-180, 180), vy: rand(-180, 120), r: rand(1, 2.4), c: pick(['rgba(40,30,45,.8)', 'rgba(230,235,255,.8)']), life: rand(.3, .6) });
      combo = clock - lastKill < 1.3 ? combo + 1 : 1;
      lastKill = clock;
      bestCombo = Math.max(bestCombo, combo);
      gained += 1 + Math.min(3, combo - 1);
    }
    score += gained;
    sfx.splat(); buzz(18);
    if (hit.length >= 2) { doubles++; pop(x, y - 60, '一掌雙殺！', '#ffd25e', 30); if (!reduced) slowT = .45; sfx.combo(4); shake = .5; }
    else if (combo >= 3) { pop(x, y - 60, `${pick(COMBO_LINES)} ×${combo}`, '#ffd25e', 26); sfx.combo(combo); }
    else pop(x, y - 40, pick(KILL_LINES), '#fffaf2', 22);
    pop(x, y - 14, '+' + gained, '#b7e0c2', 18);
    hud('pScore');
  }

  function rankOf(s) { for (const r of RANKS) if (s >= r[0]) return r; return RANKS[RANKS.length - 1]; }
  function finish() {
    state = 'result';
    mozz.forEach(killVoice);
    const [, rk, role] = rankOf(score);
    const prev = getBest(); const isNew = prev == null || score > prev;
    if (isNew) setBest(score);
    window.DGH_DAILY && DGH_DAILY.save(score);
    $('rank').textContent = rk; $('role').textContent = role; $('score').textContent = score;
    const quip = rk === 'S' ? pick(['今晚整棟樓的蚊子都怕你', '蚊子們開會決定搬家', '可以安心睡了，晚安'])
      : rk === 'A' ? pick(['手很快，耳朵再靈一點', '只剩一兩隻漏網之魚', 'KEWEI 覺得你是隊友'])
      : rk === 'B' ? pick(['明天起床會有幾包', '拍得到，但不多', '去拿防蚊液比較快'])
      : pick(['蚊子吃到飽之夜', '你在幫蚊子鼓掌嗎', '明天全身都是紅豆']);
    let next = '';
    const i = RANKS.findIndex(r => r[1] === rk);
    if (i > 0) next = `<br><span class="next">再 ${RANKS[i - 1][0] - score} 分就升 ${RANKS[i - 1][1]} 級「${RANKS[i - 1][2]}」</span>`;
    const acc = swings ? Math.round(kills / swings * 100) : 0;
    const bestLine = isNew ? `<br><span class="newbest">刷新個人最高紀錄</span>` : `<br>個人最高：${prev} 分`;
    $('detail').innerHTML = `<span class="quip">「${quip}」</span>拍死 <b>${kills}</b> 隻（命中率 ${acc}%），最高連殺 ${bestCombo}${doubles ? `，雙殺 ${doubles} 次` : ''}。被叮 ${bites} 包，誤拍 KEWEI ${catHits} 次。` + next + bestLine;
    lastRes = { score, rk, role, kills, bites };
    $('hud').hidden = true; $('hint').hidden = true;
    $('sheet').hidden = false;
    if (rk === 'S') sfx.win(); else if (rk === 'C') sfx.bad(); else sfx.ok();
    buzz(rk === 'S' ? [20, 40, 20] : 15);
    if (rk === 'S' && !reduced) burst();
  }
  function burst() {
    const cols = ['#c2402a', '#6f8f78', '#e7b75f', '#fffaf2', '#f2a7a0'];
    for (let i = 0; i < 90; i++) confetti.push({ x: W / 2 + rand(-40, 40), y: H * .35, vx: rand(-260, 260), vy: rand(-520, -180), r: rand(3, 6), c: cols[i % cols.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.6) });
  }

  // ---------- input ----------
  function down(e) {
    if (e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state !== 'play') return;
    e.preventDefault();
    $('hint').hidden = true;
    swat(e.clientX, e.clientY);
  }
  addEventListener('pointerdown', down, { passive: false });
  addEventListener('contextmenu', e => e.preventDefault());

  $('go').addEventListener('click', () => { initAudio(); startRound(); });
  $('again').addEventListener('click', () => { initAudio(); startRound(); });
  $('share').addEventListener('click', async () => {
    if (!lastRes) return;
    let msg = `我在《拍蚊子》45 秒拍死 ${lastRes.kills} 隻、被叮 ${lastRes.bites} 包，拿到 ${lastRes.score} 分（${lastRes.rk} 級・${lastRes.role}）。換你守護睡眠：`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: '拍蚊子', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- loop ----------
  let last = 0;
  function step(rdt) {
    if (slowT > 0) { slowT -= rdt; slow += (.25 - slow) * Math.min(1, rdt * 16); } else slow += (1 - slow) * Math.min(1, rdt * 5);
    const dt = rdt * slow;
    T += dt;
    if (state === 'play') {
      clock += dt;
      const sec = Math.ceil(DUR - clock);
      if (sec !== lastSec) { lastSec = sec; if (sec <= 5 && sec > 0) { sfx.tick(); $('pTime').classList.add('warn'); } if (sec === 10) { sfx.horde(); pop(W / 2, H * .45, '蚊子大軍來了！', '#ffd25e', 28); shake = .3; } hud(); }
      const alive = mozz.filter(m => !m.dead).length;
      const want = 2 + Math.floor(clock / 12) + (DUR - clock < 10 ? 2 : 0);
      spawnCD -= dt;
      if (alive < want && spawnCD <= 0) { spawnMozz(); spawnCD = lerp(.9, .35, clock / DUR); }
      // KEWEI pops up
      if (!cat && cats.length && clock >= cats[0].t) { const c = cats.shift(); cat = { x: c.u * W, k: 0, t: 0, dur: c.dur, hit: false, hold: 0, look: rand(-1, 1), line: pick(CAT_SAY) }; sfx.pop(); }
      if (clock >= DUR) { state = 'done'; mozz.forEach(killVoice); setTimeout(finish, 600); }
    }
    if (cat) {
      cat.t += dt;
      if (cat.hit) { cat.hold -= dt; if (cat.hold <= 0) cat.k -= dt * 5; }
      else if (cat.t < .25) cat.k = Math.min(1, cat.t / .25);
      else if (cat.t > cat.dur) cat.k -= dt * 4;
      if (cat.k <= 0 && cat.t > .3) cat = null;
    }
    for (const m of mozz) {
      if (m.dead) continue;
      m.age += dt;
      if (state === 'play' && !m.dive && m.age > m.life) { m.dive = .001; m.diveT = 0; }
      if (m.dive) {
        m.diveT += dt; m.dive = Math.min(1, m.diveT / .6);
        m.x += Math.sin(T * 30 + m.ph) * 2; m.y += Math.cos(T * 26 + m.ph) * 2;
        if (m.dive >= 1) {
          m.dead = true; killVoice(m); bites++; score -= 1; combo = 0;
          sfx.bite(); buzz([30, 30, 30]); redFlash = .5; shake = .25;
          pop(m.x, m.y - 30, pick(BITE_LINES) + ' −1', '#ff8fa6', 22);
          hud('pBite');
        }
      } else if (m.hoverT > 0) {
        m.hoverT -= dt;
        m.x += Math.sin(T * 20 + m.ph) * .6; m.y += Math.cos(T * 17 + m.ph) * .6;
        if (m.hoverT <= 0) newSeg(m, { x: m.x, y: m.y });
      } else {
        const s = m.seg; s.t += dt / s.dur;
        const p = bez(s, Math.min(1, s.t));
        const jx = Math.sin(T * 13 + m.ph) * 3, jy = Math.cos(T * 11 + m.ph * 2) * 3;
        const nx = p.x + jx, ny = p.y + jy;
        const vx = nx - m.x, vy = ny - m.y;
        if (Math.abs(vx) + Math.abs(vy) > .2) m.ang = Math.atan2(vy, vx);
        m.x = nx; m.y = ny;
        if (s.t >= 1) { if (m.hover) { m.hoverT = m.hover; m.hover = 0; } else newSeg(m, { x: m.x, y: m.y }); }
      }
      if (AC) updateVoice(m);
    }
    mozz = mozz.filter(m => !m.dead);
    for (const s of splats) s.life -= rdt;
    splats = splats.filter(s => s.life > 0);
    for (const h of hands) h.t += rdt;
    hands = hands.filter(h => h.t < .4);
    for (const p of parts) { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops) p.t += rdt;
    pops = pops.filter(p => p.t < 1);
    for (const c of confetti) { c.vy += 700 * rdt; c.x += c.vx * rdt; c.y += c.vy * rdt; c.vx *= .99; c.rot += c.vr * rdt; c.life -= rdt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - rdt); redFlash = Math.max(0, redFlash - rdt * 1.5);
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
    drawRoom();
    for (const s of splats) drawSplat(s);
    drawCat();
    drawBed();
    for (const m of mozz) if (!m.dive) drawMozz(m);
    for (const m of mozz) if (m.dive) drawMozz(m);
    for (const p of parts) { g.globalAlpha = clamp(p.life * 3, 0, 1); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    for (const h of hands) drawHand(h);
    for (const p of pops) {
      const k = p.t, sc = p.t < .12 ? .6 + p.t / .12 * .6 : 1.2 - Math.min(.2, (p.t - .12));
      g.save(); g.globalAlpha = 1 - Math.pow(k, 3); g.translate(p.x, p.y - k * 40); g.scale(sc, sc);
      g.font = `900 ${p.size}px "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 5; g.strokeStyle = 'rgba(40,30,60,.85)'; g.strokeText(p.text, 0, 0); g.fillStyle = p.c; g.fillText(p.text, 0, 0);
      g.restore();
    }
    if (state === 'play' && DUR - clock <= 5) {
      const s = Math.ceil(DUR - clock), f = (DUR - clock) % 1;
      g.save(); g.globalAlpha = .14 + f * .18; g.fillStyle = '#fffaf2';
      g.font = `900 ${Math.round(Math.min(W, H) * .4 * (1 + (1 - f) * .2))}px "DM Serif Display", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(s), W / 2, H * .48); g.restore();
    }
    if (redFlash > 0) {
      const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .7);
      v.addColorStop(0, 'rgba(255,90,110,0)'); v.addColorStop(1, `rgba(255,90,110,${redFlash * .5})`);
      g.fillStyle = v; g.fillRect(-20, -20, W + 40, H + 40);
    }
    if (slow < .9) {
      const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
      v.addColorStop(0, 'rgba(20,15,40,0)'); v.addColorStop(1, `rgba(20,15,40,${(1 - slow) * .5})`);
      g.fillStyle = v; g.fillRect(-20, -20, W + 40, H + 40);
    }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  // a lone mosquito drifting over the title screen
  seeds = [12345, 67890, 13579]; clock = 10; spawnMozz(); clock = 0;
  const b0 = getBest();
  $('bestTitle').textContent = b0 == null ? '今晚還沒拍過' : `個人最高紀錄 ${b0} 分`;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
