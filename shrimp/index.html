<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const lerp = (a, b, t) => a + (b - a) * t;
  const angD = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DUR = 90;

  // safe-area probe
  const sa = document.createElement('div');
  sa.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
  document.body.appendChild(sa);

  let W, H, DPR, SAT = 0, SAB = 0, P = {}, TIP = {}, KW = {}, BK = {}, MT = {};
  let state = 'title', T = 0, left = DUR, over = false;
  let shrimp = [], junk = [], ripples = [], pops = [], drops = [], confetti = [], flyers = [];
  let bait = null, fight = null, cast = null;
  let total = 0, catches = [], snaps = 0, escapes = 0, kingSpawned = 0, kingT = 0, idleT = 0;
  let mood = 'idle', moodT = 0, bubble = null, shake = 0, lastRes = null, holding = false, warnT = 0, lastTick = 99;

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-shrimp-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-shrimp-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, NB = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, freq, vol = .2, q = 1, delay = 0) {
    if (!AC || muted || !NB) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const gn = AC.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, rand(0, .5)); s.stop(t + dur + .02);
  }
  const sfx = {
    splash: () => { noise(.35, 900, .35, .8); tone(300, .15, 'sine', .08, -180); },
    plip: () => tone(rand(900, 1100), .06, 'sine', .08, -400),
    bite: () => { tone(160, .22, 'sine', .3, -90); noise(.2, 500, .2, 2); },
    strike: () => { noise(.12, 2400, .25, .6); tone(520, .1, 'triangle', .12, 300); },
    click: () => tone(rand(1700, 1900), .025, 'square', .03),
    creak: () => tone(rand(1300, 1600), .09, 'sawtooth', .05, 300),
    snap: () => { tone(2200, .05, 'square', .2, -1800); noise(.25, 3000, .3, .5); tone(120, .3, 'sine', .25, -60, .03); },
    catch: () => { [660, 880, 1100].forEach((f, i) => tone(f, .2, 'triangle', .12, 0, i * .07)); noise(.3, 1200, .15, .8); },
    king: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .35, 'triangle', .13, 0, i * .08)); },
    flop: () => { tone(200, .12, 'sine', .2, -100); },
    tick: () => tone(1500, .05, 'square', .06),
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => tone(220, .4, 'sawtooth', .07, -80)
  };
  const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();

  // ---------- layout ----------
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle(sa); SAT = parseFloat(cs.paddingTop) || 0; SAB = parseFloat(cs.paddingBottom) || 0;
    const deck = 150 + SAB;
    P = { x: 12, y: SAT + 62, w: W - 24, h: H - deck - SAT - 62 - 6 };
    TIP = { x: W * .5, y: P.y + P.h - 26 };
    KW = { x: W - 58, y: H - SAB - 84, s: 30 };
    BK = { x: 54, y: H - SAB - 58 };
    MT = { x: 104, y: H - SAB - 104, w: Math.max(100, W - 104 - 118), h: 16 };
    for (const s of shrimp) { s.x = clamp(s.x, P.x + 20, P.x + P.w - 20); s.y = clamp(s.y, P.y + 20, P.y + P.h - 20); }
  }

  // ---------- entities ----------
  function newShrimp(king, edge) {
    const d = clamp((DUR - left) / DUR, 0, 1);
    let gr;
    if (king) gr = Math.round(rand(170, 260));
    else { const r = Math.random(); gr = Math.round(r < .5 ? rand(14, 32) : r < .85 ? rand(32, 55 + d * 10) : rand(55, 85 + d * 15)); }
    const len = king ? 92 : 24 + gr * .58;
    let x = rand(P.x + 30, P.x + P.w - 30), y = rand(P.y + 30, P.y + P.h - 30);
    if (edge) { if (Math.random() < .5) x = Math.random() < .5 ? P.x + 14 : P.x + P.w - 14; else y = P.y + 14; }
    return { x, y, a: rand(0, 6.28), ta: rand(0, 6.28), sp: 0, t: rand(0, 1), len, gr, king,
      kind: king ? 'k' : gr >= 50 ? 'b' : 'n', ph: rand(0, 9), st: 'roam', vb: 0, scare: 0, nib: 0, nibT: 0, biteT: 0, cool: rand(0, 1.5), wig: 0 };
  }
  function seedPool() {
    shrimp = []; for (let i = 0; i < 10; i++) shrimp.push(newShrimp(false));
    junk = [];
    const kinds = ['slipper', 'can', 'teeth'];
    for (let i = 0; i < 3; i++) junk.push({ k: kinds[i], x: rand(P.x + 40, P.x + P.w - 40), y: rand(P.y + 40, P.y + P.h - 40), a: rand(0, 6.28) });
  }

  // ---------- quips ----------
  const Q = {
    small: ['小歸小，也是蝦', '這隻當配菜剛好', '一口一隻，不用剝', '蝦米也是蝦，不要嫌'],
    mid: ['不錯喔，烤起來', '胡椒鹽準備！', '這隻有在練', '手感來了'],
    big: ['這隻我要了（擦口水）', '這是蝦還是小龍蝦？', '老闆在哭了', '鉗子比我的腳還長'],
    king: ['泰國蝦王！跪下！！', '這隻要供起來拜', '今年的運氣全用在這了', '老闆：那隻不賣的…'],
    snap: ['啪。蝦：掰掰～', '線比你的耐心還細', '力氣留著剝蝦殼', '這不是拔河比賽啦', '線：我先走一步'],
    snapClose: ['就差一點點！！', '都到岸邊了啊啊啊', '我口水都流了你給我斷線'],
    escape: ['太鬆了，牠自己游走了', '蝦：謝謝招待', '你在溜蝦嗎？', '放生也是一種功德'],
    early: ['還在試吃啦，急什麼', '人家只是聞一下', '手太快，嚇跑了', '浮標還沒沉！'],
    stolen: ['餌被偷吃了', '牠吃完還對你揮鉗', '免費自助餐開張', '你在餵蝦嗎'],
    empty: ['空竿。水很好釣', '你在釣空氣嗎', '浮標根本沒動耶'],
    junk: { slipper: '藍白拖！左腳的，右腳下次', can: '一罐沒開的…老闆的吧？', teeth: '這副假牙是誰的？？' },
    tense: ['線在哭了！', '放手放手！', '要斷了要斷了'],
    idle: ['換個位置試試？', '蝦都在那邊開會', '這裡沒蝦啦'],
    last: ['最後十秒！拚了！', '十秒！手速拿出來']
  };
  function say(text, dur = 1.8) { bubble = { text, t: dur, max: dur }; }
  function setMood(m, d = 1.5) { mood = m; moodT = d; }
  function pop(x, y, text, col = '#3a2a20', size = 20) { pops.push({ x, y, text, col, size, t: 1.2 }); }
  function ripple(x, y, r = 30, sp = 60) { ripples.push({ x, y, r: 2, max: r, sp, a: .7 }); }

  // ---------- game flow ----------
  function start() {
    window.DGH_DAILY && DGH_DAILY.reseed();
    left = DUR; over = false; total = 0; catches = []; snaps = 0; escapes = 0; kingSpawned = 0; kingT = rand(22, 50); idleT = 0;
    bait = null; fight = null; cast = null; flyers = []; pops = []; ripples = []; confetti = [];
    seedPool();
    state = 'aim'; lastTick = 99;
    $('title').hidden = true; $('sheet').hidden = true; $('hud').hidden = false;
    $('hint').textContent = '點水面下竿'; $('hint').hidden = false;
    setMood('happy', 1); say('來，把蝦王釣起來！', 1.8);
    hud();
  }
  function hud() {
    $('hTime').textContent = Math.ceil(Math.max(0, left));
    $('hG').textContent = total;
    $('hT').className = left <= 10 ? 'hot' : '';
  }
  function finish() {
    state = 'result'; $('hud').hidden = true; $('hint').hidden = true;
    const score = total;
    const real = catches.filter(c => !c.junk);
    const junkN = catches.length - real.length;
    let rk, role;
    if (score >= 650) { rk = 'S'; role = '蝦王'; }
    else if (score >= 400) { rk = 'A'; role = '釣蝦老手'; }
    else if (score >= 180) { rk = 'B'; role = '一盤剛好'; }
    else { rk = 'C'; role = junkN && !real.length ? '只釣到拖鞋' : score > 0 ? '只夠塞牙縫' : '只釣到拖鞋'; }
    const prev = getBest(); const isNew = prev == null || score > prev;
    if (isNew) setBest(score);
    window.DGH_DAILY && DGH_DAILY.save(score);
    const big = real.reduce((m, c) => Math.max(m, c.gr), 0);
    const kingN = real.filter(c => c.king).length;
    $('rank').textContent = rk; $('role').textContent = role; $('score').textContent = score;
    let line = `釣起 <b>${real.length}</b> 隻蝦，最大一隻 ${big}g`;
    if (kingN) line += `，<b>含泰國蝦王</b>`;
    line += `。<br>斷線 ${snaps} 次・跑掉 ${escapes} 隻`;
    if (junkN) line += `・撈到垃圾 ${junkN} 件`;
    line += '。';
    const bestLine = isNew && score > 0 ? `<br><span class="newbest">刷新個人最高紀錄</span>` : prev != null ? `<br>個人最高：${prev}g` : '';
    $('detail').innerHTML = line + bestLine;
    lastRes = { score, rk, role, n: real.length, big };
    $('sheet').hidden = false;
    if (rk === 'S') sfx.win(); else if (rk === 'C') sfx.bad(); else sfx.ok();
    buzz(rk === 'S' ? [20, 40, 20] : 15);
    if (rk === 'S' && !reduced) burst();
    setMood(rk === 'S' ? 'drool' : rk === 'C' ? 'shock' : 'happy', 99);
    say(rk === 'S' ? '今晚吃蝦吃到飽！' : rk === 'A' ? '可以烤一大盤了' : rk === 'B' ? '一人一隻剛剛好' : '…我去買鹹酥雞好了', 99);
  }
  function burst() {
    const cols = ['#c2402a', '#6f8f78', '#e7b75f', '#3a2a20', '#f2a7a0'];
    for (let i = 0; i < 90; i++) confetti.push({ x: W / 2 + rand(-40, 40), y: H * .3, vx: rand(-260, 260), vy: rand(-520, -180), r: rand(3, 6), c: cols[i % cols.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.6) });
  }

  function doCast(x, y) {
    x = clamp(x, P.x + 16, P.x + P.w - 16); y = clamp(y, P.y + 16, P.y + P.h - 16);
    cast = { x, y, t: 0 };
    state = 'cast'; idleT = 0;
    $('hint').hidden = true;
    tone(700, .2, 'sine', .05, 700);
  }
  function landBait() {
    bait = { x: cast.x, y: cast.y, sink: 0, dip: 0, under: 0, junk: null, wob: 0 };
    for (const j of junk) if (Math.hypot(j.x - bait.x, j.y - bait.y) < 20) bait.junk = j;
    cast = null; state = 'wait';
    sfx.splash(); ripple(bait.x, bait.y, 46, 80); ripple(bait.x, bait.y, 26, 50);
    for (let i = 0; i < 8; i++) drops.push({ x: bait.x, y: bait.y, vx: rand(-80, 80), vy: rand(-80, 80), z: 0, vz: rand(60, 140), a: .9 });
    // nearby shrimp startle a bit
    for (const s of shrimp) { const d = Math.hypot(s.x - bait.x, s.y - bait.y); if (d < 38 && s.st === 'roam') flee(s, .9); }
  }
  function flee(s, k = 1) {
    s.st = 'flee'; s.scare = 2.2 * k; s.vb = 260 * k;
    const a = Math.atan2(s.y - (bait ? bait.y : s.y), s.x - (bait ? bait.x : s.x));
    s.a = a + Math.PI; // head toward bait, flip backward away (shrimp swim backward)
  }
  function approacher() { return shrimp.find(s => s.st === 'approach' || s.st === 'nibble' || s.st === 'bite'); }

  function strike() {
    if (state === 'cast') return;
    if (state !== 'wait' || !bait) return;
    sfx.strike();
    const s = approacher();
    if (bait.junk && (!s || s.st !== 'bite')) {
      startFight(null, bait.junk); return;
    }
    if (s && s.st === 'bite') { startFight(s, null); return; }
    if (s) {
      flee(s, 1.2);
      for (const o of shrimp) if (o !== s && o.st === 'roam' && Math.hypot(o.x - bait.x, o.y - bait.y) < 120) flee(o, .7);
      say(pick(Q.early)); setMood('meh', 1.4); pop(bait.x, bait.y - 20, '太早！', '#c2402a', 18);
    } else { say(pick(Q.empty)); pop(bait.x, bait.y - 20, '空竿', '#7a6555', 16); }
    ripple(bait.x, bait.y, 26, 90);
    bait = null; state = 'aim'; $('hint').textContent = '點水面下竿'; $('hint').hidden = false;
  }

  function startFight(s, j) {
    const str = j ? .06 : s.king ? 1.05 : clamp(.18 + (s.len - 30) / 50 * .55, .15, .85);
    fight = { s, j, x0: bait.x, y0: bait.y, prog: 0, ten: .35, str, surge: 0, surgeT: rand(.6, 1.4), slack: 0, warn: 0, clickT: 0, th: 0 };
    if (s) { s.st = 'hooked'; }
    if (j) { const i = junk.indexOf(j); if (i >= 0) junk.splice(i, 1); }
    bait = null; state = 'fight'; holding = false;
    shake = .2; buzz(25);
    $('hint').textContent = '按住收線，紅了就放開'; $('hint').hidden = false;
    if (s && s.king) { say('蝦王上鉤了！穩住！！', 2); setMood('shock', 2); }
    else if (s && s.len > 55) { say('大的！慢慢來…', 1.6); setMood('drool', 1.6); }
    else if (j) { say('咦？好輕…', 1.4); }
    else setMood('happy', 1);
  }

  function endFight(kind) {
    const f = fight; fight = null; holding = false;
    const px = lerp(f.x0, TIP.x, f.prog), py = lerp(f.y0, TIP.y, f.prog);
    if (kind === 'catch') {
      if (f.j) {
        catches.push({ junk: true, gr: 0 });
        flyers.push({ j: f.j, x: px, y: py, t: 0 });
        say(Q.junk[f.j.k], 2.2); setMood('meh', 2); sfx.flop();
        pop(px, py - 20, '0g', '#7a6555', 22);
      } else {
        const s = f.s; total += s.gr; catches.push({ gr: s.gr, king: s.king });
        flyers.push({ s, x: px, y: py, t: 0 });
        shrimp.splice(shrimp.indexOf(s), 1);
        setTimeout(() => { if (state !== 'result' && state !== 'title') shrimp.push(newShrimp(false, true)); }, 1400);
        if (s.king) { sfx.king(); say(pick(Q.king), 2.4); setMood('drool', 3); if (!reduced) burst(); shake = .35; buzz([30, 30, 60]); }
        else { sfx.catch(); buzz(20);
          if (s.gr >= 55) { say(pick(Q.big), 2); setMood('drool', 2.4); }
          else if (s.gr >= 32) { say(pick(Q.mid)); setMood('happy', 1.6); }
          else { say(pick(Q.small)); setMood('happy', 1.2); } }
        pop(px, py - 24, '+' + s.gr + 'g', s.king ? '#c08a12' : '#c2402a', s.king ? 34 : 24);
      }
    } else if (kind === 'snap') {
      snaps++; sfx.snap(); shake = .45; buzz([40, 30, 40]);
      say(f.prog > .72 ? pick(Q.snapClose) : pick(Q.snap), 2); setMood('shock', 1.8);
      pop(px, py - 20, '斷線！', '#c2402a', 26);
      if (f.s) { f.s.st = 'flee'; f.s.scare = 3; f.s.vb = 300; f.s.x = px; f.s.y = py; }
    } else {
      escapes++; sfx.bad();
      say(f.prog > .72 ? '就在岸邊溜了啦！！' : pick(Q.escape), 2); setMood('meh', 1.6);
      pop(px, py - 20, '跑了', '#7a6555', 22);
      if (f.s) { f.s.st = 'flee'; f.s.scare = 2.5; f.s.vb = 220; f.s.x = px; f.s.y = py; }
    }
    ripple(px, py, 40, 80);
    state = 'aim';
    if (over) { setTimeout(finish, 900); state = 'ending'; return; }
    $('hint').textContent = '點水面下竿'; $('hint').hidden = false;
  }

  // ---------- input ----------
  function down(e) {
    if (e.target.closest && e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state === 'aim') {
      if (e.clientY > P.y && e.clientY < P.y + P.h) { e.preventDefault(); doCast(e.clientX, e.clientY); }
      return;
    }
    if (state === 'wait') { e.preventDefault(); strike(); return; }
    if (state === 'fight') { e.preventDefault(); holding = true; $('hint').hidden = true; }
  }
  function up() { holding = false; }
  addEventListener('pointerdown', down, { passive: false });
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.repeat) return; e.preventDefault(); initAudio();
    if (state === 'wait') strike(); else if (state === 'fight') holding = true; else if (state === 'aim') doCast(rand(P.x + 40, P.x + P.w - 40), rand(P.y + 40, P.y + P.h - 40));
  });
  addEventListener('keyup', e => { if (e.code === 'Space') holding = false; });

  $('go').addEventListener('click', () => { initAudio(); start(); });
  $('again').addEventListener('click', () => { initAudio(); start(); });
  $('share').addEventListener('click', async () => {
    if (!lastRes) return;
    let msg = lastRes.score === 0
      ? '我在《釣蝦》90 秒只釣到藍白拖，一隻蝦都沒有。你來試試：'
      : `我在《釣蝦》90 秒釣了 ${lastRes.score}g（${lastRes.rk} 級・${lastRes.role}），最大一隻 ${lastRes.big}g！換你：`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: '釣蝦', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- update ----------
  function updShrimp(s, dt, d) {
    s.ph += dt * (3 + Math.abs(s.sp) * .12 + s.wig * 6);
    s.wig = Math.max(0, s.wig - dt);
    s.cool = Math.max(0, s.cool - dt);
    const head = () => ({ x: s.x + Math.cos(s.a) * s.len * .55, y: s.y + Math.sin(s.a) * s.len * .55 });
    if (s.st === 'hooked') return;
    if (s.st === 'flee') {
      s.x -= Math.cos(s.a) * s.vb * dt; s.y -= Math.sin(s.a) * s.vb * dt;
      s.vb *= Math.pow(.04, dt); s.wig = 1;
      s.scare -= dt; if (s.scare <= 0) { s.st = 'roam'; s.cool = 2.5; }
    } else if (s.st === 'roam') {
      s.t -= dt;
      if (s.t <= 0) { s.ta = s.a + rand(-1.8, 1.8); s.sp = Math.random() < .35 ? 0 : rand(10, 30) * (s.king ? 1.7 : 1); s.t = rand(.7, 2.4); }
      if (bait && state === 'wait' && !approacher() && s.cool <= 0 && bait.sink >= 1) {
        const dd = Math.hypot(s.x - bait.x, s.y - bait.y);
        const sense = 150 + s.len;
        if (dd < sense) {
          const chance = (.25 + (1 - dd / sense) * .9) * (s.king ? .45 : 1);
          if (Math.random() < chance * dt) {
            s.st = 'approach';
            s.nib = 1 + Math.floor(Math.random() * (2 + d * 3));
            s.nibT = rand(.5, 1);
          }
        }
      }
    } else if (s.st === 'approach' || s.st === 'nibble' || s.st === 'bite') {
      if (!bait) { s.st = 'roam'; return; }
      const h = head();
      const ta = Math.atan2(bait.y - s.y, bait.x - s.x);
      s.ta = ta;
      const dh = Math.hypot(bait.x - h.x, bait.y - h.y);
      if (s.st === 'approach') {
        s.sp = dh > 8 ? clamp(dh * 1.2, 12, 34) : 0;
        if (dh < 8) { s.st = 'nibble'; }
      } else if (s.st === 'nibble') {
        s.sp = 0;
        s.nibT -= dt;
        if (s.nibT <= 0) {
          if (s.nib > 0) {
            s.nib--;
            const fake = Math.random() < .15 + d * .4;
            bait.dip = fake ? .7 : .38; bait.wob = 1; s.wig = .4;
            s.x += Math.cos(s.a) * 3; s.y += Math.sin(s.a) * 3;
            sfx.plip(); ripple(bait.x, bait.y, fake ? 22 : 14, 40);
            s.nibT = rand(.45, 1.1) - d * .15;
          } else {
            s.st = 'bite';
            s.biteT = clamp(.62 - d * .22 - (s.len - 30) / 260, .28, .65) * (s.king ? .8 : 1);
            sfx.bite(); ripple(bait.x, bait.y, 36, 120); buzz(12);
          }
        }
      } else {
        // pulling float under & dragging backward
        s.sp = -26; bait.under = 1; s.wig = 1;
        bait.x -= Math.cos(s.a) * 26 * dt; bait.y -= Math.sin(s.a) * 26 * dt;
        s.biteT -= dt;
        if (s.biteT <= 0) {
          // stole the bait
          s.st = 'flee'; s.scare = 1.2; s.vb = 120; s.cool = 4;
          say(pick(Q.stolen)); setMood('meh', 1.2); pop(bait.x, bait.y - 20, '被偷吃', '#7a6555', 18);
          ripple(bait.x, bait.y, 30, 60);
          bait = null; state = 'aim'; $('hint').textContent = '點水面下竿'; $('hint').hidden = false;
          return;
        }
      }
    }
    // steer & move
    if (s.st !== 'flee') {
      s.a += angD(s.ta, s.a) * Math.min(1, dt * (s.st === 'roam' ? 2.2 : 5));
      s.x += Math.cos(s.a) * s.sp * dt; s.y += Math.sin(s.a) * s.sp * dt;
    }
    // walls
    const m = 18;
    if (s.x < P.x + m || s.x > P.x + P.w - m || s.y < P.y + m || s.y > P.y + P.h - m) {
      s.x = clamp(s.x, P.x + m, P.x + P.w - m); s.y = clamp(s.y, P.y + m, P.y + P.h - m);
      if (s.st === 'roam') { s.ta = Math.atan2(P.y + P.h / 2 - s.y, P.x + P.w / 2 - s.x); s.t = 1; }
      if (s.st === 'flee') s.vb *= .3;
    }
  }

  function updFight(dt, d) {
    const f = fight;
    const hard = 1 + d * .5;
    f.surgeT -= dt;
    if (f.surge > 0) { f.surge -= dt; if (f.surge <= 0) { f.surge = 0; f.surgeT = rand(1.1, 2.6) / (1 + f.str) / hard; } }
    else if (f.surgeT <= 0 && !f.j) { f.surge = rand(.35, .75) * (.7 + f.str * .6); sfx.flop(); ripple(lerp(f.x0, TIP.x, f.prog), lerp(f.y0, TIP.y, f.prog), 30, 120); }
    const sg = f.surge > 0 ? 1 : 0;
    if (holding) {
      f.prog += dt * (.34 - f.str * .14) * (sg ? .25 : 1);
      f.ten += dt * (.42 + f.str * .75 + sg * (1.3 + f.str * 1.4));
      f.clickT -= dt; if (f.clickT <= 0) { sfx.click(); f.clickT = .055; }
    } else {
      f.prog -= dt * (.04 + f.str * .09) * (sg ? 2.2 : 1);
      f.ten -= dt * (1.05 - sg * .7);
    }
    if (!holding && sg) f.ten += dt * f.str * .5;
    f.prog = clamp(f.prog, 0, 1); f.ten = Math.max(0, f.ten);
    f.th += dt * (sg ? 26 : 9);
    if (f.ten > .86) { f.warn -= dt; if (f.warn <= 0) { sfx.creak(); f.warn = .12; buzz(6); } if (warnT <= 0 && Math.random() < dt * 1.2) { say(pick(Q.tense), 1); warnT = 3; } }
    if (f.ten < .12 && !f.j) f.slack += dt; else f.slack = Math.max(0, f.slack - dt * 2);
    if (f.ten >= 1) return endFight('snap');
    if (f.slack > 1.15) return endFight('escape');
    if (f.prog >= 1) return endFight('catch');
  }

  function step(dt) {
    T += dt;
    const d = clamp((DUR - left) / DUR, 0, 1);
    if (state !== 'title' && state !== 'result' && state !== 'ending') {
      if (!over) {
        left -= dt;
        if (left <= 10.5 && lastTick > 10.5) { say(pick(Q.last), 1.6); setMood('shock', 1); }
        if (left <= 10 && Math.ceil(left) !== Math.ceil(left + dt)) sfx.tick();
        lastTick = left;
        if (left <= 0) {
          left = 0; over = true;
          if (state === 'fight') { say('延長賽！把牠拉上來！', 1.8); }
          else { state = 'ending'; bait = null; cast = null; $('hint').hidden = true; say('收竿！', 1.2); setTimeout(finish, 1000); }
        }
      }
      // king spawn
      kingT -= dt;
      if (kingT <= 0 && kingSpawned < 2 && !over) {
        kingSpawned++; kingT = rand(30, 45);
        shrimp.push(newShrimp(true, true));
        say('金色的那隻！泰國蝦王！', 2.2); setMood('drool', 2);
        sfx.king();
      }
      if (state === 'wait' && bait && !approacher()) { idleT += dt; if (idleT > 7) { idleT = 0; say(pick(Q.idle)); } } else idleT = 0;
      hud();
    }
    if (state === 'cast' && cast) { cast.t += dt / .32; if (cast.t >= 1) landBait(); }
    if (bait) {
      bait.sink = Math.min(1, bait.sink + dt / .5);
      bait.dip *= Math.pow(.002, dt);
      bait.wob *= Math.pow(.05, dt);
      const s = approacher();
      if (!(s && s.st === 'bite')) bait.under = Math.max(0, bait.under - dt * 4);
      if (bait.junk) bait.dip = Math.max(bait.dip, .22 + Math.sin(T * 1.3) * .08);
    }
    for (const s of shrimp) updShrimp(s, dt, d);
    if (fight) {
      if (fight.s) fight.s.ph += dt * 10;
      updFight(dt, d);
    }
    warnT = Math.max(0, warnT - dt);
    moodT -= dt; if (moodT <= 0 && state !== 'result') mood = 'idle';
    if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
    for (const r of ripples) { r.r += r.sp * dt; r.a = .7 * (1 - r.r / r.max); }
    ripples = ripples.filter(r => r.r < r.max);
    for (const p of pops) { p.t -= dt; p.y -= 30 * dt; }
    pops = pops.filter(p => p.t > 0);

      g.restore();
    }
    g.fillStyle = '#fff'; g.font = '700 12px "Noto Sans TC", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(real.length + ' 隻', 0, 10);
    g.restore();
  }

  function drawMeter() {
    if (!fight) return;
    const f = fight, x = MT.x, y = MT.y, w = MT.w, h = MT.h;
    g.font = '700 11px "Noto Sans TC", sans-serif'; g.textAlign = 'left'; g.textBaseline = 'bottom';
    g.fillStyle = '#3a2a20'; g.fillText('張力', x, y - 4);
    g.textAlign = 'right'; g.fillStyle = f.ten > .86 ? '#c2402a' : f.ten < .18 ? '#7a6555' : '#4c7a58';
    g.fillText(f.ten > .86 ? '快斷了！' : f.ten < .18 ? (f.slack > .4 ? '太鬆了，要跑了！' : '太鬆') : '剛好', x + w, y - 4);
    g.fillStyle = 'rgba(58,42,32,.25)'; rrect(x - 2, y - 2, w + 4, h + 4, 10); g.fill();
    g.fillStyle = '#fffaf2'; rrect(x, y, w, h, 8); g.fill();
    g.fillStyle = 'rgba(111,143,120,.28)'; g.fillRect(x + w * .18, y, w * .68, h);
    g.fillStyle = 'rgba(194,64,42,.25)'; g.fillRect(x + w * .86, y, w * .14, h);
    const tv = clamp(f.ten, 0, 1);
    g.fillStyle = tv > .86 ? '#c2402a' : tv < .18 ? '#a5927f' : '#6f8f78';
    const jitter = tv > .86 && !reduced ? rand(-1.5, 1.5) : 0;
    rrect(x, y + jitter, Math.max(h, w * tv), h, 8); g.fill();
    // progress
    const py = y + h + 14;
    g.fillStyle = 'rgba(58,42,32,.2)'; rrect(x, py, w, 6, 3); g.fill();
    g.fillStyle = '#3a2a20'; rrect(x, py, Math.max(6, w * f.prog), 6, 3); g.fill();
    g.font = '500 10px "Noto Sans TC", sans-serif'; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillStyle = '#5c4636';
    g.fillText(f.surge > 0 ? '牠在掙扎！放一下！' : holding ? '收線中…' : '按住收線', x, py + 10);
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
    drawPool();
    for (const s of shrimp) if (s.st !== 'hooked') drawShrimp(s.x, s.y, s.a, s.len, s.kind, s.ph, s.wig);
    // fight shrimp
    let lx = null, ly = null, bend = 0;
    if (fight) {
      const f = fight, sg = f.surge > 0;
      const px = lerp(f.x0, TIP.x, f.prog), py = lerp(f.y0, TIP.y, f.prog);
      const away = Math.atan2(py - TIP.y, px - TIP.x);
      const th = Math.sin(f.th) * (sg ? 10 : 3);
      const nx = -Math.sin(away), ny = Math.cos(away);
      const sx = px + nx * th, sy = py + ny * th;
      if (f.s) drawShrimp(sx + Math.cos(away) * f.s.len * .5, sy + Math.sin(away) * f.s.len * .5, away + Math.PI + Math.sin(f.th) * .3, f.s.len, f.s.kind, f.s.ph, 1);
      else drawJunk(f.j.k, sx, sy, f.th * .2, .9);
      if (Math.random() < .3) ripple(sx, sy, sg ? 26 : 14, 70);
      lx = sx; ly = sy; bend = clamp(f.ten, 0, 1);
    }
    for (const r of ripples) { g.strokeStyle = `rgba(255,255,255,${r.a})`; g.lineWidth = 1.5; g.beginPath(); g.arc(r.x, r.y, r.r, 0, 7); g.stroke(); }
    if (bait) { lx = bait.x; ly = bait.y; }
    drawCaustics();
    for (const q of drops) { g.fillStyle = `rgba(230,250,250,${q.a})`; g.beginPath(); g.arc(q.x, q.y - q.z * .3, 1.8, 0, 7); g.fill(); }
    if (cast) {
      const e = cast.t; const x = lerp(TIP.x, cast.x, e), y = lerp(TIP.y, cast.y, e) - Math.sin(e * Math.PI) * 60;
      lx = x; ly = y;
    }
    drawDeckUI();
    if (state !== 'title') drawRod(lx, ly, bend);
    if (bait) drawFloat(bait.x, bait.y, bait.dip, bait.under, bait.wob);
    if (cast) drawFloat(lx, ly, 0, 0, 0);
    // flyers to bucket
    for (const f of flyers) {
      const e = f.t, x = lerp(f.x, BK.x, e), y = lerp(f.y, BK.y - 14, e) - Math.sin(e * Math.PI) * 120;
      g.save(); g.translate(x, y); g.scale(1 - e * .5, 1 - e * .5);
      if (f.s) drawShrimp(0, 0, e * 12, f.s.len, f.s.kind, T * 20, 1); else drawJunk(f.j.k, 0, 0, e * 10, 1);
      g.restore();
    }
    drawKewei(KW.x, KW.y, KW.s, mood, T);
    drawMeter();
    for (const p of pops) {
      g.save(); g.globalAlpha = clamp(p.t * 1.5, 0, 1);
      g.font = `400 ${p.size}px "DM Serif Display", "Noto Serif TC", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = '#fffaf2'; g.strokeText(p.text, p.x, p.y); g.fillStyle = p.col; g.fillText(p.text, p.x, p.y);
      g.restore();
    }
    if (bubble) drawBubble(KW.x - 10, KW.y - KW.s * 1.1, bubble.text, clamp(bubble.t * 4, 0, 1));
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }

  let last = 0;
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  seedPool();
  const b = getBest();
  $('bestTitle').textContent = b == null ? '今天還沒開張' : `個人最高紀錄 ${b}g`;
  requestAnimationFrame(frame);
})();
</script>
