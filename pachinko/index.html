<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const lerp = (a, b, t) => a + (b - a) * t;
  const angD = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // safe-area probe
  const sa = document.createElement('div');
  sa.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
  document.body.appendChild(sa);

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-pachinko-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-pachinko-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, NB = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, freq, vol = .2, q = 1, delay = 0) {
    if (!AC || muted || !NB) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const gn = AC.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, rand(0, .5)); s.stop(t + dur + .02);
  }
  let clackT = 0;
  const sfx = {
    clack: v => { if (clackT > 0) return; clackT = .025; tone(rand(2600, 3600), .03, 'square', clamp(v / 900, .02, .07)); },
    wall: () => tone(rand(500, 700), .04, 'triangle', .06),
    launch: p => { noise(.18, 700, .25, 1); tone(180 + p * 200, .15, 'triangle', .15, 300); },
    spring: () => tone(rand(300, 340), .03, 'square', .02),
    cup: () => { [1047, 1319, 1568].forEach((f, i) => tone(f, .25, 'sine', .12, 0, i * .06)); },
    jackpot: () => { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .22, 'square', .07, 0, i * .07)); },
    tulip: () => { tone(400, .08, 'square', .08); tone(800, .12, 'square', .06, 0, .06); },
    out: () => { tone(110, .4, 'sine', .3, -50); noise(.2, 300, .15, 1); },
    back: () => tone(300, .3, 'sine', .12, -150),
    mill: () => tone(rand(900, 1100), .05, 'sawtooth', .04),
    fever: () => { for (let i = 0; i < 10; i++) tone(600 + i * 120, .1, 'square', .05, 0, i * .05); },
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => tone(220, .4, 'sawtooth', .07, -80)
  };
  const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();


  const BW = 360, BH = 600, BR = 6.5, PR = 2.6, GR = 700, ARC = { x: 180, y: 180, r: 176 }, LANE = 336, NBALL = 10;
  let W, H, DPR, SAT = 0, SAB = 0, S = 1, BX = 0, BY = 0, KW = {};
  let state = 'title', T = 0, left = NBALL, score = 0, ball = null, pull = 0, pulling = null, fever = 0, letters = 0, extra = 0;
  let pins = [], cups = [], mills = [], segs = [], trail = [], pops = [], confetti = [], flash = 0, flashCol = '#ffd34d';
  let mood = 'idle', moodT = 0, bubble = null, shake = 0, lastRes = null, cupsHit = 0, jp = 0, outs = 0, stuckT = 0;

  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle(sa); SAT = parseFloat(cs.paddingTop) || 0; SAB = parseFloat(cs.paddingBottom) || 0;
    const top = SAT + 64, bot = SAB + 96;
    S = Math.min((W - 24) / BW, (H - top - bot) / BH);
    BX = (W - BW * S) / 2; BY = top;
    KW = { x: Math.max(44, BX + 30), y: BY + BH * S + 50, s: 24 };
  }

  function buildBoard() {
    cups = []; mills = []; pins = []; segs = [];
    const C = (x, y, val, type = 'cup', r = 9) => cups.push({ x, y, val, type, r, open: false, glow: 0 });
    C(180, 150, 50);
    C(70, 236, 30, 'cup', 8); C(266, 236, 30, 'cup', 8);
    C(180, 292, 100, 'jp', 7);
    C(104, 382, 20, 'tulip', 8); C(256, 382, 20, 'tulip', 8);
    C(180, 438, 10, 'extra', 9);
    C(46, 462, 10); C(312, 462, 10);
    mills.push({ x: 112, y: 312, r: 15, a: 0, w: 5 }, { x: 248, y: 312, r: 15, a: 0, w: -5 });
    // guard pins around cups
    for (const c of cups) {
      const gx = c.r + 4.5;
      pins.push({ x: c.x - gx, y: c.y - 3, guard: true }, { x: c.x + gx, y: c.y - 3, guard: true });
      if (c.type === 'jp') pins.push({ x: c.x - 9, y: c.y - 16, guard: true }, { x: c.x + 9, y: c.y - 16, guard: true });
    }
    // pin field
    const sx = 25, sy = 23;
    for (let row = 0; row * sy + 70 < 560; row++) {
      const y = 70 + row * sy, off = row % 2 ? sx / 2 : 0;
      for (let x = 20 + off; x < LANE - 12; x += sx) {
        if (y < ARC.y && Math.hypot(x - ARC.x, y - ARC.y) > ARC.r - 26) continue;
        if (cups.some(c => Math.hypot(x - c.x, y - c.y) < c.r + 16)) continue;

  function step(dt) {

        physics(dt / n);
        if (!ball.inLane && checkCups()) break;
        // fell back down lane
        if (ball.inLane && ball.y > BH - 12 && ball.vy > 0) {
          ball = null; left++; hud(); state = 'ready'; sfx.back(); say(pick(Q.back), 1.6); setMood('meh', 1.2); break;
        }

        }

        if (ball.age > 9 && !ball.inLane) { ball.age = 6; ball.vx += rand(-220, 220); ball.vy = -rand(80, 200); say(pick(Q.stuck), 1.2); shake = .2; }

      }

  // ---------- drawing ----------
  function rrect(x, y, w, h, r) {

    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function boardPath(inset) {

    g.arc(ARC.x, ARC.y, ARC.r + 4 - i, Math.PI, 0);
    g.lineTo(BW - i, BH - i);
    g.closePath();
  }

      else if (u < .8) { const a = Math.PI + (u - .2) / .6 * Math.PI; x = ARC.x + Math.cos(a) * (ARC.r + 1); y = ARC.y + Math.sin(a) * (ARC.r + 1); }

      const on = chase || flash > .2 && Math.floor(T * 20) % 2 === 0 || fever > 0 && i % 2 === Math.floor(T * 8) % 2;
