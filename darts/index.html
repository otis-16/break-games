<script>
(() => {
  const $ = s => document.getElementById(s);
  const cv = $('cv'), g = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const lerp = (a, b, t) => a + (b - a) * t;
  const angD = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // safe-area probe
  const sa = document.createElement('div');
  sa.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
  document.body.appendChild(sa);

  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-darts-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-darts-best', String(v)); } catch (e) {} };
  let muted = false; try { muted = localStorage.getItem('dgh-muted') === '1'; } catch (e) {}

  // ---------- audio ----------
  let AC = null, NB = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(freq, dur, type = 'sine', vol = .2, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, freq, vol = .2, q = 1, delay = 0) {
    if (!AC || muted || !NB) return;
    const t = AC.currentTime + delay;
    const s = AC.createBufferSource(); s.buffer = NB;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const gn = AC.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f).connect(gn).connect(AC.destination); s.start(t, rand(0, .5)); s.stop(t + dur + .02);
  }
  const sfx = {
    pop: () => { noise(.12, 2600, .5, .7); tone(140, .12, 'sine', .3, -80); },
    thud: () => { noise(.08, 400, .4, 1.5); tone(90, .1, 'triangle', .25, -30); },
    whoosh: () => noise(.22, 1400, .18, 2),
    gold: () => { [880, 1175, 1568].forEach((f, i) => tone(f, .25, 'triangle', .13, 0, i * .06)); },
    black: () => { tone(300, .35, 'sawtooth', .1, -200); },
    boom: () => { noise(.5, 300, .6, .6); tone(70, .4, 'sine', .4, -40); },
    streak: n => tone(500 + n * 90, .15, 'triangle', .12, 200),
    round: () => { [523, 659, 784].forEach((f, i) => tone(f, .25, 'sine', .12, 0, i * .1)); },
    boss: () => { tone(900, .15, 'square', .08, -600); tone(500, .3, 'sawtooth', .07, -300, .1); },
    win: () => { [660, 880, 1320].forEach((f, i) => tone(f, .35, 'sine', .14, 0, i * .09)); },
    ok: () => { [523, 659].forEach((f, i) => tone(f, .3, 'sine', .13, 0, i * .1)); },
    bad: () => tone(220, .4, 'sawtooth', .07, -80)
  };
  const buzz = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
  function renderMute() { $('wave').hidden = muted; $('cross').hidden = !muted; }
  $('mute').addEventListener('click', e => {
    e.stopPropagation(); muted = !muted; renderMute(); initAudio();
    try { localStorage.setItem('dgh-muted', muted ? '1' : '0'); } catch (err) {}
  });
  renderMute();


  const PRIZES = [
    { at: 80, name: '厭世水豚吊飾', col: '#a57a55' },
    { at: 160, name: '歪嘴鯊魚', col: '#7fa6c9' },
    { at: 280, name: '過勞柴犬', col: '#e0a35c' },
    { at: 420, name: '巨型蟑螂抱枕', col: '#6b4630' },
    { at: 600, name: 'KEWEI 限定大娃娃', col: '#f6e7cf' }
  ];
  const COLS = ['#e94b3c', '#f39c32', '#f4cf3c', '#4fb06a', '#3d8fd8', '#9b5cc9', '#ef6fa3', '#2fb3b0'];

  let W, H, DPR, SAT = 0, SAB = 0, B = {}, SH = {}, HP = {}, KW = {};
  let state = 'title', T = 0, round = 0, darts = 6, score = 0, streak = 0, bestStreak = 0;
  let rows = [], balloons = [], stuck = [], flying = null, shreds = [], pops = [], confetti = [];
  let aim = null, hist = [], banner = null, bossHits = 0, hits = 0, thrown = 0, golds = 0, blacks = 0;
  let mood = 'idle', moodT = 0, bubble = null, shake = 0, lastRes = null, prizeLit = -1;

  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle(sa); SAT = parseFloat(cs.paddingTop) || 0; SAB = parseFloat(cs.paddingBottom) || 0;
    const bw = Math.min(W - 28, 520);
    B = { x: (W - bw) / 2, y: SAT + 64, w: bw };
    B.h = Math.min(H * .5, bw * 1.1, H - SAT - 64 - 250 - SAB);
    SH = { x: B.x, y: B.y + B.h + 10, w: B.w, h: 62 };
    HP = { x: W / 2 + 20, y: H - SAB - 64 };
    KW = { x: Math.max(50, B.x + 40), y: H - SAB - 92, s: 27 };
    layout();
  }

  const CFG = [
    { rows: 5, speed: 0, small: 0, gold: 2, black: 2, bomb: 1, wob: 2 },
    { rows: 5, speed: 38, small: .25, gold: 2, black: 3, bomb: 2, wob: 3.5 },
    { rows: 5, speed: 72, small: .45, gold: 2, black: 5, bomb: 2, wob: 5 }
  ];
  function buildWall() {
    const c = CFG[round], ncol = 6;
    rows = []; balloons = []; stuck = [];
    for (let r = 0; r < c.rows; r++) rows.push({ off: rand(0, 100), sp: c.speed ? c.speed * (r % 2 ? -1 : 1) * rand(.8, 1.25) : 0, bob: c.speed ? rand(0, 6) : 0 });
    const cells = [];
    for (let r = 0; r < c.rows; r++) for (let i = 0; i < ncol; i++) cells.push({ r, i });
    const types = cells.map(() => 'n');
    const idx = cells.map((_, k) => k).sort(() => Math.random() - .5);
    let k = 0;

  // ---------- aim & throw ----------
  function wobble(hold) {
    const amp = CFG[round].wob + Math.max(0, hold - .7) * 9;
    const a = Math.min(amp, 34);
    return { x: (Math.sin(T * 7.3) * .6 + Math.sin(T * 12.7 + 1) * .4) * a, y: (Math.cos(T * 6.1) * .6 + Math.sin(T * 10.3 + 2) * .4) * a, a };
  }
  function down(e) {

    aim = { fx: e.clientX, fy: e.clientY, bx: B.x + B.w / 2, by: B.y + B.h * .45, t0: T, lock: null, id: e.pointerId };
    aim.rx = aim.bx; aim.ry = aim.by;

    $('hint').hidden = true;
  }
  function move(e) {
    if (!aim || e.pointerId !== aim.id) return;
    const now = performance.now();
    const p = hist[hist.length - 1];
    hist.push({ x: e.clientX, y: e.clientY, t: now }); if (hist.length > 30) hist.shift();
    const dt = Math.max(1, now - p.t) / 1000;
    const vy = (p.y - e.clientY) / dt;
    if (!aim.lock && vy > 700 && hist.length > 2) {
      const w = wobble(T - aim.t0);
      aim.lock = { x: aim.rx + w.x, y: aim.ry + w.y };
    }
    if (!aim.lock) {
      aim.bx += (e.clientX - p.x) * 1.35; aim.by += (e.clientY - p.y) * 1.35;
      aim.bx = clamp(aim.bx, B.x - 40, B.x + B.w + 40); aim.by = clamp(aim.by, B.y - 40, B.y + B.h + 30);
    }
  }
  function up(e) {
    if (!aim || (e.pointerId !== undefined && e.pointerId !== aim.id)) return;

    for (const h of hist) if (now - h.t <= 90) { o = h; break; }
    const l = hist[hist.length - 1];

  function throwDart(p, v, vx) {

  // ---------- loop ----------
  function step(dt) {
    T += dt;
    for (const r of rows) r.off += r.sp * dt;
    layout();
    for (const b of balloons) b.wob = Math.max(0, b.wob - dt * 1.2);
    if (state === 'banner') { banner.t -= dt; if (banner.t <= 0) { banner = null; state = 'play'; } }
    if (aim) {
      aim.rx = aim.bx; aim.ry = aim.by;
      const hold = T - aim.t0;
      if (hold > 3 && !aim.saidShake) { aim.saidShake = true; say(pick(Q.shake), 1.5); }
    }
    if (flying) { flying.t += dt / .3; if (flying.t >= 1) land(); }
    for (const s of shreds) { s.vy += 600 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt; s.life -= dt; }
    shreds = shreds.filter(s => s.life > 0);
    for (const p of pops) { p.t -= dt; p.y -= 34 * dt; }
    pops = pops.filter(p => p.t > 0);
    for (const c of confetti) { c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .99; c.rot += c.vr * dt; c.life -= dt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    moodT -= dt; if (moodT <= 0 && state !== 'result') mood = 'idle';
    if (bubble) { bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
    shake = Math.max(0, shake - dt);
  }

  }

<script>(function(){var D={"key": "darts", "title": "射氣球", "steps": ["按住螢幕瞄準，準心會跟著手指", "往上甩把飛鏢射出去", "按太久手會抖，甩太大力會飛太高", "金氣球加分、黑氣球扣分、炸彈氣球會炸旁邊"], "icon": "<svg viewBox=\"0 0 80 80\"><path class=\"trail\" d=\"M40 60V12\"/><path class=\"hand flick\" d=\"M34 64V34a6 6 0 0 1 12 0v12l8 2a6 6 0 0 1 5 7l-3 13H38z\"/></svg>"};function show(){if(document.querySelector('.dgh-how'))return;var w=document.createElement('div');w.className='dgh-how';w.setAttribute('role','dialog');w.setAttribute('aria-label','怎麼玩');w.innerHTML='<div class="dgh-hc"><p class="dgh-hk">HOW TO PLAY</p><h2 class="dgh-hh">'+D.title+' 怎麼玩</h2><div class="dgh-hd">'+D.icon+'</div><ol class="dgh-hol">'+D.steps.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol><button class="dgh-hgo" type="button">知道了，開始！</button></div>';function close(){w.remove();try{localStorage.setItem('dgh-howto-'+D.key,'1')}catch(e){}}w.querySelector('.dgh-hgo').addEventListener('click',close);w.addEventListener('click',function(e){if(e.target===w)close()});w.addEventListener('pointerdown',function(e){e.stopPropagation()});document.body.appendChild(w);w.querySelector('.dgh-hgo').focus()}var b=document.createElement('button');b.className='dgh-howbtn';b.type='button';b.textContent='?';b.setAttribute('aria-label','怎麼玩');b.addEventListener('click',function(e){e.stopPropagation();show()});b.addEventListener('pointerdown',function(e){e.stopPropagation()});document.body.appendChild(b);var seen=false;try{seen=localStorage.getItem('dgh-howto-'+D.key)==='1'}catch(e){}if(!seen)show()})();</script>
