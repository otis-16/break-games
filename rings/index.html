<script>(function(){var D={"key": "rings", "title": "套圈圈", "steps": ["手指往後拉（像拉彈弓）", "拉越長丟越遠，往左拉會往右飛", "放手把圈圈丟出去", "套住獎品才算，越遠的獎品越值錢，第 4 圈起有風"], "icon": "<svg viewBox=\"0 0 80 80\"><path class=\"trail\" d=\"M40 60V12\"/><path class=\"hand flick\" d=\"M34 64V34a6 6 0 0 1 12 0v12l8 2a6 6 0 0 1 5 7l-3 13H38z\"/></svg>"};function show(){if(document.querySelector('.dgh-how'))return;var w=document.createElement('div');w.className='dgh-how';w.setAttribute('role','dialog');w.setAttribute('aria-label','怎麼玩');w.innerHTML='<div class="dgh-hc"><p class="dgh-hk">HOW TO PLAY</p><h2 class="dgh-hh">'+D.title+' 怎麼玩</h2><div class="dgh-hd">'+D.icon+'</div><ol class="dgh-hol">'+D.steps.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol><button class="dgh-hgo" type="button">知道了，開始！</button></div>';function close(){w.remove();try{localStorage.setItem('dgh-howto-'+D.key,'1')}catch(e){}}w.querySelector('.dgh-hgo').addEventListener('click',close);w.addEventListener('click',function(e){if(e.target===w)close()});w.addEventListener('pointerdown',function(e){e.stopPropagation()});document.body.appendChild(w);w.querySelector('.dgh-hgo').focus()}var b=document.createElement('button');b.className='dgh-howbtn';b.type='button';b.textContent='?';b.setAttribute('aria-label','怎麼玩');b.addEventListener('click',function(e){e.stopPropagation();show()});b.addEventListener('pointerdown',function(e){e.stopPropagation()});document.body.appendChild(b);var seen=false;try{seen=localStorage.getItem('dgh-howto-'+D.key)==='1'}catch(e){}if(!seen)show()})();</script>
