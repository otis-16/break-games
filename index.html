<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ebdf">
<title>下課十分鐘</title>
<meta name="description" content="一個動作就能玩的手機小遊戲。倒奶茶、畫正圓、切蛋糕、疊雞排、夾娃娃。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Serif+Display&display=swap">
<style>
/* A shelf of small games: one featured product card, the rest in a 2-up grid. Single warm light look. */
:root {
  --cream: #f4ebdf;
  --cream-2: #eadbc8;
  --ink: #3a2a20;
  --ink-soft: #7a6555;
  --stamp: #c2402a;
  --sage: #6f8f78;
  --paper: #fffaf2;
  --f-disp: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --f-latin: "DM Serif Display", "Noto Serif TC", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--f-body);
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 3px solid var(--stamp); outline-offset: 3px; border-radius: 18px; }
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 40px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
header { display: flex; flex-direction: column; gap: 4px; }
.kicker { margin: 0; font-family: var(--f-latin); font-size: 12px; letter-spacing: .3em; color: var(--ink-soft); }
h1 { margin: 0; font-family: var(--f-disp); font-weight: 900; font-size: clamp(48px, 15vw, 76px); line-height: 1.05; letter-spacing: .04em; text-wrap: balance; }
h1 span { color: var(--stamp); }
.lede { margin: 6px 0 0; color: var(--ink-soft); font-size: 15px; }

.feature {
  display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 12px;
  padding: 22px 20px;
  background: var(--paper);
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(58, 42, 32, .1);
  transition: transform .15s ease;
}
.feature:active, .tile:active { transform: scale(.98); }
.tag { display: inline-block; font-size: 11px; letter-spacing: .12em; padding: 2px 9px; border-radius: 999px; background: var(--stamp); color: var(--paper); }
.tag.soft { background: var(--cream-2); color: var(--ink-soft); }
.feature h2 { margin: 8px 0 2px; font-family: var(--f-disp); font-size: 30px; font-weight: 900; line-height: 1.2; }
.feature h2 small { display: block; font-size: 14px; color: var(--ink-soft); font-weight: 600; letter-spacing: .2em; }
.feature p { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }
.play { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 9px 20px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 14px; letter-spacing: .1em; }
.feature svg { width: 120px; height: 150px; }

.shelf-h { margin: 0; font-family: var(--f-disp); font-size: 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.shelf-h span { font-family: var(--f-body); font-size: 12px; color: var(--ink-soft); font-weight: 400; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  display: flex; flex-direction: column; gap: 4px;
  padding: 16px 14px 14px;
  background: var(--paper);
  border-radius: 18px;
  box-shadow: 0 6px 18px rgba(58, 42, 32, .07);
  transition: transform .15s ease;
  min-width: 0;
}
.tile svg { width: 64px; height: 64px; margin-bottom: 6px; }
.tile h3 { margin: 0; font-family: var(--f-disp); font-size: 18px; font-weight: 900; line-height: 1.3; }
.tile p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.tile .tag { align-self: flex-start; margin-top: 6px; }
.best { font-size: 12px; color: var(--sage); font-weight: 700; font-variant-numeric: tabular-nums; }
footer { font-size: 12px; color: var(--ink-soft); text-align: center; }
@media (prefers-reduced-motion: reduce) { .feature, .tile { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="kicker">TEN-MINUTE BREAK GAMES</p>
    <h1>下課<span>十</span>分鐘</h1>
    <p class="lede">一個動作就能玩的小遊戲。手機打開就能玩，玩完把分數丟給朋友。</p>
  </header>

  <a class="feature" href="tea/">
    <div>
      <span class="tag">精緻版</span>
      <h2>倒剛好<small>珍珠奶茶篇</small></h2>
      <p>按住出茶、放開就停，倒到訂單上的那條線。</p>
      <p class="best" id="best-tea"></p>
      <span class="play">開始玩 →</span>
    </div>
    <svg viewBox="0 0 120 150" aria-hidden="true">
      <defs>
        <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8ac80"/><stop offset="1" stop-color="#8e5a35"/></linearGradient>
      </defs>
      <ellipse cx="62" cy="142" rx="40" ry="6" fill="#3a2a20" opacity=".15"/>
      <line x1="72" y1="4" x2="50" y2="120" stroke="#6f8f78" stroke-width="9" stroke-linecap="round"/>
      <path d="M22 30 L98 30 L88 138 L32 138 Z" fill="url(#tea)"/>
      <path d="M22 30 L98 30 L95 54 L25 54 Z" fill="#f4ebdf" opacity=".55"/>
      <g fill="#2a160e"><circle cx="42" cy="128" r="6"/><circle cx="55" cy="130" r="6"/><circle cx="68" cy="129" r="6"/><circle cx="80" cy="127" r="6"/><circle cx="48" cy="118" r="6"/><circle cx="62" cy="119" r="6"/><circle cx="75" cy="117" r="6"/></g>
      <ellipse cx="60" cy="30" rx="38" ry="5" fill="#fff" opacity=".9"/>
      <path d="M30 36 L36 132" stroke="#fff" stroke-width="5" opacity=".45" stroke-linecap="round"/>
    </svg>
  </a>

  <section>
    <h2 class="shelf-h">更多遊戲 <span>精緻版陸續升級中</span></h2>
    <div class="grid" style="margin-top:12px">
      <a class="tile" href="classic/#circle">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="22" fill="none" stroke="#3a2a20" stroke-width="4" stroke-dasharray="120 20" stroke-linecap="round"/><circle cx="32" cy="32" r="3" fill="#c2402a"/></svg>
        <h3>一筆畫正圓</h3><p>畫一圈，看有幾 % 圓</p>
        <span class="tag soft">試玩版</span>
      </a>
      <a class="tile" href="classic/#cake">
        <svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="40" rx="26" ry="10" fill="#e9c8b0"/><rect x="6" y="24" width="52" height="16" fill="#fff4e6"/><ellipse cx="32" cy="24" rx="26" ry="10" fill="#fffaf2" stroke="#ef7f9a" stroke-width="3"/><circle cx="24" cy="22" r="4" fill="#e8384f"/><circle cx="40" cy="24" r="4" fill="#e8384f"/><line x1="32" y1="6" x2="32" y2="58" stroke="#3a2a20" stroke-width="2" stroke-dasharray="4 3"/></svg>
        <h3>蛋糕切一半</h3><p>歪蛋糕，一刀平分</p>
        <span class="tag soft">試玩版</span>
      </a>
      <a class="tile" href="classic/#stack">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="44" width="44" height="12" rx="6" fill="#c17a2c"/><rect x="14" y="32" width="38" height="12" rx="6" fill="#d98f35"/><rect x="18" y="20" width="32" height="12" rx="6" fill="#e9a640"/><rect x="34" y="6" width="22" height="12" rx="6" fill="#f0b04a" transform="rotate(14 45 12)"/></svg>
        <h3>雞排疊疊樂</h3><p>點一下放，對不準會被切</p>
        <span class="tag soft">試玩版</span>
      </a>
      <a class="tile" href="classic/#claw">
        <svg viewBox="0 0 64 64" aria-hidden="true"><line x1="32" y1="2" x2="32" y2="20" stroke="#7a6555" stroke-width="2"/><rect x="25" y="18" width="14" height="8" rx="2" fill="#e7b75f"/><path d="M27 26 L20 38 M37 26 L44 38" stroke="#e7b75f" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="46" r="4" fill="#ff8fab"/><circle cx="40" cy="46" r="4" fill="#ff8fab"/><circle cx="32" cy="52" r="10" fill="#ff8fab"/><circle cx="28" cy="50" r="1.5" fill="#3a2a20"/><circle cx="36" cy="50" r="1.5" fill="#3a2a20"/></svg>
        <h3>夾娃娃機</h3><p>五次機會，看準再下爪</p>
        <span class="tag soft">試玩版</span>
      </a>
    </div>
  </section>

  <footer>最高分只存在你自己的手機裡。</footer>
</main>
<script>
try {
  const b = localStorage.getItem('dgh-tea-best');
  if (b != null) document.getElementById('best-tea').textContent = '你的最高紀錄 ' + b + ' 分';
} catch (e) {}
</script>
</body>
</html>
