  // ---------- storage ----------
  const getBest = () => { try { const v = localStorage.getItem('dgh-goldfish-best'); return v == null ? null : Number(v); } catch (e) { return null; } };
  const setBest = v => { try { localStorage.setItem('dgh-goldfish-best', String(v)); } catch (e) {} };

    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }

  }

    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + dur);

    if (!AC || muted || !nbuf) return;

  }
  const sfx = {
    dip: () => { tone(320, .16, 'sine', .14, -170); hiss(.18, 900, 300, 'lowpass', .1); },

    flick: () => tone(900, .08, 'sine', .06, 500),

  })();

  function rrect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);

  function buildBg() {

  // ---------- caustics (tileable water caustic, low-res, upscaled) ----------
  function updateCaustics() {
    const w = cc.width, h = cc.height, d = cimg.data;
    const time = T * (reduced ? .12 : .45) + 23;
    const sc = TAU / 260 * CS;
    const ts = [], IT = 4;
    for (let n = 0; n < IT; n++) ts.push(time * (1 - 3.5 / (n + 1)));
    let k = 0;
    for (let y = 0; y < h; y++) {
      const py0 = (y * sc) % TAU - 250;
      for (let x = 0; x < w; x++) {
        const px = (x * sc) % TAU - 250, py = py0;
        let ix = px, iy = py, c = 1;
        for (let n = 0; n < IT; n++) {
          const t = ts[n];
          const nx = px + Math.cos(t - ix) + Math.sin(t + iy);
          const ny = py + Math.sin(t - iy) + Math.cos(t + ix);
          ix = nx; iy = ny;
          const a = px / (Math.sin(ix + t) / .005), b = py / (Math.cos(iy + t) / .005);
          c += 1 / Math.sqrt(a * a + b * b);
        }
        c /= IT;
        c = 1.17 - Math.pow(c, 1.4);
        let v = Math.pow(Math.abs(c), 7);
        v = v > 1 ? 1 : v;
        d[k] = 255; d[k + 1] = 255; d[k + 2] = 250; d[k + 3] = v * 225;
        k += 4;
      }
    }
    ccg.putImageData(cimg, 0, 0);
  }

  // ---------- paper ----------
  function jag(n, r0, r1) { const a = []; for (let i = 0; i < n; i++) a.push({ a: i / n * TAU + rand(-.15, .15), r: rand(r0, r1) }); return a; }
  function newPaper() {
    cracks = []; holes = []; fibers = [];
    for (let i = 0; i < 9; i++) {
      const a0 = rand(0, TAU), r0 = rand(.05, .75);
      const pts = [{ x: Math.cos(a0) * r0, y: Math.sin(a0) * r0 }];
      let dir = rand(0, TAU);
      for (let j = 0; j < 7; j++) {
        dir += rand(-.7, .7);
        const p = pts[pts.length - 1];
        let nx = p.x + Math.cos(dir) * rand(.08, .15), ny = p.y + Math.sin(dir) * rand(.08, .15);
        const m = Math.hypot(nx, ny); if (m > .95) { nx *= .95 / m; ny *= .95 / m; }
        pts.push({ x: nx, y: ny });

      cracks.push({ t: .08 + i * .075, pts });
    }
    const hs = [.42, .55, .66, .78, .88];
    hs.forEach(t => {
      const a = rand(0, TAU), r = rand(.1, .6);
      holes.push({ t, x: Math.cos(a) * r, y: Math.sin(a) * r, r: rand(.14, .26), shape: jag(14, .65, 1.15) });
    });
    for (let i = 0; i < 40; i++) {
      const a = rand(0, TAU), r = Math.sqrt(Math.random()) * .95, l = rand(.03, .09), d = rand(0, TAU);
      fibers.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, dx: Math.cos(d) * l, dy: Math.sin(d) * l });
    }

  }
  function jagPath(c, cx, cy, rr, shape) {
    c.beginPath();

    c.closePath();
  }
  function renderPaper(under) {

    pg.setTransform(k, 0, 0, k, (R + 5) * k, (R + 5) * k);

    pg.beginPath(); pg.arc(0, 0, R + 1, 0, TAU); pg.fill();
    if (wet > 0) { pg.fillStyle = `rgba(178,214,226,${wet * (under ? .32 : .22)})`; pg.fill(); }

        for (let i = 1; i < full && i < c.pts.length; i++) pg.lineTo(c.pts[i].x * R, c.pts[i].y * R);
        if (full < c.pts.length && part > 0) { const p = c.pts[full - 1], q = c.pts[full]; pg.lineTo(lerp(p.x, q.x, part) * R, lerp(p.y, q.y, part) * R); }
      };

    pg.beginPath(); pg.arc(0, 0, R + 1, 0, TAU); pg.fill();
    pg.globalCompositeOperation = 'source-over';
  }

  function drawPoiBody(x, y, sc, under) {
    renderPaper(under);
    const S = (2 * R + 10) * sc;
    const wob = under ? Math.sin(T * 20) * poi.wob * .03 : 0;
    g.save(); g.translate(x, y); g.scale(1 + wob, 1 - wob);
    g.drawImage(pc, -S / 2, -S / 2, S, S);
    const rr = R * sc + 3, lw = Math.max(6, R * .13) * sc;
    g.lineWidth = lw; g.strokeStyle = '#e6553c';
    g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.stroke();
    g.lineWidth = lw * .35; g.strokeStyle = 'rgba(255,190,170,.9)';
    g.beginPath(); g.arc(0, 0, rr - lw * .1, Math.PI * 1.05, Math.PI * 1.6); g.stroke();
    g.strokeStyle = 'rgba(140,30,20,.35)'; g.lineWidth = 1;
    g.beginPath(); g.arc(0, 0, rr + lw / 2, 0, TAU); g.stroke();
    g.restore();
  }
  function handleAngle() { return Math.PI / 2 - .38; }
  function drawPoiHandle(x, y, sc, under) {
    const a = handleAngle(), rr = R * sc + 3;
    const sx = x + Math.cos(a) * rr, sy = y + Math.sin(a) * rr;
    const len = R * 1.25 * sc, ex = sx + Math.cos(a) * len, ey = sy + Math.sin(a) * len;
    const w = Math.max(10, R * .24) * sc;
    g.save(); g.lineCap = 'round';
    const hg = g.createLinearGradient(sx, sy, ex, ey);
    hg.addColorStop(0, under ? 'rgba(230,85,60,.55)' : '#e6553c'); hg.addColorStop(under ? .35 : 0, '#e6553c'); hg.addColorStop(1, '#d9472f');
    g.strokeStyle = hg; g.lineWidth = w;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
    g.strokeStyle = 'rgba(255,200,185,.75)'; g.lineWidth = w * .28;
    g.beginPath(); g.moveTo(sx - 2, sy + 2); g.lineTo(ex - 2.5, ey - 1); g.stroke();
    g.restore();
  }

  // ---------- fish ----------
  const wp = s => s < .28 ? .62 + .38 * Math.sin(s / .28 * Math.PI / 2) : 1 - Math.pow((s - .28) / .72, 1.15) * .8;
  const N = 10;
  function spine(f, x, y, a, sc) {
    const bl = R * TYPES[f.t].bl * f.sz * sc, seg = bl / N, fat = TYPES[f.t].fat;
    const P = [];
    let px = x + Math.cos(a) * bl * .42, py = y + Math.sin(a) * bl * .42;
    P.push({ x: px, y: py, a, w: bl * .22 * fat * wp(0) });
    for (let i = 1; i <= N; i++) {
      const s = i / N;
      const ba = a + f.bend * s * .9 + Math.sin(f.ph - s * 2.6) * f.amp * s * s * 1.7;
      px -= Math.cos(ba) * seg; py -= Math.sin(ba) * seg;
      P.push({ x: px, y: py, a: ba, w: bl * .22 * fat * wp(s) });
    }
    P.bl = bl;
    return P;
  }
  function bodyPath(P, k) {
    const h = P[0], w0 = h.w * k;
    const ca = Math.cos(h.a), sa = Math.sin(h.a);
    g.beginPath();
    g.moveTo(h.x + ca * w0 * 1.1, h.y + sa * w0 * 1.1);
    for (let i = 0; i <= N; i++) {
      const p = P[i], nx = Math.cos(p.a - Math.PI / 2), ny = Math.sin(p.a - Math.PI / 2), w = p.w * k;
      if (i === 0) g.quadraticCurveTo(h.x + ca * w0 + nx * w0, h.y + sa * w0 + ny * w0, p.x + nx * w, p.y + ny * w);
      else g.lineTo(p.x + nx * w, p.y + ny * w);
    }
    for (let i = N; i >= 0; i--) {
      const p = P[i], nx = Math.cos(p.a + Math.PI / 2), ny = Math.sin(p.a + Math.PI / 2), w = p.w * k;
      g.lineTo(p.x + nx * w, p.y + ny * w);
      if (i === 0) g.quadraticCurveTo(h.x + ca * w0 + nx * w0, h.y + sa * w0 + ny * w0, h.x + ca * w0 * 1.1, h.y + sa * w0 * 1.1);
    }
    g.closePath();
  }
  function drawFish(f, x, y, a, sc, alpha = 1) {
    const ty = TYPES[f.t], P = spine(f, x, y, a, sc), bl = P.bl;
    g.save(); g.globalAlpha = alpha;
    // tail
    const tb = P[N], ta = tb.a + Math.PI + Math.sin(f.ph - 3.3) * .5, tl = bl * .62;
    for (const k of [-1, 1]) {

      const tip = { x: tb.x + Math.cos(ta + k * spread) * tl, y: tb.y + Math.sin(ta + k * spread) * tl };
      const c1 = { x: tb.x + Math.cos(ta + k * 1.05) * tl * .6, y: tb.y + Math.sin(ta + k * 1.05) * tl * .6 };
      const c2 = { x: tb.x + Math.cos(ta + k * .06) * tl * .78, y: tb.y + Math.sin(ta + k * .06) * tl * .78 };
      const tg = g.createLinearGradient(tb.x, tb.y, tip.x, tip.y);
      tg.addColorStop(0, `rgba(${ty.tail},.85)`); tg.addColorStop(1, `rgba(${ty.tail},.28)`);
      g.fillStyle = tg;
      g.beginPath(); g.moveTo(tb.x, tb.y); g.quadraticCurveTo(c1.x, c1.y, tip.x, tip.y); g.quadraticCurveTo(c2.x, c2.y, tb.x, tb.y); g.fill();

        g.beginPath(); g.moveTo(tb.x, tb.y); g.lineTo(tb.x + Math.cos(ra) * tl * .82, tb.y + Math.sin(ra) * tl * .82); g.stroke();

        g.fillStyle = '#111'; g.beginPath(); g.arc(ex + Math.cos(n) * bl * .02, ey + Math.sin(n) * bl * .02, bl * .05, 0, TAU); g.fill();
        g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(ex - bl * .02, ey - bl * .025, bl * .022, 0, TAU); g.fill();
      } else {
        const ex = e.x + Math.cos(n) * e.w * .72, ey = e.y + Math.sin(n) * e.w * .72;

      g.lineTo(p.x, p.y + r); g.lineTo(p.x - r * .22, p.y + r * .22); g.lineTo(p.x - r, p.y); g.lineTo(p.x - r * .22, p.y - r * .22); g.closePath(); g.fill();

  }

  function genPatches() {
    const p = [];

    for (let i = 0; i < n; i++) p.push({ i: 1 + Math.floor(rand(0, 8)), o: rand(-.8, .8), r: rand(.08, .15), c: Math.random() < .65 ? '#e4532f' : (Math.random() < .5 ? '#2b2628' : '#f39a4a') });
    return p;
  }
  function spawnFish() {
    const list = ['red', 'red', 'red', 'red', 'red', 'red', 'calico', 'calico', 'black', 'gold'];
    fish = list.map(t => {
      let x, y, tries = 0;
      do { x = rand(L.ix0 + 40, L.ix1 - 40); y = rand(L.iy0 + 40, L.iy1 - 40); tries++; }
      while (tries < 40 && Math.hypot(x - L.bx, y - L.by) < L.br * 1.8);

        scared: 0, fleeX: 0, fleeY: 0, st: 'swim', next: rand(1, 4), patches: t === 'calico' ? genPatches() : null, sz: rand(.92, 1.08) };
    });

  function onPaper(f) {

  function dip() {

  function liftUp() {

  function finish() {

  // ---------- input ----------

  // ---------- simulation ----------
  function stepFish(f, dt) {
    const bl = R * TYPES[f.t].bl * f.sz;
    let fx = 0, fy = 0;
    const m = bl * 1.5;
    if (f.x < L.ix0 + m) fx += (L.ix0 + m - f.x) / m * 2.5;
    if (f.x > L.ix1 - m) fx -= (f.x - (L.ix1 - m)) / m * 2.5;
    if (f.y < L.iy0 + m) fy += (L.iy0 + m - f.y) / m * 2.5;
    if (f.y > L.iy1 - m) fy -= (f.y - (L.iy1 - m)) / m * 2.5;

      if (d < lim) { fx += dx / d * (lim - d) / m * 2.5; fy += dy / d * (lim - d) / m * 2.5; } }

      if (d > 0 && d < lim) { const k = (1 - d / lim) * 1.3; fx += dx / d * k; fy += dy / d * k; }
    }
    if (poi.under && state === 'play') {

      if (poi.vs > 150 && d < R * 2.6) { f.scared = Math.max(f.scared, .9); f.fleeX = dx / d; f.fleeY = dy / d; }
      else if (poi.still > .6 && f.scared <= 0 && d < R * 3.6 && d > R * .35) { fx -= dx / d * .5; fy -= dy / d * .5; }
    }
    if (f.scared > 0) { fx += f.fleeX * 3; fy += f.fleeY * 3; }
    const before = f.a;
    const mag = Math.hypot(fx, fy);
    if (mag > .01) { const diff = angDiff(Math.atan2(fy, fx), f.a); f.a += clamp(diff, -1.2, 1.2) * Math.min(mag, 3) * dt * (f.scared > 0 ? 3.2 : 1.6); }
    f.turn += -f.turn * dt + (Math.random() + Math.random() + Math.random() - 1.5) * Math.sqrt(dt) * 2.2;
    f.a += f.turn * dt * (f.scared > 0 ? .3 : .9);
    f.next -= dt;
    if (f.next <= 0) { f.next = rand(1.5, 4.5); const r = Math.random(); f.tsp = r < .28 ? rand(3, 10) : r < .88 ? rand(16, 38) : rand(55, 85); }

    f.x = clamp(f.x, L.ix0 + bl * .45, L.ix1 - bl * .45); f.y = clamp(f.y, L.iy0 + bl * .45, L.iy1 - bl * .45);

  function step(dt) {
    T += dt;
    // poi
    if (state === 'play' && poi.down) {
      const dx = poi.tx - poi.x, dy = poi.ty - poi.y, dist = Math.hypot(dx, dy);
      poi.x = poi.tx; poi.y = poi.ty;

        dur -= drain * dt;

        }

    } else { poi.vs *= .8; poi.wob *= .8; }

          const a = rand(0, TAU), r = rand(0, L.br * .4);
          f.fx1 = L.bx + Math.cos(a) * r; f.fy1 = L.by + Math.sin(a) * r;

  // ---------- drawing ----------
  function innerClip() { rrect(g, L.ix0, L.iy0, L.iw, L.ih, L.ir); g.clip(); }
  function drawWater() {

    }
    // fish
    const sw = fish.filter(f => f.st === 'swim').sort((a, b) => b.z - a.z);
    for (const f of sw) drawFish(f, f.x, f.y, f.a, 1, 1 - f.z * .12);

    g.fillStyle = 'rgba(140,210,232,.16)'; g.fillRect(L.ix0, L.iy0, L.iw, L.ih);
    const sh = (T * 14) % (L.iw + L.ih);
    for (const o of [0, .5]) {
      const p = ((sh / (L.iw + L.ih)) + o) % 1, cx = L.ix0 - L.ih * .5 + p * (L.iw + L.ih);
      const lg = g.createLinearGradient(cx - 60, L.iy0, cx + 60, L.iy0 + 50);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.08)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = lg; g.fillRect(L.ix0, L.iy0, L.iw, L.ih);
    }
    const gl = g.createRadialGradient(L.ix0 + L.iw * .2, L.iy0 + L.ih * .12, 4, L.ix0 + L.iw * .2, L.iy0 + L.ih * .12, L.iw * .55);
    gl.addColorStop(0, 'rgba(255,255,255,.35)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(L.ix0, L.iy0, L.iw, L.ih);

  function drawBowl() {
    const x = L.bx, y = L.by, r = L.br;
    g.save();
    g.globalAlpha = .9; g.drawImage(blob, x - r * 1.2 + 8, y - r * 1.2 + 12, r * 2.4, r * 2.4); g.globalAlpha = 1;
    const bg = g.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
    bg.addColorStop(0, '#e6f7fb'); bg.addColorStop(.8, '#bfe6f1'); bg.addColorStop(1, '#9fd6e6');

      const fa = f.bA + Math.sign(f.bw) * Math.PI / 2;

    g.restore();
    // glass rim
    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 4;
    g.beginPath(); g.arc(x, y, r - 2, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(60,140,170,.35)'; g.lineWidth = 1;
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke();
    g.beginPath(); g.arc(x, y, r - 5, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.arc(x, y, r * .72, Math.PI * 1.1, Math.PI * 1.38); g.stroke();
    g.beginPath(); g.arc(x, y, r * .72, Math.PI * 1.46, Math.PI * 1.52); g.stroke();
    g.restore();
  }

  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-3, 3) * shake * 4, rand(-2, 2) * shake * 4);
    g.drawImage(bgc, 0, 0, W, H);
    drawWater();
    const showPoi = state !== 'title';
    if (showPoi && poi.under) drawPoiHandle(poi.x, poi.y, 1, true);
    drawBowl();
    if (showPoi && !poi.under) {
      const k = poi.lift, sc = 1 + k * .06;
      g.save(); g.globalAlpha = .55 * k;
      g.drawImage(blob, poi.x - R + 10 * k, poi.y - R + 16 * k, R * 2.2, R * 2.2);
      g.restore();
      drawPoiBody(poi.x, poi.y, sc, false);
      drawPoiHandle(poi.x, poi.y, sc, false);
    }
    // fish being lifted / flying
    for (const f of fish) {
      if (f.st === 'lift') {
        const k = Math.min(1, f.lt / .25);
        drawShadow(f, f.lx, f.ly, f.a, 1, 1 + k * 1.5);
        drawFish(f, f.lx, f.ly - k * 6, f.a + Math.sin(T * 18 + f.delay * 7) * .25, 1 + k * .08);
      } else if (f.st === 'fly') {
        const p = f.ft, e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const x = lerp(f.fx0, f.fx1, e), y = lerp(f.fy0, f.fy1, e) - Math.sin(p * Math.PI) * Math.min(160, H * .18);
        const sc = lerp(1.08, .42, e) + Math.sin(p * Math.PI) * .25;
        drawFish(f, x, y, f.a0 + p * Math.PI * 1.5 * (f.delay % .18 ? -1 : 1), sc);
      }
    }
    // drops
    for (const d of drops) {
      g.fillStyle = `rgba(255,255,255,${d.a})`; g.beginPath(); g.arc(d.x, d.y - d.z * .25, d.r, 0, TAU); g.fill();
      g.strokeStyle = `rgba(60,140,170,${d.a * .4})`; g.lineWidth = .8; g.stroke();
    }
    // pops
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const p of pops) {
      const a = p.t < .15 ? p.t / .15 : 1 - Math.max(0, p.t - .8) / .5;
      const y = p.y - p.t * 34;
      g.globalAlpha = clamp(a, 0, 1);
      g.font = p.txt.startsWith('+') ? `400 ${p.big ? 34 : 28}px "DM Serif Display", serif` : `900 ${p.big ? 20 : 15}px "Noto Serif TC", serif`;
      g.lineWidth = 5; g.strokeStyle = 'rgba(255,250,242,.95)'; g.lineJoin = 'round';
      g.strokeText(p.txt, p.x, y); g.fillStyle = p.col; g.fillText(p.txt, p.x, y);
      g.globalAlpha = 1;
    }
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }

  let last = 0, frameN = 0;
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt);
    if ((frameN++ & 1) === 0 || causticTick === 0) { updateCaustics(); causticTick = 1; }
    draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  fit();
  spawnFish(); newPaper();
  const b = getBest();
  $('bestTitle').textContent = b == null ? '今天的第一張紙網' : `個人最高紀錄 ${b} 分`;
  requestAnimationFrame(frame);
})();
</script>
