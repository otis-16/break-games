<style>
/* A cosy living room seen from above: wood floor, velvet sofas as walls, pink cushions as targets. */
:root {
  --cream: #f4ebdf;
  --cream-2: #eadbc8;
  --ink: #3a2a20;
  --ink-soft: #7a6555;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--stamp); outline-offset: 3px; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#sa { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }

.mute {

  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: max(14px, env(safe-area-inset-right, 0px));
  z-index: 20;
  width: 40px; height: 40px;

  background: rgba(255, 250, 242, .8);
  box-shadow: 0 2px 10px rgba(58, 42, 32, .12);
  display: grid; place-items: center;
}
.mute svg { width: 20px; height: 20px; }

/* level slip */
.slip {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(14px, env(safe-area-inset-left, 0px));
  z-index: 10;
  width: 168px;
  padding: 9px 12px 11px;
  background: var(--paper);
  box-shadow: 0 6px 18px rgba(58, 42, 32, .14);
  font-size: 12px;
  line-height: 1.5;
  transform: rotate(-2.5deg);
  transform-origin: 20% 0;
  animation: print .5s cubic-bezier(.2, .9, .3, 1.2) both;
}
.slip::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
  background: linear-gradient(-45deg, transparent 4px, var(--paper) 0) 0 0 / 8px 6px repeat-x,

@keyframes print { from { transform: rotate(-2.5deg) translateY(-130%); } }
.slip .no { display: flex; justify-content: space-between; color: var(--ink-soft); letter-spacing: .08em; border-bottom: 1px dashed var(--cream-2); padding-bottom: 4px; margin-bottom: 4px; }
.slip .item { font-weight: 700; font-size: 15px; font-family: var(--f-disp); }
.slip .tgt { margin-top: 4px; display: flex; align-items: baseline; gap: 4px; color: var(--stamp); font-variant-numeric: tabular-nums; }

.slip .tgt i { font-style: normal; color: var(--ink-soft); margin-left: auto; }

.ctrl {
  position: fixed; left: 50%; transform: translateX(-50%);

  background: rgba(255, 250, 242, .92);

.ctrl button:disabled { opacity: .4; }

#undo { background: var(--ink); color: var(--paper); }

.rank {

.role { margin: 0; font-family: var(--f-disp); font-size: 22px; font-weight: 900; align-self: end; }
.score { margin: 0; align-self: start; color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }

.stars { color: #e3a52f; letter-spacing: .1em; font-size: 15px; margin-left: 6px; }
.detail { grid-column: 1 / -1; margin: 12px 0 0; padding: 10px 12px; background: var(--cream); border-radius: 10px; font-size: 13px; line-height: 1.6; font-variant-numeric: tabular-nums; }

.btns { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

#again { background: var(--ink); color: var(--paper); }
#share { background: var(--cream); }
.minor { grid-column: 1 / -1; display: flex; justify-content: center; gap: 22px; margin-top: 8px; }
.minor button { font-size: 13px; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

.lv-h { display: flex; justify-content: space-between; align-items: baseline; max-width: 420px; margin: 0 auto 12px; }

.lv-grid button.cur { box-shadow: inset 0 0 0 2px var(--stamp); }

.lv-close { display: block; margin: 14px auto 0; padding: 11px 36px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {

</style>

    push: () => { tone(140, .14, 'sine', .22, -50); hiss(.16, 700, .12); },
    bump: () => { tone(110, .12, 'square', .05, -40); tone(90, .1, 'sine', .15, -30); },

    undo: () => tone(520, .09, 'triangle', .08, -220),

  // ---------- KEWEI (canvas port of the site's SVG mascot; 200x220 design box, origin = feet center) ----------

  const KP = {};
  ['M146 182c34 2 40-30 22-40', 'M62 140q6-6 12 0M126 140q6-6 12 0', 'M44 70L50 18L90 44Z', 'M156 70L150 18L110 44Z',
   'M56 54L58 32L76 46Z', 'M144 54L142 32L124 46Z', 'M89 110q5.5 7 11 0q5.5 7 11 0', 'M40 100L16 95M40 107L16 110M160 100L184 95M160 107L184 110',

  function drawKewei(g, x, y, o = {}) {

    const FUR = '#fff1e6';

    // soft floor shadow

    if (o.cushion) { g.fillStyle = '#ff8fbd'; g.beginPath(); g.ellipse(100, 198, 88, 20, 0, 0, 7); g.fill(); g.fillStyle = '#ffb6d3'; g.beginPath(); g.ellipse(100, 193, 80, 15, 0, 0, 7); g.fill(); }
    // puffed fur spikes

      for (const [cx, cy, rx, ry] of [[100, 88, 66, 56], [100, 150, 50, 44]]) {
        g.beginPath();
        for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, k = i % 2 ? 1 + .28 * puff : 1; g.lineTo(cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k); }
        g.fill();
      }
    }
    g.strokeStyle = FUR; g.lineWidth = 13 + puff * 8; g.lineCap = 'round'; g.stroke(KP[0]);
    g.fillStyle = FUR; g.beginPath(); g.ellipse(100, 150, 50, 44, 0, 0, 7); g.fill();
    g.strokeStyle = '#f0b89a'; g.lineWidth = 4; g.stroke(KP[1]);
    g.fillStyle = FUR; g.beginPath(); g.ellipse(72, 188, 17, 9, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(128, 188, 17, 9, 0, 0, 7); g.fill();
    g.fill(KP[2]); g.fill(KP[3]); g.fillStyle = '#ffb6cf'; g.fill(KP[4]); g.fill(KP[5]);
    // head with soft shading
    const hg = g.createRadialGradient(84, 70, 8, 100, 88, 72); hg.addColorStop(0, '#fffaf4'); hg.addColorStop(1, '#f6e2d0');
    g.fillStyle = hg; g.beginPath(); g.ellipse(100, 88, 66, 56, 0, 0, 7); g.fill();
    g.fillStyle = '#f0b89a'; rr(g, 86.5, 38, 5, 16, 2.5); rr(g, 97.5, 36, 5, 18, 2.5); rr(g, 108.5, 38, 5, 16, 2.5);

    g.fillStyle = '#ff7aa3'; g.beginPath(); g.ellipse(100, 103, 5.5, 4.2, 0, 0, 7); g.fill();
    if (eyes === 'shock' || eyes === 'x') { g.fillStyle = '#6a2a40'; g.beginPath(); g.ellipse(100, 116, 6, 7, 0, 0, 7); g.fill(); }

    g.strokeStyle = '#c89aa8'; g.lineWidth = 2; g.stroke(KP[7]);

  // ---------- level state ----------
  let state = 'title', T = 0, li = 0;
  let LW = 0, LH = 0, wall = [], goal = [], inside = [], dead = [];
  let player = null, boxes = [], moves = 0, pushes = 0, hist = [];
  let face = 1, squash = 0, tilt = 0, bumpT = 0, mood = 'open', moodT = 0, blinkT = 2;
  let bubble = null, parts = [], confetti = [], shake = 0, clearT = -1, flash = 0;
  let lastRes = null;
  const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];

  function loadLevel(i, quiet) {
    window.DGH_DAILY && DGH_DAILY.reseed();
    li = clamp(i, 0, LEVELS.length - 1);
    const rows = LEVELS[li].map;
    LH = rows.length; LW = Math.max(...rows.map(r => r.length));
    wall = []; goal = []; inside = []; boxes = [];
    let p = 0, ci = 0;
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      const c = rows[y][x] || ' ', k = y * LW + x;
      wall[k] = c === '#'; goal[k] = '.*+'.includes(c);
      if ('$*'.includes(c)) boxes.push({ k, x, y, rx: x, ry: y, roll: rand(0, 6), col: YARN_COLS[ci++ % YARN_COLS.length], seat: goal[k] ? 1 : 0, wob: 0 });
      if ('@+'.includes(c)) p = k;
    }
    // flood from KEWEI to find the room's floor
    const st = [p]; inside[p] = true;
    while (st.length) { const c = st.pop(), cx = c % LW, cy = (c / LW) | 0; for (const [dx, dy] of DIRS) { const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= LW || ny >= LH) continue; const n = ny * LW + nx; if (!wall[n] && !inside[n]) { inside[n] = true; st.push(n); } } }
    dead = [];
    for (let k = 0; k < LW * LH; k++) { if (!inside[k] || goal[k]) continue; const x = k % LW, y = (k / LW) | 0; const W_ = (xx, yy) => !!wall[yy * LW + xx]; dead[k] = (W_(x, y - 1) || W_(x, y + 1)) && (W_(x - 1, y) || W_(x + 1, y)); }
    player = { k: p, x: p % LW, y: (p / LW) | 0 }; player.rx = player.x; player.ry = player.y;
    moves = 0; pushes = 0; hist = []; face = 1; mood = 'open'; clearT = -1; parts = []; squash = 0; tilt = 0;
    state = 'play';
    fit();
    updSlip(true);
    if (!quiet) say(QUIPS[li], 3.2);
    $('title').hidden = true; $('sheet').hidden = true; $('levels').hidden = true;
    $('ctrl').hidden = false;
    $('hint').hidden = !(li === 0 && !prog.s[0]);
  }

  function updSlip(reprint) {
    $('lvNo').textContent = 'LV.' + String(li + 1).padStart(2, '0') + ' / 12';
    const s = prog.s[li] || 0;
    $('lvStars').textContent = '★'.repeat(s) + '☆'.repeat(3 - s);
    $('lvName').textContent = LEVELS[li].name;
    $('moves').textContent = moves;
    $('par').textContent = '標準 ' + LEVELS[li].par + ' 步';
    $('undo').disabled = !hist.length;
    if (reprint) { const slip = $('slip'); slip.hidden = true; void slip.offsetWidth; slip.hidden = false; }
  }

  function boxAt(k) { return boxes.find(b => b.k === k); }

  function tryMove(d) {
    if (state !== 'play') return;
    const [dx, dy] = DIRS[d];
    if (dx) face = dx;
    $('hint').hidden = true;
    const nx = player.x + dx, ny = player.y + dy;
    if (nx < 0 || ny < 0 || nx >= LW || ny >= LH) return;
    const nk = ny * LW + nx;
    if (wall[nk]) return bump(dx, dy, null);
    const b = boxAt(nk);
    if (b) {
      const tx = nx + dx, ty = ny + dy, tk = ty * LW + tx;

      fluff(b.rx + .5, b.ry + .5, b.col[0], 5);
      const wasSeat = b.seat;
      b.seat = goal[tk] ? 1 : 0;
      if (b.seat && !wasSeat) {
        const n = boxes.filter(o => o.seat).length;
        setTimeout(() => { sfx.seat(n); sparkle(tx + .5, ty + .5); }, 90);
        buzz(12);
      }
      if (dead[tk]) { setTimeout(() => { sfx.stuck(); mood = 'shock'; moodT = 1.4; say(pick(STUCK), 2.6); }, 120); }
      else if (Math.random() < .12 && !bubble) say(pick(PUSH), 1.1);
    } else {
      hist.push({ p: player.k, b: boxes.map(o => o.k), m: moves, pu: pushes });

    }
    player.k = nk; player.x = nx; player.y = ny; moves++;
    updSlip();
    if (boxes.every(o => goal[o.k])) { state = 'clear'; clearT = 0; }
  }

  }

  function undo() {
    if (state !== 'play' || !hist.length) return;
    const h = hist.pop();
    player.k = h.p; player.x = h.p % LW; player.y = (h.p / LW) | 0;
    h.b.forEach((k, i) => { const b = boxes[i]; b.k = k; b.x = k % LW; b.y = (k / LW) | 0; b.seat = goal[k] ? 1 : 0; });
    moves = h.m; pushes = h.pu; mood = 'open';
    sfx.undo(); updSlip();
  }

  // ---------- results ----------
  function starsFor(m, par) { return m <= par ? 3 : m <= Math.ceil(par * 1.5) ? 2 : 1; }
  function finishLevel() {
    state = 'result';
    const par = LEVELS[li].par, st = starsFor(moves, par);
    const before = totalStars();
    prog.s[li] = Math.max(prog.s[li] || 0, st);
    if (li + 1 < LEVELS.length) prog.u = Math.max(prog.u, li + 1);
    saveProg();
    const total = totalStars();
    const prev = getBest(); const isNew = prev == null || total > prev;
    if (isNew) setBest(total);
    window.DGH_DAILY && DGH_DAILY.save(total);
    const last = li === LEVELS.length - 1;
    let rk, role;
    if (last) {
      if (total >= 34) { rk = 'S'; role = '毛線球大師'; } else if (total >= 28) { rk = 'A'; role = '逗貓棒高手'; } else if (total >= 20) { rk = 'B'; role = '貓奴實習生'; } else { rk = 'C'; role = '被毛線纏住'; }
    } else if (moves <= par) { rk = 'S'; role = '毛線球大師'; }
    else if (moves <= Math.ceil(par * 1.5)) { rk = 'A'; role = '逗貓棒高手'; }
    else if (moves <= par * 2.5) { rk = 'B'; role = '貓奴實習生'; }
    else { rk = 'C'; role = '被毛線纏住'; }
    $('rank').textContent = rk; $('role').textContent = role; $('score').textContent = total;
    $('sheetStars').textContent = '★'.repeat(st) + '☆'.repeat(3 - st);
    const tip = moves <= par ? (moves < par ? '比標準還少？你是不是偷偷改了沙發。' : '一步不多、一步不少，剛剛好。')
      : moves <= Math.ceil(par * 1.5) ? '差一點點就三顆星，KEWEI 在旁邊搖尾巴。'
      : '過關了！不過繞的路夠 KEWEI 散步兩圈。';
    const head = last
      ? `十二間客廳全部整理完！總共 <b>${total}</b> / 36 顆星。<br>最後一關 ${moves} 步（標準 ${par} 步）。`
      : `第 ${li + 1} 關「${LEVELS[li].name}」：<b>${moves}</b> 步（標準 ${par} 步），推了 ${pushes} 下。<br>${tip}`;
    const bestLine = isNew && total > before && total > 0 ? `<br><span class="newbest">星星收藏刷新：${total} 顆</span>` : prev != null ? `<br>星星收藏：${total} / 36 顆` : '';
    $('detail').innerHTML = head + bestLine;
    $('again').textContent = last ? '再玩一次' : '下一關';
    lastRes = { rk, role, total, st, moves, par, lv: li + 1, last };
    $('ctrl').hidden = true; $('slip').hidden = true;
    $('sheet').hidden = false;
    if (rk === 'S') sfx.win(); else sfx.seat(3);
    buzz(rk === 'S' ? [20, 40, 20] : 15);
    if (rk === 'S' && !reduced) burst(90);
  }

  function burst(n) {
    const cols = ['#c2402a', '#6f8f78', '#e7b75f', '#3a2a20', '#f2a7a0', '#ff4f93'];
    for (let i = 0; i < n; i++) confetti.push({ x: W / 2 + rand(-40, 40), y: B.oy, vx: rand(-260, 260), vy: rand(-520, -180), r: rand(3, 6), c: cols[i % cols.length], rot: rand(0, 6), vr: rand(-8, 8), life: rand(1.6, 2.6) });
  }
  function fluff(x, y, col, n) { if (reduced) return; for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-1.2, 1.2), vy: rand(-1.6, -.2), r: rand(.03, .07), c: col, life: rand(.4, .8), t: 'f' }); }
  function sparkle(x, y) { if (reduced) return; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28; parts.push({ x, y, vx: Math.cos(a) * rand(1.5, 3), vy: Math.sin(a) * rand(1.5, 3), r: rand(.04, .08), c: pick(['#ffd36b', '#fff4c9', '#ff9cbc']), life: rand(.4, .7), t: 's' }); } }
  function say(text, life) { bubble = { text, life, max: life }; }

  // ---------- layout ----------
  let W, H, DPR, B = { tile: 40, ox: 0, oy: 0 };
  function fit() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    const cs = getComputedStyle($('sa'));
    const st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
    const top = st + 130, bot = sb + 92;
    const avH = Math.max(120, H - top - bot), avW = W - 24;
    const tile = Math.floor(Math.min(avW / LW, avH / LH, 66));
    B = { tile, ox: Math.round((W - tile * LW) / 2), oy: Math.round(top + (avH - tile * LH) / 2 + tile * .12) };
    // on the title screen, tuck the demo room under the heading
    if (!$('title').hidden) { const t2 = Math.floor(Math.min(avW / LW, H * .3 / LH, 56)); B = { tile: t2, ox: Math.round((W - t2 * LW) / 2), oy: Math.round(Math.max(H * .66, H - sb - 40 - t2 * LH)) }; }
    if (player) draw();
  }

  // ---------- drawing ----------
  const hash = (x, y) => { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  function rrp(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  function drawBackdrop() {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#f6eee3'); bg.addColorStop(1, '#e8d8c3');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    // rug under the room
    const t = B.tile, rx = B.ox - t * .35, ry = B.oy - t * .5, rw = LW * t + t * .7, rh = LH * t + t * .8;
    g.fillStyle = 'rgba(70,45,25,.10)'; rrp(rx + 4, ry + 10, rw, rh, t * .5); g.fill();
    g.fillStyle = '#efe2cf'; rrp(rx, ry, rw, rh, t * .5); g.fill();
    g.strokeStyle = 'rgba(194,64,42,.25)'; g.setLineDash([6, 6]); g.lineWidth = 1.5; rrp(rx + 8, ry + 8, rw - 16, rh - 16, t * .4); g.stroke(); g.setLineDash([]);
  }

  function drawFloor() {
    const t = B.tile;
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      const k = y * LW + x; if (!inside[k]) continue;
      const px = B.ox + x * t, py = B.oy + y * t;
      for (let p = 0; p < 2; p++) {
        const v = hash(x * 2 + p, y);
        const l = 62 + v * 8;
        g.fillStyle = `hsl(30, 48%, ${l}%)`;
        g.fillRect(px, py + p * t / 2, t + .5, t / 2 + .5);
        // grain
        g.strokeStyle = 'rgba(120,75,40,.13)'; g.lineWidth = 1;
        g.beginPath(); const gy = py + p * t / 2 + t * (.15 + v * .2);
        g.moveTo(px + 2, gy); g.quadraticCurveTo(px + t / 2, gy + (v - .5) * 4, px + t - 2, gy + 1); g.stroke();
        // plank seam
        g.fillStyle = 'rgba(110,65,35,.28)'; g.fillRect(px, py + p * t / 2, t, 1);
        const sx = px + ((x + y * 3 + p * 2) % 4 === 0 ? t * .3 : t * .8);
        if (hash(x, y * 2 + p) > .45) g.fillRect(sx, py + p * t / 2, 1, t / 2);
      }
    }
    // inner shadows along sofas
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      const k = y * LW + x; if (!inside[k]) continue;
      const px = B.ox + x * t, py = B.oy + y * t;
      if (wall[k - LW]) { const sg = g.createLinearGradient(0, py, 0, py + t * .45); sg.addColorStop(0, 'rgba(60,35,20,.32)'); sg.addColorStop(1, 'rgba(60,35,20,0)'); g.fillStyle = sg; g.fillRect(px, py, t, t * .45); }
      if (x > 0 && wall[k - 1]) { const sg = g.createLinearGradient(px, 0, px + t * .3, 0); sg.addColorStop(0, 'rgba(60,35,20,.2)'); sg.addColorStop(1, 'rgba(60,35,20,0)'); g.fillStyle = sg; g.fillRect(px, py, t * .3, t); }
    }
  }

  function drawCushion(x, y, filled) {
    const t = B.tile, cx = B.ox + (x + .5) * t, cy = B.oy + (y + .5) * t, s = t * .78;
    if (filled) {
      const gl = g.createRadialGradient(cx, cy, s * .2, cx, cy, s * .95);
      gl.addColorStop(0, `rgba(255,214,120,${.55 + Math.sin(T * 4 + x) * .15})`); gl.addColorStop(1, 'rgba(255,214,120,0)');
      g.fillStyle = gl; g.fillRect(cx - s, cy - s, s * 2, s * 2);
    }
    g.fillStyle = 'rgba(120,50,50,.18)'; rrp(cx - s / 2 + 1, cy - s / 2 + 3, s, s, s * .3); g.fill();
    const cg = g.createLinearGradient(cx - s / 2, cy - s / 2, cx + s / 2, cy + s / 2);
    cg.addColorStop(0, '#ffc2d6'); cg.addColorStop(1, '#f08bae');
    g.fillStyle = cg; rrp(cx - s / 2, cy - s / 2, s, s, s * .3); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.setLineDash([3, 3]); g.lineWidth = 1.2;
    rrp(cx - s / 2 + 4, cy - s / 2 + 4, s - 8, s - 8, s * .22); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#d9628b'; g.beginPath(); g.arc(cx, cy, s * .07, 0, 7); g.fill();
  }

  function drawSofa(x, y) {
    const t = B.tile, px = B.ox + x * t, py = B.oy + y * t;
    const lift = t * .2;
    const k = y * LW + x;
    const below = y + 1 < LH && wall[k + LW];
    // drop shadow onto floor
    if (!below) { g.fillStyle = 'rgba(60,35,20,.22)'; rrp(px + 2, py + t - lift * .2, t - 2, lift * .9, 4); g.fill(); }
    // front face
    if (!below) { g.fillStyle = '#58705e'; rrp(px, py + t - lift - 4, t, lift + 4, 5); g.fill(); g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(px + 3, py + t - 3, t - 6, 2); }
    // top
    const tg = g.createLinearGradient(0, py - lift, 0, py + t - lift);
    tg.addColorStop(0, '#9dbaa3'); tg.addColorStop(1, '#7f9c86');
    g.fillStyle = tg;
    const L = x > 0 && wall[k - 1], R = x + 1 < LW && wall[k + 1], U = y > 0 && wall[k - LW];
    rrp(px - (L ? 1 : 0), py - lift - (U ? lift + 1 : 0), t + (L ? 1 : 0) + (R ? 1 : 0), t + (U ? lift + 1 : 0), 7); g.fill();
    // velvet tuft
    g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(px + t * .4, py - lift + t * .32, t * .22, t * .1, -.3, 0, 7); g.fill();
    g.fillStyle = 'rgba(40,60,45,.35)'; g.beginPath(); g.arc(px + t * .5, py - lift + t * .5, t * .045, 0, 7); g.fill();
  }

  function drawYarn(b) {
    const t = B.tile, r = t * .36;
    const wob = Math.sin(b.wob * 40) * b.wob * t * .1;
    const cx = B.ox + (b.rx + .5) * t + wob, cy = B.oy + (b.ry + .5) * t - t * .04;
    g.fillStyle = 'rgba(60,35,20,.25)'; g.beginPath(); g.ellipse(cx + r * .12, cy + r * .82, r * .9, r * .3, 0, 0, 7); g.fill();
    // loose tail
    g.strokeStyle = b.col[1]; g.lineWidth = Math.max(1.5, t * .035); g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx + r * .6, cy + r * .6); g.bezierCurveTo(cx + r * 1.1, cy + r * .9, cx + r * 1.2, cy + r * .3 + Math.sin(T * 3 + b.roll) * 2, cx + r * 1.35, cy + r * .75); g.stroke();
    const yg = g.createRadialGradient(cx - r * .35, cy - r * .4, r * .1, cx, cy, r);
    yg.addColorStop(0, b.col[0]); yg.addColorStop(1, b.col[1]);
    g.fillStyle = yg; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.clip();
    g.translate(cx, cy); g.rotate(b.roll);
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = Math.max(1, t * .025);
    for (let i = -2; i <= 2; i++) { g.beginPath(); g.ellipse(i * r * .32, 0, r * .25, r * 1.1, 0, 0, 7); g.stroke(); }
    g.rotate(1.2);
    g.strokeStyle = 'rgba(0,0,0,.14)';
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.ellipse(i * r * .45, 0, r * .3, r * 1.1, 0, 0, 7); g.stroke(); }
    g.restore();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(cx - r * .38, cy - r * .42, r * .22, r * .13, -.6, 0, 7); g.fill();
  }

  function drawPlayer() {
    const t = B.tile;
    let ox = 0, oy = 0;
    if (bumpT > 0) { const k = Math.sin((1 - bumpT / .22) * Math.PI) * t * .12; ox = (player.bx || 0) * k; oy = (player.by || 0) * k; }
    const cx = B.ox + (player.rx + .5) * t + ox, fy = B.oy + (player.ry + .5) * t + t * .4 + oy;
    const hop = state === 'clear' || state === 'result' ? Math.abs(Math.sin(T * 7)) * t * .15 : 0;
    g.save(); g.translate(cx, fy - hop); g.scale(face * (1 + squash * .6), 1 - squash);
    const eyes = state === 'clear' || state === 'result' ? 'happy' : mood;
    drawKewei(g, 0, 0, { s: t / 200 * 1.1, eyes, tilt: tilt * face, blink: blinkT < .12 && eyes === 'open' });
    g.restore();
  }

  function drawBubble() {
    if (!bubble || state === 'title') return;
    const t = B.tile;
    const a = clamp(bubble.life * 4, 0, 1) * clamp((bubble.max - bubble.life) * 8, 0, 1);
    g.save(); g.globalAlpha = a;
    g.font = '700 14px "Noto Sans TC", sans-serif';
    const tw = g.measureText(bubble.text).width, w = tw + 24, h = 32;
    const ax = B.ox + (player.rx + .5) * t, ay = B.oy + (player.ry + .5) * t - t * .95;
    const bx = clamp(ax - w / 2, 10, W - w - 10), by = Math.max(ay - h - 8, 8);
    g.fillStyle = 'rgba(58,42,32,.16)'; rrp(bx + 2, by + 4, w, h, 16); g.fill();
    g.fillStyle = '#fffaf2'; rrp(bx, by, w, h, 16); g.fill();
    g.beginPath(); g.moveTo(clamp(ax - 7, bx + 12, bx + w - 26), by + h - 1); g.lineTo(clamp(ax + 7, bx + 26, bx + w - 12), by + h - 1); g.lineTo(clamp(ax, bx + 18, bx + w - 18), by + h + 8); g.fill();
    g.fillStyle = '#3a2a20'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(bubble.text, bx + w / 2, by + h / 2 + 1);
    g.restore();
  }

  function drawRoom() {
    for (let k = 0; k < LW * LH; k++) if (goal[k]) drawCushion(k % LW, (k / LW) | 0, boxes.some(b => b.k === k && Math.abs(b.rx - b.x) + Math.abs(b.ry - b.y) < .3));
    // painter's order, row by row so sofas overlap what is behind them
    for (let y = 0; y < LH; y++) {
      for (let x = 0; x < LW; x++) if (wall[y * LW + x] && nearRoom(x, y)) drawSofa(x, y);
      for (const b of boxes) if (Math.round(b.ry) === y) drawYarn(b);
      if (Math.round(player.ry) === y) drawPlayer();
    }
  }
  function nearRoom(x, y) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < LW && ny < LH && inside[ny * LW + nx]) return true; }
    return false;
  }

  function drawParts() {
    const t = B.tile;
    for (const p of parts) {
      g.globalAlpha = clamp(p.life * 2, 0, 1); g.fillStyle = p.c;
      const x = B.ox + p.x * t, y = B.oy + p.y * t;
      if (p.t === 's') { g.save(); g.translate(x, y); g.rotate(T * 4); g.fillRect(-p.r * t, -p.r * t * .3, p.r * t * 2, p.r * t * .6); g.fillRect(-p.r * t * .3, -p.r * t, p.r * t * .6, p.r * t * 2); g.restore(); }
      else { g.beginPath(); g.arc(x, y, p.r * t, 0, 7); g.fill(); }
    }
    g.globalAlpha = 1;
  }

  // ---------- input ----------
  let sw = null;
  function down(e) {
    if (e.target.closest('button, a, .sheet, .title')) return;
    initAudio();
    if (state !== 'play') return;
    e.preventDefault();
    sw = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
  }
  function move(e) {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y, th = Math.max(22, B.tile * .55);
    if (Math.abs(dx) < th && Math.abs(dy) < th) return;
    tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 1 : 0));
    sw.x = e.clientX; sw.y = e.clientY; sw.moved = true;
  }
  function up(e) {
    if (!sw) return;
    // a short tap next to KEWEI also walks there
    if (!sw.moved && state === 'play') {
      const t = B.tile, px = B.ox + (player.x + .5) * t, py = B.oy + (player.y + .5) * t;
      const dx = e.clientX - px, dy = e.clientY - py;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > t * .5 && Math.max(Math.abs(dx), Math.abs(dy)) < t * 1.6) tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 1 : 0));
    }
    sw = null;
  }
  addEventListener('pointerdown', down, { passive: false });
  addEventListener('pointermove', move);
  addEventListener('pointerup', up); addEventListener('pointercancel', () => { sw = null; });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    const m = { ArrowUp: 0, KeyW: 0, ArrowDown: 1, KeyS: 1, ArrowLeft: 2, KeyA: 2, ArrowRight: 3, KeyD: 3 }[e.code];
    if (m != null) { initAudio(); tryMove(m); e.preventDefault(); }
    else if (e.code === 'KeyZ' || e.code === 'Backspace') { undo(); e.preventDefault(); }
    else if (e.code === 'KeyR' && state === 'play') loadLevel(li, true);
  });

  $('undo').addEventListener('click', () => { initAudio(); undo(); });
  $('reset').addEventListener('click', () => { initAudio(); if (state === 'play') { loadLevel(li, true); say(pick(['重新來過，沙發不會記仇。', '再一次！這次想好再推。', '毛線球全部回家了。']), 1.8); } });
  $('lvBtn').addEventListener('click', () => { initAudio(); openLevels(); });
  $('go').addEventListener('click', () => { initAudio(); sfx.meow(); loadLevel(firstOpen()); });
  $('again').addEventListener('click', () => { initAudio(); loadLevel(lastRes && lastRes.last ? 0 : li + 1); });
  $('replay').addEventListener('click', () => { initAudio(); loadLevel(li, true); });
  $('pick').addEventListener('click', () => { initAudio(); openLevels(); });
  $('lvClose').addEventListener('click', () => { $('levels').hidden = true; if (state === 'result') $('sheet').hidden = false; else if (state === 'levels') { state = 'play'; $('ctrl').hidden = false; } });
  function firstOpen() { for (let i = 0; i <= prog.u; i++) if (!prog.s[i]) return i; return prog.u; }

  function openLevels() {
    const grid = $('lvGrid'); grid.innerHTML = '';
    LEVELS.forEach((L, i) => {
      const b = document.createElement('button'); b.type = 'button';
      const s = prog.s[i] || 0, open = i <= prog.u;
      b.disabled = !open; if (i === li && state !== 'title') b.className = 'cur';
      b.innerHTML = `<b>${i + 1}</b><small>${open ? L.name : '未解鎖'}</small><i>${open ? '★'.repeat(s) + '☆'.repeat(3 - s) : '🔒'}</i>`;
      b.setAttribute('aria-label', `第 ${i + 1} 關 ${L.name}${open ? `，${s} 顆星` : '，未解鎖'}`);
      b.addEventListener('click', () => { loadLevel(i); });
      grid.appendChild(b);
    });
    $('lvTotal').textContent = `${totalStars()} / 36 顆星`;
    $('sheet').hidden = true;
    if (state === 'play') { state = 'levels'; $('ctrl').hidden = true; }
    $('levels').hidden = false;
  }

  $('share').addEventListener('click', async () => {
    if (!lastRes) return;
    let msg = lastRes.last
      ? `我幫 KEWEI 把十二間客廳的毛線球都推回坐墊了，拿到 ${lastRes.total} / 36 顆星（${lastRes.rk} 級・${lastRes.role}）。換你：`
      : `我在《KEWEI 推毛線球》第 ${lastRes.lv} 關用 ${lastRes.moves} 步過關（標準 ${lastRes.par} 步，${lastRes.rk} 級・${lastRes.role}）。你推得比我少嗎？`;
    const url = location.protocol.startsWith('http') ? location.href : '';
    if (window.DGH_DAILY) msg = DGH_DAILY.tag + msg;
    const btn = $('share');
    try {
      if (navigator.share) { await navigator.share({ title: 'KEWEI 推毛線球', text: msg, url: url || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url ? msg + ' ' + url : msg); btn.textContent = '已複製，去貼給朋友'; }
    catch (e) { btn.textContent = '複製失敗'; }
    setTimeout(() => { btn.textContent = '傳給朋友'; }, 2200);
  });

  // ---------- loop ----------
  let last = 0;
  function step(dt) {
    T += dt;
    const k = 1 - Math.exp(-dt * (reduced ? 40 : 22));
    if (player) {
      const pdx = player.x - player.rx, pdy = player.y - player.ry;
      player.rx += pdx * k; player.ry += pdy * k;
      for (const b of boxes) {
        const ddx = (b.x - b.rx) * k, ddy = (b.y - b.ry) * k;
        b.rx += ddx; b.ry += ddy; b.roll += (ddx + ddy) * 3.2;
        b.wob = Math.max(0, b.wob - dt);
      }
    }
    squash *= Math.pow(.002, dt); tilt *= Math.pow(.01, dt);
    bumpT = Math.max(0, bumpT - dt);
    if (moodT > 0) { moodT -= dt; if (moodT <= 0) mood = 'open'; }
    blinkT -= dt; if (blinkT < 0) blinkT = rand(2, 4.5);
    if (bubble) { bubble.life -= dt; if (bubble.life <= 0) bubble = null; }
    if (state === 'clear') {
      const before = clearT; clearT += dt;
      if (before < .25 && clearT >= .25) { sfx.meow(); say(pick(CLEAR), 2); flash = .5; if (!reduced) burst(36); shake = .15; }
      if (clearT > 1.3) finishLevel();
    }
    flash = Math.max(0, flash - dt);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 3 * dt; p.vx *= .96; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
    for (const c of confetti) { c.vy += 700 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= .99; c.rot += c.vr * dt; c.life -= dt; }
    confetti = confetti.filter(c => c.life > 0 && c.y < H + 20);
    shake = Math.max(0, shake - dt);
  }
  function draw() {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    if (shake > 0 && !reduced) g.translate(rand(-2, 2) * shake * 5, rand(-2, 2) * shake * 5);
    drawBackdrop();
    drawFloor();
    drawRoom();
    drawParts();
    // warm lamp light from upper-left
    const lg = g.createRadialGradient(W * .3, B.oy, 10, W * .3, B.oy, Math.max(W, H) * .9);
    lg.addColorStop(0, 'rgba(255,240,210,.18)'); lg.addColorStop(1, 'rgba(60,35,20,.10)');
    g.fillStyle = lg; g.fillRect(0, 0, W, H);
    if (flash > 0) { g.fillStyle = `rgba(255,248,230,${flash * .6})`; g.fillRect(0, 0, W, H); }
    drawBubble();
    for (const c of confetti) {
      g.save(); g.translate(c.x, c.y); g.rotate(c.rot); g.globalAlpha = clamp(c.life, 0, 1);
      g.fillStyle = c.c; g.fillRect(-c.r, -c.r * .5, c.r * 2, c.r); g.restore();
    }
  }
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
    step(dt); draw();
    requestAnimationFrame(frame);
  }

  addEventListener('resize', fit);
  // title backdrop: first room, KEWEI idle
  loadLevel(0, true); state = 'title';
  $('title').hidden = false; $('ctrl').hidden = true; $('slip').hidden = true; $('hint').hidden = true;
  fit();
  const b0 = getBest();
  $('bestTitle').textContent = b0 == null || !totalStars() ? '十二間客廳，三十六顆星等你拿' : `星星收藏 ${totalStars()} / 36 顆・已解鎖到第 ${prog.u + 1} 關`;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
